<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>底栏图标 · 轮廓与实心对照</title><style>
*{box-sizing:border-box}body{margin:0;background:#fcfbf7;color:#263a31;font:14px/1.6 "Microsoft YaHei","PingFang SC",sans-serif}main{max-width:430px;margin:auto;padding:24px 16px}h1{margin:0 0 26px;font-size:18px;font-weight:500}h2{font-size:12px;font-weight:400;color:#7a877b;margin:0 0 12px}.group{margin-bottom:28px}.row{display:grid;grid-template-columns:repeat(4,1fr);padding:12px 0}.cell{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;color:#7a877b}.outline{color:#7a877b}.outline,.filled{width:22px;height:22px;display:block}.selected{color:#496b56}nav{border-top:1px solid #dce4d5;border-bottom:1px solid #dce4d5;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:76px;align-items:center;margin-top:22px}button{font:inherit;font-size:11px;border:0;background:transparent;color:#7a877b;min-width:44px;min-height:60px;padding:6px 0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}button .filled{display:none}button[aria-current=page]{color:#496b56}button[aria-current=page] .outline{display:none}button[aria-current=page] .filled{display:block}button:active{opacity:.7}button:focus-visible{outline:2px solid #70927a;outline-offset:-2px;border-radius:8px}.publish{display:flex;flex-direction:column;align-items:center;gap:3px;color:#7a877b}.publish>span{width:42px;height:42px;border-radius:50%;background:#496b56;color:white;display:grid;place-items:center;font:30px/1 sans-serif;margin-top:-17px}.publish small{font-size:11px}#status{font-size:12px;color:#7a877b;min-height:20px;margin:14px 0 0}button,span{font-weight:400}
</style></head><body><main><h1>底栏图标对照</h1><section class="group"><h2>未选中 · 轮廓</h2><div class="row"><div class="cell"><svg aria-hidden="true" class="outline" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" color="#263A31" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span>首页</span></div><div class="cell"><svg aria-hidden="true" class="outline" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" color="#263A31" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M14.75 9.25 13.2 13.2l-3.95 1.55 1.55-3.95 3.95-1.55Z"/><circle cx="12" cy="12" r="1"/></svg><span>发现</span></div><div class="cell"><svg aria-hidden="true" class="outline" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" color="#263A31" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="14" height="14" rx="2"/><path d="M9 9V5a3 3 0 0 1 6 0v4"/></svg><span>服务</span></div><div class="cell"><svg aria-hidden="true" class="outline" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" color="#263A31" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2Z"/></svg><span>我的</span></div></div></section><section class="group"><h2>选中 · 绿色实心</h2><div class="row"><div class="cell selected"><img class="filled" src="assets/navigation-candidate/home-filled.svg" alt=""><span>首页</span></div><div class="cell selected"><img class="filled" src="assets/navigation-candidate/discover-filled.svg" alt=""><span>发现</span></div><div class="cell selected"><img class="filled" src="assets/navigation-candidate/services-bag-filled.svg" alt=""><span>服务</span></div><div class="cell selected"><img class="filled" src="assets/navigation-candidate/user-filled.svg" alt=""><span>我的</span></div></div></section><section><h2>实际底栏 · 点按切换</h2><nav aria-label="底栏选中态预览"><button data-icon="home"><svg aria-hidden="true" class="outline" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" color="#263A31" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><img class="filled" src="assets/navigation-candidate/home-filled.svg" alt=""><span>首页</span></button><button data-icon="discover"><svg aria-hidden="true" class="outline" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" color="#263A31" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M14.75 9.25 13.2 13.2l-3.95 1.55 1.55-3.95 3.95-1.55Z"/><circle cx="12" cy="12" r="1"/></svg><img class="filled" src="assets/navigation-candidate/discover-filled.svg" alt=""><span>发现</span></button><div class="publish"><span>＋</span><small>发布</small></div><button data-icon="services-bag" aria-current="page"><svg aria-hidden="true" class="outline" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" color="#263A31" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="14" height="14" rx="2"/><path d="M9 9V5a3 3 0 0 1 6 0v4"/></svg><img class="filled" src="assets/navigation-candidate/services-bag-filled.svg" alt=""><span>服务</span></button><button data-icon="user"><svg aria-hidden="true" class="outline" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" color="#263A31" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2Z"/></svg><img class="filled" src="assets/navigation-candidate/user-filled.svg" alt=""><span>我的</span></button></nav><p id="status" role="status">当前选中：服务</p></section></main><script>document.querySelectorAll('[data-icon]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-icon]').forEach(item=>item.removeAttribute('aria-current'));button.setAttribute('aria-current','page');document.getElementById('status').textContent='当前选中：'+button.querySelector('span').textContent;}));</script></body></html>
