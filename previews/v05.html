<script id="v05-model">
var V05Model=(()=>{
 const count=value=>Array.from(String(value??'').trim()).length;
 function profileErrors(data){const errors=[];if(count(data.nickname)<1||count(data.nickname)>20)errors.push('昵称填写1—20字');if(count(data.wechat)>50)errors.push('微信号最多50字');return errors;}
 function allowed(s){return !!(s.logged&&s.phone&&s.identity==='valid'&&s.age==='eligible'&&!s.changing);}
 function initial(scenario){const s={logged:true,phone:true,identity:'pending',age:'unknown',changing:false,admin:false};if(['ready','admin','income-unknown'].includes(scenario))Object.assign(s,{identity:'valid',age:'eligible'});if(scenario==='guest')Object.assign(s,{logged:false,phone:false});if(scenario==='phone')s.phone=false;if(scenario==='under16')Object.assign(s,{identity:'valid',age:'under16'});if(scenario==='teen')Object.assign(s,{identity:'valid',age:'conditions-pending'});if(scenario==='unknown')s.identity='unknown';if(scenario==='changing')Object.assign(s,{identity:'valid',age:'eligible',changing:true});if(scenario==='admin')s.admin=true;return s;}
 const records=[
  {id:'DEMO-01',title:'代取快递 · 合成记录',kind:'errands',role:'provider',ended:true,confirmed:true,dispute:false,fee:2400,advance:5000,version:2,reason:'费用核对后更新为24元'},
  {id:'DEMO-01',title:'代取快递 · 旧版记录',kind:'errands',role:'provider',ended:true,confirmed:true,dispute:false,fee:2000,version:1,reason:'旧金额20元，已由新版替代'},
  {id:'DEMO-02',title:'物品取送 · 合成记录',kind:'errands',role:'provider',ended:true,confirmed:true,dispute:false,fee:1800,version:1,reason:'正常到期，服务费已确认'},
  {id:'DEMO-03',title:'生活代买 · 合成记录',kind:'errands',role:'provider',ended:true,confirmed:true,dispute:true,fee:1200,version:1,reason:'有效交付异议，单列查看'},
  {id:'DEMO-04',title:'维修 · 不纳入跑腿统计',kind:'repair',role:'provider',ended:true,confirmed:true,dispute:false,fee:8000,version:1},
  {id:'DEMO-05',title:'本人发单 · 不纳入服务费',kind:'errands',role:'requester',ended:true,confirmed:true,dispute:false,fee:3500,version:1},
  {id:'DEMO-06',title:'尚未到期 · 不纳入',kind:'errands',role:'provider',ended:false,confirmed:true,dispute:false,fee:900,version:1}
 ];
 function earnings(input){const map=new Map();for(const item of input){const old=map.get(item.id);if(!old||item.version>old.version)map.set(item.id,item);}const eligible=[...map.values()].filter(r=>r.kind==='errands'&&r.role==='provider'&&r.ended&&r.confirmed),active=eligible.filter(r=>!r.dispute),disputed=eligible.filter(r=>r.dispute),history=input.filter(r=>map.get(r.id)!==r&&r.kind==='errands'&&r.role==='provider'&&eligible.some(current=>current.id===r.id));return {active,disputed,history,total:active.some(r=>!Number.isInteger(r.fee)||r.fee<0)?null:active.reduce((sum,r)=>sum+r.fee,0)};}
 const money=value=>value===null?'待核对':(value/100).toFixed(2);
 const aiPack={count:20,price:190,days:180};
 function cents(text){const v=String(text).trim();return /^(?:0|[1-9]\d{0,4})(?:\.\d{1,2})?$/.test(v)&&Number(v)>0&&Number(v)<=99999.99?Math.round(Number(v)*100):null;}
 const canWithdraw=(amount,balance)=>Number.isInteger(amount)&&amount>0&&Number.isInteger(balance)&&amount<=balance;
 return {count,profileErrors,allowed,initial,records,earnings,money,aiPack,cents,canWithdraw};
})();
</script>
<script>
(()=>{'use strict';const M=V05Model,$=id=>document.getElementById(id),esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));let scenario='pending',state=M.initial(scenario),profile={nickname:'演示用户',wechat:'',avatar:''},screen='B',incomeTab='active',pendingProfile=null,reminders=false,balanceCents=0,withdrawalPending=0,paidTimes=0,paidUntil=null,walletEvents=[],draftCents=0,topupFrom='balance',payMethod='direct';const timers={};

function total(){return scenario==='income-unknown'?null:M.earnings(M.records).total;}

function qualificationAction(){if(M.allowed(state))return '已通过核验';if(state.changing)return '身份资料核对';if(state.identity==='unknown')return '查询核验进展';if(['under16','conditions-pending'].includes(state.age))return '查看资格说明';return '完善接单资格';}
function renderMy(){const logged=state.logged;$('my-content').innerHTML=`<section class="profile profile-compact">${avatar()}<div class="profile-name-row"><button class="profile-name" data-open="${logged?'D':'B'}">${logged?esc(profile.nickname):'欢迎来湘邻湘友'}</button>${logged?'<button class="profile-edit" id="edit-profile" data-open="D" aria-label="编辑个人资料">'+icon('edit')+'</button>':''}</div><div class="account-states">${logged?'<span class="login-status">'+icon('shield')+'微信已登录</span><button class="qualification" id="qualification-entry" data-open="qualification">'+icon(M.allowed(state)?'shield':'clock')+'<span>'+qualificationAction()+'</span><span class="entry-arrow" aria-hidden="true">›</span></button>':'<button class="account-login" id="account-login" data-open="qualification">'+icon('user')+'微信登录<span class="entry-arrow" aria-hidden="true">›</span></button>'}</div></section><section class="my-card"><div class="transactions-heading"><h3>我的功能</h3><button class="earnings-entry" id="earnings-entry" data-open="E">${logged?'在湘邻湘友赚了<strong>'+M.money(total())+'</strong>'+(total()===null?'':'元'):'登录后查看跑腿服务费统计'}</button></div><div class="tool-grid">${[['addresses','folder','地址'],['contacts','message','申请'],['reviews','user','评价'],['cardbag','card','卡包']].map(([route,name,label])=>`<button class="shortcut" data-private="${route}">${icon(name)}<span>${label}</span></button>`).join('')}</div></section><section class="my-card favorites-card"><div class="favorites-heading"><h3>我的收藏</h3></div><button class="favorites-preview" data-private="favorites" aria-label="查看我的全部收藏"><span class="favorite-thumb">${icon('folder')}</span><span class="favorite-thumb">${icon('bag')}</span><span class="favorite-thumb">${icon('card')}</span><span class="favorites-more">查看更多 <b>›</b></span></button></section><section class="my-card provider-entry"><button class="menu-row" data-private="provider"><span>${icon('bag')}我的接单资料</span><small>待完善 ›</small></button></section><section class="my-card"><button class="menu-row" data-private="service-help"><span>${icon('bag')}帮助与申诉</span><small>›</small></button><button class="menu-row" data-private="bills"><span>${icon('folder')}我的佣金账单</span><small>›</small></button>${state.admin?'<button class="menu-row" data-open="admin" id="admin-entry"><span>'+icon('settings')+'运营工作台</span><small>管理账号 ›</small></button>':''}</section><p class="profile-small-note">身边的事，在这里顺手办。</p>`;}
function show(code,title,label,html,footer='',centered=false){screen=code;document.body.classList.toggle('qualification-focus',guidedQualification&&code!=='A');$('detail-scroll').classList.toggle('handoff-layout',centered);$('detail-code').textContent=['A','B','C','D','E'].includes(code)?'V05-'+code:code==='settings'?'V05-D':'V05';$('detail-title').textContent=title;$('detail-label').textContent=label;$('detail-content').innerHTML=html;$('detail-footer').innerHTML=footer;$('detail-footer').hidden=!footer;$('detail-scroll').scrollTop=0;document.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.screen===code)));}

function gateMessage(){if(!state.logged)return '登录后，可继续完善发布与接单资格。';if(!state.phone)return '验证手机号，方便双方联系。';if(state.changing)return '身份资料正在核对，当前仍可浏览和处理已有事项。';if(state.age==='under16')return '当前可浏览公开信息，暂不开放发布与接单。';if(state.age==='conditions-pending')return '先核对适用条件，浏览与已有事项仍可查看。';if(state.identity==='unknown')return '已保留本次核验状态，可查询进展。';if(M.allowed(state))return '资料已准备好，可以继续发布或接单。';return '完善必要资料，发布与接单更顺畅。';}
const qualificationOrigin=new URLSearchParams(location.search).get('from'),guidedQualification=!!V10Flow.destination(qualificationOrigin);
function qualificationNext(){const step=V10Flow.qualificationStep(state);if(step==='login')loginGate();else if(step==='phone')phone();else identity();}
function qualificationBack(){return guidedQualification?'<button class="secondary" id="qualification-back">'+(qualificationOrigin==='provider'?'返回接单资料':'返回申请')+'</button>':'<button class="secondary" data-open="B">返回资格页</button>';}
function loginGate(){const logged=state.logged;show('B',logged?'发布与接单资格':'微信登录','登录与资格分别核验',`<div class="section-intro"><div class="eyebrow">${logged?'按需完善 · 少重复填写':'把常用内容留在这里'}</div><h3>${logged?'准备好，随时用。':'下次回来，\n继续手头的事。'}</h3><p>${gateMessage()}</p></div><section class="panel"><div class="status-row"><div><h4>微信登录</h4><p>登录用于管理本人的内容</p></div><span class="status-chip ${logged?'':'pending'}">${logged?'已登录':'待登录'}</span></div><div class="status-row"><div><h4>联系电话</h4><p>${state.phone?'微信手机号验证已完成（演示）':'使用微信手机号验证，单独征得同意'}</p></div>${state.phone?'<span class="status-chip">已验证</span>':'<button data-open="phone">去验证</button>'}</div><div class="status-row"><div><h4>身份与发布接单资格</h4><p>${state.changing?'身份变更转人工核对':M.allowed(state)?'姓名与身份证信息已核验（演示）':'仅在发布、接单时核验必要信息'}</p></div><button data-open="C">${state.identity==='unknown'?'查询进展':M.allowed(state)?'查看状态':'去完善'}</button></div></section>${!logged?'<section class="panel"><label class="check-line"><input type="checkbox" id="login-consent"><span>我已阅读<button data-open="agreements">服务与隐私说明</button>，同意本次登录。</span></label><p class="hint">本地仅演示微信登录，不会获取账号信息。</p></section>':''}<div class="error" id="gate-error" role="alert" hidden></div>`,!logged?(guidedQualification?qualificationBack():'<button class="secondary" data-open="browse">先随便看看</button>')+'<button class="primary" id="login-button">微信登录（演示）</button>':'<button class="secondary" data-open="browse">继续浏览</button><button class="primary" id="continue-operation" '+(M.allowed(state)?'':'disabled')+'>继续发布或接单</button>');}
function phone(){if(!state.logged){loginGate();return;}show('phone','验证联系电话','单独确认手机号授权',`<div class="section-intro"><h3>留个电话，联系更方便。</h3><p>采用微信手机号验证，不使用手填号码替代。</p></div><section class="panel"><label class="check-line"><input type="checkbox" id="phone-consent"><span>我同意本次微信手机号验证。</span></label><p class="hint">本地演示不会读取真实号码。</p></section><div class="error" id="phone-error" role="alert" hidden></div>`,qualificationBack()+'<button class="primary" id="verify-phone">同意并验证（演示）</button>');}
function identity(){if(!state.logged){loginGate();return;}const valid=M.allowed(state),pending=state.identity==='unknown';if(state.changing){show('C','身份资料核对','人工处理入口',`<div class="message-status"><div class="result-icon">···</div><h3>身份资料正在核对</h3><p>新发布、接单暂缓，已有事项仍可处理。<br>旧身份的交易与授权不会转给新身份。</p></div>`,qualificationBack()+'<button class="primary" data-open="identity-help">查看处理入口</button>');return;}if(valid){show('C','身份与资格','本人核验状态',`<div class="message-status"><div class="result-icon">✓</div><h3>资料已准备好</h3><p>姓名与身份证信息已核验（演示）<br>不公开真实姓名、证件或生日。</p></div><div class="notice">当前可以继续发布或接单，正式操作时仍需校验有效状态。</div>`,'<button class="secondary" data-open="identity-help">身份变更处理</button><button class="primary" id="continue-operation">继续原操作</button>');return;}show('C','身份与资格核验','仅演示合成资料',`<div class="section-intro"><div class="eyebrow">完善一次 · 按有效状态复用</div><h3>准备好发布与接单。</h3><p>核验姓名与证件信息，并确认适用的发布接单资格。</p></div><section class="panel"><div class="field"><label for="verify-name">姓名</label><input id="verify-name" class="readonly-input" readonly value="演示姓名（合成）" aria-describedby="identity-demo-note"></div><div class="field"><label for="verify-document">身份证号</label><input id="verify-document" class="readonly-input" readonly value="合成示例 · 非真实证件"></div><p class="hint" id="identity-demo-note">真实核验能力尚未开通，本页仅使用只读示意，勿填写真实证件。</p><label class="check-line"><input type="checkbox" id="identity-consent" ${pending?'disabled':''}><span>我已阅读<button data-open="verify-purpose">核验用途说明</button>，同意本次必要核验。</span></label></section>${state.age==='under16'||state.age==='conditions-pending'?'<div class="notice warning">'+gateMessage()+'</div>':''}<div class="notice" id="identity-status" role="status" ${pending?'':'hidden'}>${pending?'本次结果正在核对，可查询进展。':''}</div><div class="error" id="identity-error" role="alert" hidden></div><button class="link-button" data-open="identity-help">身份变更或信息需更正 ›</button>`,pending?qualificationBack()+'<button class="primary" id="query-identity">查询核验进展</button>':qualificationBack()+'<button class="primary" id="verify-identity" '+(state.age==='under16'||state.age==='conditions-pending'?'disabled':'')+'>提交核验（演示）</button>');}
function profileEditor(){if(!state.logged){loginGate();return;}show('D','个人资料','仅本人修改',`<form id="profile-form" novalidate><section class="panel"><div class="profile-editor-avatar">${avatar()}<div><label class="link-button" for="avatar-input" style="cursor:pointer">更换头像 ›</label><p class="hint">JPEG/PNG · 每张≤5MB</p></div><input type="file" id="avatar-input" accept="image/jpeg,image/png" hidden></div><div class="field"><label for="nickname">昵称<span class="optional">1—20字</span></label><input id="nickname" name="nickname" value="${esc(profile.nickname)}" autocomplete="off"></div><div class="field"><label for="wechat">微信号<span class="optional">选填 · 最多50字</span></label><input id="wechat" name="wechat" value="${esc(profile.wechat)}" autocomplete="off"></div><div class="status-row"><div><h4>联系电话</h4><p>${state.phone?'微信手机号已验证（演示）':'按需使用微信验证手机号'}</p></div><button type="button" data-open="phone">${state.phone?'重新验证':'去验证'}</button></div><p class="hint">微信号由本人填写，不代表平台已验证其归属。</p></section><div class="error" id="profile-error" role="alert" hidden></div></form>`,'<button class="secondary" data-open="settings">返回设置</button><button class="primary" id="save-profile">保存资料</button>');}
function settings(){show('settings','设置','资料与常用设置',`<section class="panel"><button class="menu-row" data-open="B"><span>${icon('shield')}微信登录与资格</span><small>查看 ›</small></button><button class="menu-row" data-open="D"><span>${icon('user')}个人资料</span><small>›</small></button><button class="menu-row" data-private="reminders"><span>${icon('clock')}提醒设置</span><small>›</small></button><button class="menu-row" data-open="privacy"><span>${icon('shield')}隐私与授权</span><small>›</small></button><button class="menu-row" data-open="identity-help"><span>${icon('user')}身份变更处理</span><small>›</small></button><button class="menu-row" data-open="help"><span>${icon('message')}帮助与申诉</span><small>›</small></button><button class="menu-row" data-private="close-account"><span>${icon('settings')}账号注销</span><small>查看条件 ›</small></button></section><p class="hint">账号操作前会说明影响，由你另行确认。</p>`);}
function income(){if(!state.logged){loginGate();return;}const result=M.earnings(M.records),rows=result[incomeTab];show('E','跑腿服务费统计','本人接单 · 按到期记录',`<section class="panel"><div class="eyebrow">有效服务费累计</div><div class="stat-total">${M.money(total())}${total()===null?'':'<small style="font-size:12px;margin-left:5px">元</small>'}</div><p class="hint">按到期订单统计 · 非到账金额<br>仅本人跑腿接单服务费，垫付、货款另计；未先扣佣金。</p></section><div class="income-tabs" role="group" aria-label="统计记录分类"><button data-income="active" aria-pressed="${incomeTab==='active'}">当前有效</button><button data-income="disputed" aria-pressed="${incomeTab==='disputed'}">有效异议单列</button><button data-income="history" aria-pressed="${incomeTab==='history'}">更正历史</button></div>${scenario==='income-unknown'?'<div class="notice warning">部分记录正在核对，暂不显示合计金额。</div>':''}<div id="income-records">${rows.map(r=>`<article class="income-record"><div class="record-top"><strong>${esc(r.title)}</strong><b>${M.money(r.fee)}元</b></div><p>${r.id} · 合成服务记录<br>${esc(r.reason||'')}<br>${incomeTab==='active'?'来源：正常到期，当前版本服务费已确认':incomeTab==='disputed'?'当前未纳入主累计':'仅供更正核对，不重复计入累计'}</p><button data-record="${r.id}">查看必要交易历史 ›</button></article>`).join('')||'<div class="empty">这类记录还没有内容。</div>'}</div><button class="link-button" data-private="bills">佣金单独看账单 ›</button>`);}
function documents(route){const copy={agreements:['服务与隐私说明','了解本次登录','登录用于管理本人发布、申请、收藏、草稿等内容。手机号验证、身份核验按用途分别征求同意。','本页仅展示说明结构，不是已启用服务的正式协议。'],privacy:['隐私与授权','你的资料，按用途使用。','昵称公开；联系方式、详细地址与领取码按当前授权范围使用。原始完整姓名与证件号不进入普通资料、草稿或公开内容。','查看、撤回授权和数据请求，正式产品将按具体对象处理；本页不修改真实授权。'],'verify-purpose':['核验用途说明','用于确认发布与接单资格','本次核验检查姓名与证件信息一致性及适用资格，不收证件照或人脸，不公开真实姓名、证件或生日。','真实服务的提供方、保存期限和正式授权文本须在启用前确认；本页使用只读合成示例。']}[route];show(route,copy[0],'说明与授权分别展示',`<section class="panel document-copy"><h3>${copy[1]}</h3><p>${copy[2]}</p><p>${copy[3]}</p></section>`,route==='verify-purpose'?'<button class="primary" data-open="C">返回核验</button>':'<button class="primary" data-open="B">返回登录与资格</button>');}
function handoff(route){const map={directory:['服务','订单进展，集中查看。','我发布的与我承接的统一在服务页管理。','V06/V07'],messages:['我的消息','把与你有关的进展集中查看。','交易进展、联系申请与必要提醒只向相应本人展示。','V14'],posts:['我发布的','发布过的内容，随时管理。','发布后可查看申请、核对记录或复用公开内容。','V06'],services:['我服务的','把正在做的事，接着办好。','已有交易按当前状态开放操作，不因新资格待核验丢失处理入口。','V07'],contacts:['联系申请','联系进展，集中查看。','仅本人相关申请与授权记录可见，未获授权仍保持打码。','V08'],reviews:['我评价的','留过的评价，随时回看。','只展示本人已有评价，评价资格依据对应交易或实际经历。','V18'],favorites:['我的收藏','下次想找，回来就有。','仅本人收藏；失效内容不恢复联系方式权限。','V09'],drafts:['我的草稿','没写完的，下次接着写。','草稿允许不完整，不自动发布；仅明确保存才保留。','V09'],addresses:['私人地址簿','常用地址，少填几遍。','仅本人使用；任务选入后的地址快照不会随地址簿修改。','V09'],bills:['我的佣金账单','每一笔，核对清楚。','按实际账单查看应缴、已缴与争议；跑腿服务费统计不表示到账，客户款仍由双方直接结算。','V22'],'service-help':['服务管理与帮助','把事情说清楚，便于核对。','已有订单、费用和必要申诉入口保持可用。','V14'],help:['帮助与申诉','把事情说清楚，便于核对。','按对应记录查看问题与处理进展；不承诺全天候值守或固定解决结果。','V14'],'identity-help':['身份变更处理','核对资料，保留已有事项。','身份变更走人工处理，期间暂停新发布、接单。原身份交易、授权和评价不会自动转给新身份。','V14'],'close-account':['账号注销','先核对，再决定。','已有交易、账单、抵扣及未消费余额需按对应规则核对，不直接清零或强迫放弃。此处不提交真实注销申请。','V22'],admin:['运营工作台','处理进展，按记录核对。','仅管理账号可用。所有真实运营权限与内容仍须由服务端校验。','V15']}[route];if(!map)return;if(route==='admin'&&!state.admin){show('restricted','查看权限','保留当前资料','<div class="notice">此入口仅供管理账号使用。</div>');return;}show(route,map[0],map[3]+'页面入口',`<div class="section-intro"><h3>${map[1]}</h3><p>${map[2]}</p></div><section class="panel"><p class="hint">本次展示 V05 的入口衔接。完整操作属于 ${map[3]}，本页不会创建申请、发送消息或改动真实记录。</p></section>`,route==='posts'||route==='drafts'?'<a class="primary" href="v04.html" style="text-align:center;text-decoration:none">去发布预览</a>':'<button class="primary" data-open="A">返回个人页</button>',true);}
const baseHandoff=handoff;
handoff=function(route){if(route==='directory'||route==='service-notifications'){location.href='services.html'+(route==='service-notifications'?'?view=notices':'');return;}baseHandoff(route);};
let serviceUnread=2;const notificationHandoff=handoff;
handoff=function(route){notificationHandoff(route);};
document.addEventListener('click',event=>{if(!event.target.closest('[data-clear-service-notices]'))return;serviceUnread=0;handoff('directory');toast('my','未读角标已隐藏');});
function cardbag(){show('cardbag','卡包','本人卡片与余额',`<div class="section-intro"><h3>常用的，都收在这里。</h3><p>整理需求、查看余额，随手就能找到。</p></div><section class="pack-card" id="ai-pack"><div class="pack-heading"><span class="pack-icon">${icon('card')}</span><h3>AI整理卡</h3></div><div class="pack-value">可用 <strong>${3+paidTimes}</strong> 次</div><button class="pack-action" data-open="ai">查看详情 <span>›</span></button></section><section class="pack-card balance-pack" id="balance-pack"><div class="pack-heading"><span class="pack-icon">${icon('card')}</span><h3>余额</h3></div><div class="pack-value"><strong>¥${M.money(balanceCents)}</strong></div><button class="pack-action" data-open="balance">查看明细 <span>›</span></button></section><p class="hint">次数与金额均为合成示例，不代表真实账户权益。</p>`,'<button class="primary" data-open="A">返回个人页</button>');}
function aiTools(){show('ai','AI整理卡','本人可用权益',`<div class="section-intro"><h3>说说需求，少填几步。</h3><p>把一段话整理成发布内容，核对后再填入。</p></div><section class="panel"><h3>可用 <span style="color:var(--green)">${3+paidTimes}次</span></h3><dl>${moneyRow('本月免费','3次')}${paidTimes?moneyRow('已补充次数',paidTimes+'次')+moneyRow('购买次数有效至',expiryLabel()):''}</dl><button class="primary replenish-button" data-open="buy-ai">补充次数</button><p class="hint">合成权益示例，未读取真实账号次数。</p></section>`,'<button class="secondary" data-open="cardbag">返回卡包</button><a class="primary" href="v04.html" style="text-align:center;text-decoration:none">去整理需求</a>');}
function balance(){show('balance','余额','独立于服务费统计',`<section class="panel"><div class="eyebrow">可用余额 · 合成示例</div><div class="stat-total" style="color:var(--ink)">¥${M.money(balanceCents)}</div><div class="balance-actions"><button class="primary" data-open="topup">充值</button><button class="secondary" data-open="withdraw">提现</button></div>${withdrawalPending?'<p class="hint">提现申请中 ¥'+M.money(withdrawalPending)+' · 尚未到账</p>':''}<p class="hint">与跑腿服务费统计、佣金账单分别记录。</p></section><div class="notice">未消费充值本金长期有效，可申请提现退回；购买次数按自身有效期使用。</div><section class="panel"><h3>余额明细</h3>${walletEvents.length?walletEvents.map(item=>'<div class="kv"><dt>'+esc(item.label)+'</dt><dd>'+esc(item.value)+'</dd></div>').join(''):'<div class="empty" style="padding:13px 0">充值、使用后的记录会显示在这里。</div>'}</section><p class="hint">本页为演示，不产生真实充值、消费或退款。</p>`,'<button class="primary" data-open="cardbag">返回卡包</button>');}
function moneyRow(label,value){return '<div class="kv"><dt>'+esc(label)+'</dt><dd>'+esc(value)+'</dd></div>';}
function expiryLabel(){if(paidTimes>M.aiPack.count)return '各批次自到账起180天';return paidUntil?new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(paidUntil):'到账后180天';}
function recharge(){show('topup','充值','本页资金演示',`<div class="section-intro"><h3>按需补充，用时更顺手。</h3><p>余额可用于已开放的平台自营服务。</p></div><section class="panel"><p class="hint">当前可用余额 ¥${M.money(balanceCents)}</p><div class="field" style="margin-top:16px"><label for="topup-amount">充值金额</label><div class="money"><span>¥</span><input id="topup-amount" class="wallet-amount" inputmode="decimal" autocomplete="off" value="${draftCents?M.money(draftCents):''}" placeholder="输入本次需要的金额"></div></div><p class="hint">本金长期有效，未消费部分可申请退回；不设充值赠金。</p></section><div class="error" id="wallet-error" role="alert" hidden></div><p class="wallet-actions-note">仅本地演示，不会发起真实支付。</p>`,'<button class="secondary" data-open="'+(topupFrom==='buy-ai'?'buy-ai':'balance')+'">返回</button><button class="primary" id="review-recharge">核对充值</button>');}
function reviewRecharge(){const cents=M.cents($('topup-amount').value);if(cents===null||balanceCents+cents>9999999){error('wallet-error','请输入有效金额，最多2位小数。');return;}draftCents=cents;show('topup-review','确认充值','金额核对',`<section class="panel"><h3>本次充值 ¥${M.money(draftCents)}</h3><dl>${moneyRow('原有余额','¥'+M.money(balanceCents))}${moneyRow('充值后余额','¥'+M.money(balanceCents+draftCents))}</dl><p class="hint">本金长期有效，未消费部分可申请退回。</p></section><div class="notice">仅为充值演示，没有真实支付。</div>`,'<button class="secondary" id="edit-recharge">返回修改</button><button class="primary" id="confirm-recharge">确认充值（演示）</button>');}
function withdraw(){draftCents=0;show('withdraw','提现','退回未消费充值本金',`<div class="section-intro"><h3>未用的本金，可以申请退回。</h3><p>提现不包括跑腿服务费统计中的金额。</p></div><section class="panel"><dl>${moneyRow('可申请本金','¥'+M.money(balanceCents))}${withdrawalPending?moneyRow('申请处理中','¥'+M.money(withdrawalPending)):''}</dl><div class="field"><label for="withdraw-amount">申请金额</label><div class="money"><span>¥</span><input id="withdraw-amount" class="wallet-amount" inputmode="decimal" autocomplete="off" placeholder="不超过可申请本金"></div></div><p class="hint">申请后核对原充值记录与退回方式；提交申请不代表已经到账。</p></section>${!balanceCents?'<div class="notice">当前暂无可提现本金。</div>':''}<div class="error" id="wallet-error" role="alert" hidden></div>`,'<button class="secondary" data-open="balance">返回余额</button><button class="primary" id="review-withdraw" '+(balanceCents?'':'disabled')+'>核对申请</button>');}
function reviewWithdraw(){const amount=M.cents($('withdraw-amount').value);if(!M.canWithdraw(amount,balanceCents)){error('wallet-error','申请金额应大于0，且不超过可用本金。');return;}draftCents=amount;show('withdraw-review','确认提现申请','未消费本金核对',`<section class="panel"><h3>申请退回 ¥${M.money(draftCents)}</h3><dl>${moneyRow('当前可用本金','¥'+M.money(balanceCents))}${moneyRow('申请后可用本金','¥'+M.money(balanceCents-draftCents))}</dl><p class="hint">本页演示将申请金额单列为处理中，不表示退款到账。真实受理、退回方式及到账以核对结果为准。</p></section>`,'<button class="secondary" data-open="withdraw">返回修改</button><button class="primary" id="confirm-withdraw">提交申请（演示）</button>');}
function aiPurchase(){show('buy-ai','补充AI次数','本页购买演示',`<div class="hero"><div class="eyebrow">继续让AI帮你整理</div><h3>${M.aiPack.count}次 · ¥${M.money(M.aiPack.price)}</h3><p>到账后${M.aiPack.days}天有效，成功返回可用整理结果才扣次，技术失败不扣。</p></div><section class="panel"><h3>选择支付方式</h3><div class="options"><label><input name="pack-payment" type="radio" value="direct" ${payMethod==='direct'?'checked':''}>微信支付</label><label><input name="pack-payment" type="radio" value="balance" ${payMethod==='balance'?'checked':''}>余额支付</label></div><div id="purchase-summary"></div></section><p class="hint">仅购买演示，不发起真实支付或发放真实次数。</p>`,'<button class="secondary" data-open="ai">返回整理卡</button><button class="primary" id="confirm-ai-purchase"></button>');paymentSummary();}
function paymentSummary(){const need=Math.max(0,M.aiPack.price-balanceCents);$('purchase-summary').innerHTML='<dl>'+moneyRow('本次购买',M.aiPack.count+'次 · ¥'+M.money(M.aiPack.price))+(payMethod==='balance'?moneyRow('可用余额','¥'+M.money(balanceCents))+(need?moneyRow('还需补充','¥'+M.money(need)):''):'')+'</dl>';$('confirm-ai-purchase').textContent=payMethod==='balance'&&need?'补足 ¥'+M.money(need)+'（演示）':'确认购买（演示）';}
function purchasePack(){const pack=M.aiPack;if(payMethod==='balance'&&balanceCents<pack.price){topupFrom='buy-ai';draftCents=pack.price-balanceCents;recharge();return;}if(payMethod==='balance'){balanceCents-=pack.price;walletEvents.unshift({label:'AI次数包 · 演示购买',value:'−¥'+M.money(pack.price)});}paidTimes+=pack.count;paidUntil=new Date(Date.now()+pack.days*86400000);show('pack-result','演示：次数已补充','合成购买结果',`<div class="message-status"><div class="result-icon">✓</div><h3>可以继续整理需求了。</h3><p>本页模拟补充${pack.count}次，实际到账后${pack.days}天有效。<br>没有真实支付或权益发放。</p></div>`,'<button class="secondary" data-open="cardbag">返回卡包</button><button class="primary" data-open="ai">查看整理卡</button>');}
document.addEventListener('change',e=>{if(e.target.name==='pack-payment'){payMethod=e.target.value;paymentSummary();}});
document.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;const walletButtons=['review-recharge','edit-recharge','confirm-recharge','review-withdraw','confirm-withdraw','confirm-ai-purchase'];if(!walletButtons.includes(button.id))return;if(!state.logged){loginGate();return;}
 if(button.id==='review-recharge')reviewRecharge();if(button.id==='edit-recharge')recharge();
 if(button.id==='confirm-recharge'&&draftCents>0){button.disabled=true;balanceCents+=draftCents;walletEvents.unshift({label:'充值 · 本地演示',value:'+¥'+M.money(draftCents)});draftCents=0;if(topupFrom==='buy-ai'){aiPurchase();toast('detail','演示余额已补足，请确认购买次数。');}else{balance();toast('detail','演示余额已更新。');}}
 if(button.id==='review-withdraw')reviewWithdraw();if(button.id==='confirm-withdraw'&&M.canWithdraw(draftCents,balanceCents)){button.disabled=true;balanceCents-=draftCents;withdrawalPending+=draftCents;walletEvents.unshift({label:'提现申请 · 处理中',value:'¥'+M.money(draftCents)+'（未到账）'});draftCents=0;balance();toast('detail','演示：申请已记录，尚未到账。');}
 if(button.id==='confirm-ai-purchase'){button.disabled=true;purchasePack();}
});
function remindersPage(){show('reminders','提醒设置','非结果类提醒',`<section class="panel"><label class="switch-control">非结果类到期 / 催回复提醒<input type="checkbox" id="reminder-switch" ${reminders?'checked':''}></label><p class="hint">这只影响非结果类提醒；交易结果、账单和必要站内记录仍保留。</p></section><div class="notice">本页开关只演示设置，不发送微信消息；微信订阅需要另行授权。</div>`,'<button class="primary" id="save-reminders">保存设置（演示）</button>');}
function open(route){if(route==='qualification'){qualificationNext();$('detail-phone').scrollIntoView({block:'start',behavior:'auto'});return;}if(route==='provider'){if(!state.logged){loginGate();return;}location.href='v10.html';return;}if(['favorites','drafts','addresses'].includes(route)){if(!state.logged){loginGate();return;}location.href='v09.html?page='+({favorites:'A',drafts:'B',addresses:'C'})[route];return;}if(route==='contacts'){if(!state.logged){loginGate();return;}location.href='v08.html';return;}if(route==='directory'){location.href='services.html';return;}if(['posts','services'].includes(route)&&state.logged){location.href='services.html?tab='+(route==='posts'?'published':'accepted');return;}if(['D','E','C','phone','ai','balance','cardbag','reminders','topup','withdraw','buy-ai'].includes(route)&&!state.logged){loginGate();return;}if(route==='A'){renderMy();show('A','常用内容，随手可用','个人页概览','<div class="section-intro"><h3>身边的事，顺手办。</h3><p>资料、订单和常用工具，都可以从个人页进入。</p></div><section class="panel"><button class="menu-row" data-open="D"><span>完善个人资料</span><small>›</small></button><button class="menu-row" data-open="B"><span>查看发布与接单资格</span><small>›</small></button></section>');return;}if(route==='B')return loginGate();if(route==='C')return identity();if(route==='D')return profileEditor();if(route==='E')return income();if(route==='settings')return settings();if(route==='phone')return phone();if(['agreements','privacy','verify-purpose'].includes(route))return documents(route);if(route==='cardbag')return cardbag();if(route==='ai')return aiTools();if(route==='balance')return balance();if(route==='topup'){topupFrom='balance';return recharge();}if(route==='withdraw')return withdraw();if(route==='buy-ai')return aiPurchase();if(route==='reminders')return remindersPage();if(route==='browse'){show('browse','继续浏览','公开内容可继续查看',`<div class="section-intro"><h3>先看看身边有什么。</h3><p>无需填写身份信息，也可以浏览公开需求与服务。</p></div>`,'<button class="secondary" data-open="B">返回资格页</button><a class="primary" href="v01-v02.html" style="text-align:center;text-decoration:none">打开首页预览</a>');return;}handoff(route);}
function commitProfile(){profile={...profile,...pendingProfile};pendingProfile=null;renderMy();profileEditor();toast('detail','资料已保存，下次回来更顺手。');}
$('scenario').addEventListener('change',()=>{scenario=$('scenario').value;state=M.initial(scenario);V10Flow.invalidate();pendingProfile=null;renderMy();guidedQualification?qualificationNext():loginGate();});$('screen-nav').addEventListener('click',e=>{const button=e.target.closest('[data-screen]');if(button)open(button.dataset.screen);});$('detail-back').addEventListener('click',()=>{if(guidedQualification&&['B','C','phone'].includes(screen)){location.href=V10Flow.destination(qualificationOrigin);return;}open(screen==='B'?'A':'B');});
document.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.id==='qualification-back'){location.href=V10Flow.destination(qualificationOrigin);return;}if(button.dataset.open)return open(button.dataset.open);if(button.dataset.private){if(!state.logged)return loginGate();return open(button.dataset.private);}if(button.dataset.income){incomeTab=button.dataset.income;income();return;}if(button.dataset.record){const r=M.records.filter(x=>x.id===button.dataset.record);show('record','必要交易历史','仅本人合成记录',`<section class="panel"><h3>${esc(button.dataset.record)}</h3>${r.sort((a,b)=>b.version-a.version).map(x=>'<div class="kv"><dt>记录版本 '+x.version+'</dt><dd>'+M.money(x.fee)+'元<br>'+esc(x.reason||'')+'</dd></div>').join('')}<p class="hint">仅核对必要服务费历史，不恢复旧地址、凭据或联系方式权限。</p></section>`,'<button class="primary" data-open="E">返回服务费统计</button>');return;}
if(button.id==='login-button'){if(!$('login-consent').checked){error('gate-error','阅读并同意本次登录，即可继续。');return;}state.logged=true;renderMy();guidedQualification?qualificationNext():loginGate();toast('detail','演示：已登录，手机号和资格分别完善。');}
if(button.id==='verify-phone'){if(!$('phone-consent').checked){error('phone-error','请确认本次手机号验证授权。');return;}if(scenario==='unavailable'){error('phone-error','已保留当前资料，可稍后再验证。');return;}state.phone=true;renderMy();guidedQualification?qualificationNext():loginGate();toast('detail','演示：手机号验证状态已更新。');}
if(button.id==='verify-identity'){if(!$('identity-consent').checked){error('identity-error','阅读并同意本次必要核验，即可继续。');return;}const failures={mismatch:'请核对姓名与证件信息后再试。',format:'请核对信息格式后再试。',norecord:'请核对信息，或查看人工处理入口。',unavailable:'资料已保留，可稍后重试或继续浏览。'};if(failures[scenario]){error('identity-error',failures[scenario]);return;}if(!state.phone){error('identity-error','先完成手机号验证，再继续资格核验。');return;}state.identity='valid';state.age='eligible';renderMy();identity();toast('detail','演示：资格状态已更新。');}
if(button.id==='query-identity'){error('identity-error','');$('identity-status').hidden=false;$('identity-status').textContent='仍在核对本次结果，可稍后查询或继续浏览。';}
if(button.id==='continue-operation'&&M.allowed(state)){const destination=V10Flow.destination(new URLSearchParams(location.search).get('from'));if(destination){V10Flow.grant(state);location.href=destination;return;}show('continue','资料已准备好','继续原操作',`<div class="message-status"><div class="result-icon">✓</div><h3>接着把需求办好。</h3><p>仅演示资格满足后的衔接，实际发布与接单须再次校验当前状态。</p></div>`,'<button class="secondary" data-open="A">返回个人页</button><a class="primary" href="v04.html" style="text-align:center;text-decoration:none">继续发布预览</a>');}
if(button.id==='save-profile'){const next={nickname:$('nickname').value.trim(),wechat:$('wechat').value.trim()},errors=M.profileErrors(next);if(errors.length){error('profile-error',errors.join('；'));return;}pendingProfile=next;if(next.wechat!==profile.wechat){show('contact-impact','核对联系方式变更','保存前明确确认',`<section class="panel"><h3>让联系方式保持最新。</h3><p class="document-copy">更换微信号后，目录旧联系授权会撤销；当前合法交易双方按规则获知变更。</p><p class="hint">本页仅展示影响，不发送真实通知；微信号不代表已验证归属。</p></section>`,'<button class="secondary" id="cancel-profile-change">返回修改</button><button class="primary" id="confirm-profile-change">确认保存</button>');}else commitProfile();}
if(button.id==='confirm-profile-change'&&pendingProfile)commitProfile();if(button.id==='cancel-profile-change'){const draft=pendingProfile;profileEditor();if(draft){$('nickname').value=draft.nickname;$('wechat').value=draft.wechat;}pendingProfile=null;}
if(button.id==='save-reminders'){reminders=$('reminder-switch').checked;toast('detail','演示：提醒偏好已保存。');}
});
document.addEventListener('submit',e=>{if(e.target.id==='profile-form')e.preventDefault();});document.addEventListener('change',e=>{if(e.target.id!=='avatar-input')return;const file=e.target.files[0];if(!file)return;if(!['image/jpeg','image/png'].includes(file.type)||file.size>5*1024*1024){error('profile-error','选择JPEG/PNG图片，每张不超过5MB。');e.target.value='';return;}const draft={nickname:$('nickname').value,wechat:$('wechat').value};profile.avatar=URL.createObjectURL(file);renderMy();profileEditor();$('nickname').value=draft.nickname;$('wechat').value=draft.wechat;toast('detail','头像已在本页更新。');});const entry=new URLSearchParams(location.search).get('entry');if(['guest','phone'].includes(entry))state=M.initial(entry);const sharedQualification=V10Flow.read();if(sharedQualification&&!['guest','phone'].includes(entry))Object.assign(state,sharedQualification);renderMy();guidedQualification?qualificationNext():loginGate();
})();
</script>
</body></html>
