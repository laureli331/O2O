<script id="v04-model">
var V04Model=(()=>{
 const kinds={repair:{name:'维修需求',code:'B'},other:{name:'其它需求',code:'C'},errands:{name:'跑腿需求',code:'D'},idle:{name:'闲置物品',code:'E'}};
 const residentPolicy={freePerMonth:3,packCount:20,packPriceCents:190,packDays:180};
 const shortfall=(price,balance)=>Math.max(0,price-balance);
 const tasks=['取送物品','代买日用品/菜/饭','代打印送达','洗护/维修物品取送'];
 const configs={regions:['演示社区'],repair:['家电维修（演示）','水电维修（演示）'],idle:['家居用品（演示）','数码用品（演示）']};
 const count=value=>Array.from(String(value??'').trim()).length;
 function amount(value,zero=false){return /^(?:0|[1-9]\d{0,4})(?:\.\d{1,2})?$/.test(String(value))&&Number(value)<=99999.99&&(zero?Number(value)>=0:Number(value)>0);}
 const timestamp=value=>Date.parse(value+':00+08:00');
 function validate(kind,data,now=Date.now()){
  const errors=[];for(const [key,label,max] of [['title','标题',30],['note','说明',1000]])if(count(data[key])<1||count(data[key])>max)errors.push(label+'需1—'+max+'字');
  if(!configs.regions.includes(data.region))errors.push('选择村/社区');if(count(data.landmark)>50)errors.push('地标最多50字');
  if(['repair','idle'].includes(kind)&&!configs[kind].includes(data.category))errors.push('选择'+(kind==='repair'?'维修':'物品')+'分类');
  if(kind!=='idle'){const start=timestamp(data.start),end=timestamp(data.end);if(!Number.isFinite(start)||start<=now)errors.push(data.start?'开始时间须在未来':'填写开始时间');if(!Number.isFinite(end)||end<=start)errors.push(data.end?'到期须晚于开始':'填写到期时间');if(Number.isFinite(end)&&end>now+720*3600000)errors.push('到期时间过远（最多720小时）');}
  if(kind==='idle'&&(!['fixed','negotiable'].includes(data.priceMode)||(data.priceMode==='fixed'&&!amount(data.price))))errors.push('填写价格或选择面议');
  if(kind==='errands'){
   if(!tasks.includes(data.task))errors.push('选择任务类型');if(!amount(data.fee))errors.push('填写有效服务费');
   const buy=data.task===tasks[1];if(buy){if(!count(data.purchase))errors.push('填写购买内容');if(!amount(data.goods))errors.push('填写商品费用估算');}
   if(!buy&&!count(data.pickup))errors.push('填写取件地址');if(!count(data.delivery))errors.push('填写送达地址');
   if(data.phone&&!/^\d{11}$/.test(data.phone))errors.push('收件电话需11位');
  }
  if((data.images||[]).length>9)errors.push('图片最多9张');return errors;
 }
 function copyPublic(kind,data){const keys=['title','note','category','region','landmark','price','priceMode','task','purchase'];return Object.fromEntries(keys.map(key=>[key,data[key]||'']));}
 const sample={repair:'洗衣机无法启动，希望上门检查原因。',other:'帮忙搬一下书桌，移到房间另一侧。',errands:'帮忙代取一个快递，服务费12元。',idle:'出售一个闲置书架，价格80元。',multi:'帮忙代取一个快递；帮忙代买一袋大米。'};
 function privacy(text){const match=String(text).match(/1\d{10}|\d{17}[\dXx]|(?:微信|领取码|取件码|身份证|详细地址)\s*[:：]?\s*[^，。；\s]+|\S{1,12}(?:路\d+号|栋\d+|室\d+)/);return match?match[0]:'';}
 function candidate(kind,text){if(kind==='repair'&&text===sample.repair)return {title:'洗衣机无法启动',note:text};if(kind==='other'&&text===sample.other)return {title:'帮忙搬一下书桌',note:text};if(kind==='errands'&&text===sample.errands)return {title:'帮忙代取一个快递',note:text,fee:'12'};if(kind==='idle'&&text===sample.idle)return {title:'出售一个闲置书架',note:text,priceMode:'fixed',price:'80'};if(kind==='errands'&&['帮忙代取一个快递','帮忙代买一袋大米'].includes(text))return {title:text,note:text,task:text.includes('大米')?tasks[1]:tasks[0]};return null;}
 return {kinds,tasks,configs,count,amount,timestamp,validate,copyPublic,sample,privacy,candidate,residentPolicy,shortfall};

<script>

function money(key,label,required=true){return `<div class="field"><label for="f-${key}"><span>${label}${required?'<span class="req">*</span>':''}</span></label><div class="money"><span>¥</span><input name="${key}" id="f-${key}" value="${esc(data()[key])}" inputmode="decimal" autocomplete="off" placeholder="请输入金额"></div></div>`;}
function photos(){return `<div class="field"><div class="field-label"><span>${kind==='errands'?'图片附件':'公开图片'}</span><span class="optional">0—9张 · JPEG/PNG · 每张≤5MB</span></div><div class="photos">${data().images.map((item,i)=>`<div class="photo-tile"><img src="${item.url}" alt="本人选择的${item.private?'私密':'公开'}图片"><small>${item.private?'私密':'公开'}</small><button type="button" data-remove-image="${i}" aria-label="移除第${i+1}张图片">×</button></div>`).join('')}<label class="photo-add" for="image-input"><span><b>＋</b>添加图片</span></label></div><input id="image-input" type="file" accept="image/jpeg,image/png" multiple hidden>${kind==='errands'?'<label class="consent hint"><input type="checkbox" id="image-private">本次添加为私密图片（如取件凭据）</label>':''}<p class="hint">${kind==='errands'?'公开图片与私密附件分开使用；领取码、详细地址请放入私密区域。':'公开图片请勿包含联系方式、详细地址或私密凭据。'}</p></div>`;}
function renderForm(){const k=M.kinds[kind],d=data(),run=kind==='errands',idle=kind==='idle';$('form-code').textContent='V04-'+k.code;$('form-label').textContent=k.name+'表单';$('form-title').textContent=(scenario==='edit'?'编辑':'发布')+k.name;$('open-ai').hidden=false;$('source-banner').hidden=!source;$('source-banner').textContent=source;$('form-errors').hidden=true;
let html='<section class="panel">';if(run)html+=select('task','任务类型',M.tasks);html+=input('title','标题','简短说清楚你要发布什么','text',true)+`<div class="counter" id="title-count">${M.count(d.title)} / 30</div>`;html+=`<div class="field"><label for="f-note"><span>${idle?'物品说明':'需求说明'}<span class="req">*</span></span><span class="optional">最多1000字符</span></label><textarea id="f-note" name="note" rows="4" placeholder="请描述具体情况与要求">${esc(d.note)}</textarea><div class="counter" id="note-count">${M.count(d.note)} / 1000</div></div>`;if(['repair','idle'].includes(kind))html+=select('category',idle?'物品分类':'维修分类',M.configs[kind]);html+=select('region','村/社区',M.configs.regions);if(!run)html+=input('landmark','附近地标','选填，如村口、广场附近');html+='</section>';
if(run)html+='<section class="panel">'+money('fee','服务费')+'<p class="hint">接单申请者接受你填写的服务费。商品支出与垫付另行约定。</p></section>';
if(idle)html+=`<section class="panel"><h3>物品价格<span class="req">*</span></h3><div class="options"><label><input type="radio" name="priceMode" value="fixed" ${d.priceMode==='fixed'?'checked':''}>明确价格</label><label><input type="radio" name="priceMode" value="negotiable" ${d.priceMode==='negotiable'?'checked':''}>面议</label></div><div id="price-value" style="margin-top:14px" ${d.priceMode==='negotiable'?'hidden':''}>${money('price','价格')}</div><p class="hint">交易前，双方仍需确认明确金额和约定时间。</p></section>`;
if(!idle)html+='<section class="panel"><h3>时间要求</h3>'+input('start','期望服务时间','','datetime-local',true)+input('end','服务到期时间','','datetime-local',true)+'<p class="hint">填写你希望何时开始办理，以及最晚何时结束。</p></section>';
if(run){const buy=d.task===M.tasks[1];if(buy)html+='<section class="panel"><h3>代买内容</h3>'+input('purchase','购买内容','说明商品名称、数量与要求','text',true)+money('goods','商品费用估算')+'<p class="hint">这是商品费用估算，不是服务费；替代或超预算请先沟通。</p></section>';html+='<section class="panel"><h3 class="private-title">♙ 任务私密信息 <small>仅必要当事人可见</small></h3>';if(!buy)html+=input('pickup','取件地址','填写具体取件地点','text',true)+'<button type="button" class="link-button" data-address="pickup">从地址簿选择 ›</button>';html+=input('delivery','送达地址','填写具体送达地点','text',true)+'<button type="button" class="link-button" data-address="delivery">从地址簿选择 ›</button>'+input('contact','联系人','选填')+input('phone','收件电话','选填，必要时填写','tel')+input('code','取件码 / 领取码','选填，仅用于本次任务')+'</section>';}
if(!run&&!idle)html+='<section class="panel"><h3 class="private-title">♙ 私密地址 <small>选中后按权限开放</small></h3>'+input('address','详细地址','选填，不会出现在公开详情')+'</section>';
html+='<section class="panel">'+photos()+'</section>';if(idle)html+='<p class="hint">联系方式使用本人当前已验证资料，不在公开正文中填写。</p>';if(kind==='other')html+='<p class="hint">无需强制细分，请勿发布平台禁项或需许可而未具备资格的服务。</p>';$('publish-form').innerHTML=html;}
function setFlow(code,title,label,html,footer=''){aiVersion++;busy=false;view=code;$('flow-code').textContent=code.length===1?'V04-'+code:'V04';$('flow-label').textContent=label;$('flow-title').textContent=title;$('flow-content').innerHTML=html;$('flow-footer').innerHTML=footer;$('flow-footer').hidden=!footer;$('entry-tabs').hidden=code!=='A';$('flow-scroll').scrollTop=0;document.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.screen===code)));}
function entry(){setFlow('A','发布','发布入口',`<div class="hero"><div class="eyebrow">SHARE A LITTLE · HELP A LITTLE</div><h3>身边的事，<br>交给身边的人。</h3><p>发布需求，或者让闲置找到新主人。</p></div><div class="type-grid">${[['repair','⚒','上门检查与维修'],['errands','♧','取送与生活代买'],['idle','▤','把闲置交给需要的人'],['other','✧','其它生活需求']].map(([k,icon,note])=>`<button class="type-card" data-kind="${k}"><span class="type-icon">${icon}</span><strong>${M.kinds[k].name} ›</strong><small>${note}</small></button>`).join('')}</div><section class="panel" style="margin-top:18px"><button class="tool-entry" data-action="drafts"><span>使用我的草稿</span><small>${drafts.length?drafts.length+'份':'暂无草稿'} ›</small></button><button class="tool-entry" data-action="sources"><span>常用需求 / 再次发布</span><small>${savedTemplates.length?savedTemplates.length+'份常用需求':'下次少填几步'} ›</small></button><p class="hint">免费发布。正式提交前核验发布资格。</p></section>`);}
function switchKind(k){kind=k;source='';revision++;published=false;unknown=false;aiVersion++;busy=false;renderForm();entry();$('form-scroll').scrollTop=0;document.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.screen===M.kinds[k].code)));}
function errors(){const list=M.validate(kind,data());if(list.length){$('form-errors').innerHTML='<strong>补充以下信息，即可继续</strong><ul class="issue-list">'+list.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';$('form-errors').hidden=false;$('form-errors').focus();return true;}return false;}
function kv(label,value){return value?`<div class="kv"><dt>${esc(label)}</dt><dd>${esc(value)}</dd></div>`:'';}
function review(){if(errors())return;const d=data(),run=kind==='errands',idle=kind==='idle';let html=`<div class="eyebrow">确认你要公开的内容</div><section class="panel" id="public-review"><div class="review-title"><h3>${esc(d.title)}</h3><span class="tag">${M.kinds[kind].name}</span></div><div class="review-price">${run?'<small>¥ </small>'+esc(d.fee):idle?(d.priceMode==='negotiable'?'面议':'<small>¥ </small>'+esc(d.price)):'费用待协商'}</div><div class="review-note">${esc(d.note)}</div><dl>${kv('区域',d.region)}${kv('分类',run?d.task:d.category)}${kv('地标',d.landmark)}${run&&d.task===M.tasks[1]?kv('购买内容',d.purchase)+kv('商品估算','¥ '+d.goods):''}${!idle?kv('期望服务时间',d.start.replace('T',' '))+kv('服务到期时间',d.end.replace('T',' ')):''}</dl><div class="photos">${d.images.filter(x=>!x.private).map(x=>`<div class="photo-tile"><img src="${x.url}" alt="待发布的公开图片"></div>`).join('')}</div></section>`;
if(!idle)html+=`<section class="panel" id="private-review"><h3>♙ 仅本人核对的私密信息</h3><dl>${run?kv('取件地址',d.task===M.tasks[1]?'':d.pickup)+kv('送达地址',d.delivery)+kv('联系人',d.contact)+kv('收件电话',d.phone)+kv('领取码',d.code):kv('详细地址',d.address)||'<p class="hint">未填写详细地址</p>'}</dl>${d.images.some(x=>x.private)?'<p class="hint">另有'+d.images.filter(x=>x.private).length+'张私密图片，不进入公开内容。</p>':''}</section>`;
if(source)html+='<div class="notice">'+esc(source)+'</div>';if(scenario==='edit')html+='<div class="notice warning">修改关键内容后，旧申请失效，需要重新申请</div><label class="consent"><input type="checkbox" id="accept-edit">我已知悉修改影响</label>';
html+='<div class="error" id="review-error" role="alert" hidden></div>';setFlow('F','发布前核对','公开与私密分开核对',html,'<button class="secondary" data-action="back-form">返回修改</button><button class="primary" id="confirm-publish">'+(scenario==='edit'?'确认保存':'确认发布')+'</button>');}
function result(type){const success=type==='success';setFlow('result',success?(scenario==='edit'?'演示：已保存':'演示：已发布'):'正在核对结果','发布结果',`<div class="result"><div class="result-icon">${success?'✓':'···'}</div><h3>${success?'内容已在本页记录':'可查询本次发布结果'}</h3><p>${success?'这是本地演示，没有创建真实帖子。':'内容已保留，请查询本次结果'}</p>${success?'<button class="secondary" data-action="save-template">存为常用需求，下次少填几步</button>':''}</div><section class="panel"><div class="review-title"><h3>${esc(data().title)}</h3><span class="tag">${M.kinds[kind].name}</span></div><p class="hint">${success?'演示记录 · 仅本次页面有效':'本次提交待查询，不重新发起发布。'}</p></section>`,success?'<button class="secondary" data-action="my-posts">返回我的发布</button><button class="primary" data-action="posted-detail">查看发布结果</button>':'<button class="primary" id="query-result">查询发布结果</button>');}
function showDrafts(){setFlow('drafts','我的草稿','仅本人 · 本页内存',drafts.length?drafts.map((item,i)=>`<article class="draft-card"><strong>${esc(item.data.title||'未填写标题')}</strong><span class="source-chip">${M.kinds[item.kind].name}</span><p>未发布 · 可以继续补充</p><div class="options"><button data-restore="${i}">继续填写</button><button data-delete-draft="${i}">删除草稿</button></div></article>`).join(''):'<div class="empty">暂无草稿<br>填写右侧表单后，可点“保存草稿”。</div>');}
function sources(){setFlow('sources','常用需求 / 再次发布','复制公开内容',`${savedTemplates.map((item,i)=>'<article class="draft-card"><strong>'+esc(item.data.title)+'</strong><p>'+M.kinds[item.kind].name+' · 复用后核对本次信息</p><button data-template="'+i+'">复用这条需求</button></article>').join('')}<div class="notice">复制后创建新的发布草稿。请重新填写和核对费用、未来时间与私密信息。</div><article class="draft-card"><strong>取送物品 · 文字模板</strong><p>复用描述结构，任务信息自行填写。</p><button data-source="template">使用模板</button></article><article class="draft-card"><strong>本人旧帖 · 合成示例</strong><p>只复制本人公开内容，不恢复旧申请、联系方式授权或领取码。</p><button data-source="repost">再次发布</button></article>`);}
function addressPicker(target){addressTarget=target;setFlow('address','选择私人地址','地址簿快照',`<div class="notice">仅本人选择；选入本次任务后形成独立快照。</div>${['演示地址 A','演示地址 B'].map((name,i)=>`<button class="address-choice" data-pick-address="${i}">${name}<small>演示社区 · 合成送达点${i+1}</small></button>`).join('')}`);}
function aiInput(){setFlow('G','AI帮我整理','仅本次文字',`<div class="ai-steps"><span>01 写需求</span><span>02 核对候选</span><span>03 自主采用</span></div><section class="panel"><h3>说说需求，AI帮你整理</h3><p class="hint" style="margin:0 0 13px">把一段话整理成标题和说明，核对后即可填入</p><div class="field"><label for="ai-input"><span>本次文字</span><span class="optional">1—1000字符</span></label><textarea id="ai-input" rows="8" placeholder="请勿输入手机号、详细地址或领取码">${esc(aiText)}</textarea><div class="counter" id="ai-count">${M.count(aiText)} / 1000</div></div><button class="link-button" data-action="ai-sample">填入当前业务演示文字</button>${kind==='errands'?'<br><button class="link-button" data-action="ai-multi-sample">填入多个需求的演示文字</button>':''}</section><div class="notice">只整理你这次写的需求。联系方式和地址请在表单专用区域填写。</div><p class="hint">本预览不接入模型，仅支持上述合成样例；其它文字可返回手填。</p><div id="ai-error" class="error" role="alert" hidden></div>`, '<button class="secondary" data-action="back-form">继续手填</button><button class="primary" id="run-ai">开始整理</button>');}
function aiError(message,fragment=''){const box=$('ai-error');if(!box)return;box.innerHTML=esc(message)+(fragment?'<br>请删改：<mark>'+esc(fragment)+'</mark>':'');box.hidden=false;}
function runAI(selected=''){if(busy)return;const text=(selected||$('ai-input')?.value||aiText).trim();aiText=text;if(!M.count(text)||M.count(text)>1000){aiError('请填写1—1000个字符。');return;}const sensitive=M.privacy(text);if(sensitive){aiError('这段文字只写需求，私密信息请另填',sensitive);return;}const fail={'qualification':'完成资格核验后，即可使用AI整理','ai-off':'当前可手动发布，AI整理暂未开放','ai-limit':demoPurchased>0?'':'还想让AI帮你整理？20次只需¥1.90','ai-fail':'已保留你的内容，可重试或继续填写'}[scenario];if(fail){aiError(fail);if(scenario==='ai-limit'){$('flow-footer').innerHTML='<button class="secondary" data-action="back-form">继续手填</button><button class="primary" data-action="buy-ai">购买AI次数</button>';$('ai-error').className='notice';}return;}const token=++aiVersion,version=revision,k=kind;busy=true;const button=$('run-ai')||$('run-again');if(button){button.disabled=true;button.textContent='正在整理你的需求…';}setTimeout(()=>{busy=false;if(token!==aiVersion||k!==kind||version!==revision){if(view==='G'||view==='H')aiError('需求已更新，重新整理可获取新建议');if(button){button.disabled=false;button.textContent='重新整理';}return;}if(text===M.sample.multi&&kind==='errands'){multi();return;}const candidate=M.candidate(kind,text);if(!candidate){aiError('可用演示文字体验，或直接手动填写');if(button){button.disabled=false;button.textContent='重新整理';}return;}aiCandidate=candidate;aiKind=k;renderCandidate(version);},450);}
function multi(){setFlow('H','本次先整理一个需求','多需求选择',`<div class="notice">发现两个需求，本次先选一个</div><section class="panel"><div class="options" style="display:grid">${['帮忙代取一个快递','帮忙代买一袋大米'].map((text,i)=>`<label><input type="radio" name="ai-task" value="${esc(text)}" ${i===0?'checked':''}>${text}</label>`).join('')}</div></section><p class="hint">选好后，点击“再次整理”</p><div class="error" id="ai-error" role="alert" hidden></div>`,'<button class="secondary" data-action="ai-input">返回修改文字</button><button class="primary" id="run-again">再次整理</button>');}
function renderCandidate(version){const fields=Object.entries(aiCandidate);setFlow('I','核对整理候选','逐字段核对与采用',`<div class="notice">已整理好，核对后即可填入。未勾选的保留原值</div><section class="panel">${fields.map(([key,value])=>`<div class="candidate-field"><label><input type="checkbox" data-adopt="${key}" ${data()[key]?'':'checked'}>${names[key]||key}</label>${data()[key]&&data()[key]!==value?'<p>当前值：'+esc(data()[key])+'<br>不同于候选，勾选才替换</p>':''}${key==='note'?`<textarea data-candidate="${key}" rows="3">${esc(value)}</textarea>`:key==='priceMode'?`<select data-candidate="${key}"><option value="fixed" ${value==='fixed'?'selected':''}>明确价格</option><option value="negotiable" ${value==='negotiable'?'selected':''}>面议</option></select>`:key==='task'?`<select data-candidate="${key}">${M.tasks.map(t=>`<option ${value===t?'selected':''}>${esc(t)}</option>`).join('')}</select>`:`<input type="text" data-candidate="${key}" value="${esc(value)}">`}</div>`).join('')}</section><div class="notice warning" id="candidate-missing"></div><div id="candidate-error" class="error" role="alert" hidden></div><p class="hint">采用后补全信息，再确认发布</p>`,'<button class="secondary" data-action="discard-ai">放弃候选</button><button class="primary" id="adopt-ai">采用所选</button>');$('adopt-ai').dataset.version=version;updateMissing();}
function updateMissing(){if(!$('candidate-missing'))return;const merged={...data()};document.querySelectorAll('[data-adopt]:checked').forEach(c=>merged[c.dataset.adopt]=document.querySelector('[data-candidate="'+c.dataset.adopt+'"]').value);const missing=M.validate(kind,merged);const box=$('candidate-missing');box.classList.toggle('warning',!!missing.length);box.innerHTML=missing.length?'<strong>再补充 '+missing.length+' 项</strong><ul class="issue-list">'+missing.map(item=>'<li>'+esc(item)+'</li>').join('')+'</ul>':'信息已齐全，可采用并核对发布';}
function adopt(){const button=$('adopt-ai');if(aiKind!==kind||Number(button.dataset.version)!==revision){$('candidate-error').hidden=false;$('candidate-error').textContent='需求已更新，可重新整理';return;}const merged={...data()};let chosen=0;document.querySelectorAll('[data-adopt]:checked').forEach(c=>{merged[c.dataset.adopt]=document.querySelector('[data-candidate="'+c.dataset.adopt+'"]').value;chosen++;});if(!chosen){$('candidate-error').hidden=false;$('candidate-error').textContent='勾选需要的内容，即可采用';return;}if(M.count(merged.title)>30||M.count(merged.note)>1000||!M.count(merged.title)||!M.count(merged.note)||(kind==='errands'&&merged.fee&&!M.amount(merged.fee))||(kind==='idle'&&merged.price&&merged.priceMode==='fixed'&&!M.amount(merged.price))||(merged.task&&!M.tasks.includes(merged.task))||!['fixed','negotiable'].includes(merged.priceMode)){$('candidate-error').hidden=false;$('candidate-error').textContent='调整所选内容格式后，即可采用';return;}forms[kind]=merged;revision++;renderForm();entry();toast('form','已采用，请核对后发布');}

const yuan=cents=>(cents/100).toFixed(2);
function purchase(){const p=M.residentPolicy;setFlow('purchase','补充AI次数','本地购买演示',`<div class="hero"><div class="eyebrow">让AI继续帮你整理</div><h3>${p.packCount}次 <span style="color:var(--red)">¥${yuan(p.packPriceCents)}</span></h3><p>少填几步，把需求说清楚。<br>购买到账后${p.packDays}天有效。</p></div><section class="panel"><h3>选择支付方式</h3><div class="options"><label><input type="radio" name="pay-method" value="direct" ${buyMethod==='direct'?'checked':''}>直接支付</label><label><input type="radio" name="pay-method" value="balance" ${buyMethod==='balance'?'checked':''}>余额支付</label></div><div id="pay-summary"></div><button class="link-button" data-action="balance-info">查看演示余额 ›</button></section><p class="hint">成功返回可用整理结果才扣次，技术失败不扣。手动发布始终免费。</p><div class="notice">本页为购买演示，不会收款或发放真实次数。</div>`,'<button class="secondary" data-action="return-ai">返回整理</button><button class="primary" id="buy-pack"></button>');updatePayment();}
function updatePayment(){const p=M.residentPolicy,need=M.shortfall(p.packPriceCents,demoBalance);$('pay-summary').innerHTML='<dl>'+kv('本次购买',p.packCount+'次 · ¥'+yuan(p.packPriceCents))+(buyMethod==='balance'?kv('可用余额','¥'+yuan(demoBalance))+(need?kv('还差','¥'+yuan(need)):''):kv('支付金额','¥'+yuan(p.packPriceCents)))+'</dl>';$('buy-pack').textContent=buyMethod==='balance'&&need?'补差额 ¥'+yuan(need)+'（演示）':'确认购买（演示）';}
function topup(){const need=M.shortfall(M.residentPolicy.packPriceCents,demoBalance);setFlow('topup','为本次购买补足余额','本地充值演示',`<section class="panel"><h3>这次只需补充 ¥${yuan(need)}</h3><dl>${kv('当前余额','¥'+yuan(demoBalance))}${kv('本次需付','¥'+yuan(M.residentPolicy.packPriceCents))}${kv('充值金额','¥'+yuan(need))}</dl></section><div class="notice">余额可用于已开放的AI次数包及平台自营工具、会员、广告。未消费本金长期有效，可申请退回。</div><p class="hint">本次无充值赠金；充值演示后，你仍需另行确认购买次数包。</p>`,'<button class="secondary" data-action="return-pack">暂不充值</button><button class="primary" id="topup-confirm">确认充值（演示）</button>');}
function completePurchase(){const p=M.residentPolicy;if(buyMethod==='balance'){if(demoBalance<p.packPriceCents)return;demoBalance-=p.packPriceCents;}demoPurchased+=p.packCount;setFlow('pack-result','演示：次数已补充','本页模拟购买结果',`<div class="result"><div class="result-icon">✓</div><h3>可以继续整理需求了</h3><p>本次需求已保留，可回去继续整理。<br>模拟补充${p.packCount}次，实际到账后${p.packDays}天有效。<br>没有发生真实支付或权益发放。</p></div>`,'<button class="secondary" data-action="balance-info">查看演示余额</button><button class="primary" data-action="return-ai">立即整理本次需求</button>');}
function balanceInfo(){setFlow('balance','平台自营消费余额','仅本页演示',`<section class="panel"><div class="eyebrow">可用余额</div><div class="review-price">¥${yuan(demoBalance)}</div><p class="hint">充值本金长期有效，未消费部分可申请退回。</p></section><div class="notice">用于已开放的AI次数包、平台自营工具、会员、广告。次数包到账后180天有效，与余额本金有效期分开。</div><p class="hint">本页不创建真实财务账本或消费记录。</p>`,'<button class="secondary" data-action="return-pack">返回次数包</button><button class="primary" data-action="refund-demo" '+(demoBalance?'':'disabled')+'>申请退回本金（演示）</button>');}
function refundDemo(){setFlow('refund','核对本金退回申请','仅本页演示',`<section class="panel"><h3>本次申请退回 ¥${yuan(demoBalance)}</h3><p class="hint">仅限当前未消费本金。本页只演示申请，不发生真实退款，也不表示已到账。</p></section>`,'<button class="secondary" data-action="balance-info">返回余额</button><button class="primary" id="refund-confirm">提交申请（演示）</button>');}
document.addEventListener('change',e=>{if(e.target.name==='pay-method'){buyMethod=e.target.value;updatePayment();}});
$('publish-form').addEventListener('submit',e=>e.preventDefault());$('publish-form').addEventListener('input',e=>{const t=e.target;if(!t.name||t.type==='file')return;data()[t.name]=t.value;revision++;published=false;if(t.name==='title')$('title-count').textContent=M.count(t.value)+' / 30';if(t.name==='note')$('note-count').textContent=M.count(t.value)+' / 1000';if(view==='F'){setFlow('stale','请重新核对','表单已修改','<div class="notice warning">已保留修改，请预览最新内容</div>');}if(view==='I'){$('candidate-error').hidden=false;$('candidate-error').textContent='需求已更新，可重新整理';$('adopt-ai').disabled=true;}});
$('publish-form').addEventListener('change',e=>{const t=e.target;if(t.name==='task'){data().task=t.value;renderForm();}if(t.name==='priceMode'){data().priceMode=t.value;$('price-value').hidden=t.value==='negotiable';}if(t.type==='file'){const files=[...t.files],privateUse=!!$('image-private')?.checked;if(data().images.length+files.length>9){toast('form','图片总数不能超过9张。');t.value='';return;}if(files.some(f=>!['image/jpeg','image/png'].includes(f.type)||f.size>5*1024*1024)){toast('form','请选择JPEG/PNG图片，每张不超过5MB。');t.value='';return;}files.forEach(file=>data().images.push({url:URL.createObjectURL(file),private:privateUse}));revision++;renderForm();if(view==='F')entry();}});
$('publish-form').addEventListener('click',e=>{const rm=e.target.closest('[data-remove-image]');if(rm){data().images.splice(Number(rm.dataset.removeImage),1);revision++;renderForm();if(view==='F')entry();}const addr=e.target.closest('[data-address]');if(addr)addressPicker(addr.dataset.address);});
$('save-draft').addEventListener('click',()=>{drafts.push({kind,data:{...data(),images:data().images.map(x=>({...x}))}});toast('form','草稿已保存在本页，尚未发布。');if(view==='drafts'||view==='A')entry();});$('review-button').addEventListener('click',()=>{if(unknown){result('unknown');return;}if(published){result('success');return;}review();});$('open-ai').addEventListener('click',aiInput);$('flow-back').addEventListener('click',entry);$('form-back').addEventListener('click',entry);
$('scenario').addEventListener('change',()=>{scenario=$('scenario').value;revision++;aiVersion++;busy=false;unknown=false;published=false;renderForm();entry();});
$('screen-nav').addEventListener('click',e=>{const key=e.target.closest('[data-screen]')?.dataset.screen;if(!key)return;if(key==='A')entry();else if('BCDE'.includes(key))switchKind(Object.keys(M.kinds).find(k=>M.kinds[k].code===key));else if(key==='F'){if(unknown)result('unknown');else if(published)result('success');else review();}else{if(key==='G')aiInput();if(key==='H'){if(kind!=='errands')switchKind('errands');multi();}if(key==='I'){aiCandidate=M.candidate(kind,M.sample[kind]);aiKind=kind;renderCandidate(revision);}}});
$('flow-content').addEventListener('input',e=>{if(e.target.id==='ai-input'){aiText=e.target.value;$('ai-count').textContent=M.count(aiText)+' / 1000';aiVersion++;}if(e.target.hasAttribute('data-candidate'))updateMissing();});$('flow-content').addEventListener('change',e=>{if(e.target.hasAttribute('data-adopt')||e.target.hasAttribute('data-candidate'))updateMissing();});
document.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;const a=button.dataset.action;if(button.dataset.kind)switchKind(button.dataset.kind);if(a==='buy-ai')purchase();if(a==='return-ai')aiInput();if(a==='return-pack')purchase();if(a==='balance-info')balanceInfo();if(a==='refund-demo')refundDemo();if(a==='drafts')showDrafts();if(a==='sources')sources();if(a==='back-form'){entry();$('f-title').focus();}if(a==='ai-input')aiInput();if(a==='ai-sample'||a==='ai-multi-sample'){aiText=a==='ai-sample'?M.sample[kind]:M.sample.multi;$('ai-input').value=aiText;$('ai-count').textContent=M.count(aiText)+' / 1000';aiVersion++;}if(a==='discard-ai'){aiCandidate=null;entry();toast('form','已放弃候选，原表单保留。');}if(a==='posted-detail'){setFlow('posted','演示发布结果','公开内容摘要',`<section class="panel"><h3>${esc(data().title)}</h3><p class="review-note">${esc(data().note)}</p><p class="hint">${esc(data().region)} · ${M.kinds[kind].name}</p></section><div class="notice">预览已展示公开摘要，实际产品将进入V02详情。</div>`);}if(a==='my-posts')setFlow('posts','我的发布 · 演示','本页记录',`<article class="draft-card"><strong>${esc(data().title)}</strong><p>仅本地演示记录，无真实发布编号。</p><button data-action="posted-detail">查看结果</button></article>`);
if(a==='save-template'){const item={kind,data:M.copyPublic(kind,data())};if(!savedTemplates.some(t=>t.kind===kind&&JSON.stringify(t.data)===JSON.stringify(item.data)))savedTemplates.push(item);toast('flow','已保存，下次可从“常用需求”复用。');button.textContent='已存为常用需求';button.disabled=true;}
if(button.dataset.template!==undefined){const item=savedTemplates[Number(button.dataset.template)];kind=item.kind;forms[kind]={...initial(kind),...item.data,fee:'',start:'',end:'',pickup:'',delivery:'',contact:'',phone:'',code:'',address:'',images:[]};source='已带入常用需求，请核对本次费用、时间与地址。';revision++;aiVersion++;published=false;unknown=false;renderForm();entry();}
if(button.dataset.source){kind='errands';const old={...initial(kind),title:button.dataset.source==='template'?'':'帮忙代取一个快递',note:button.dataset.source==='template'?'请说明需要取送的物品与要求。':'需要代取一件快递。'};forms[kind]={...initial(kind),...M.copyPublic(kind,old),fee:'',start:'',end:'',pickup:'',delivery:'',contact:'',phone:'',code:'',images:[]};source='已复制公开内容，请重新核对地址、费用、时间与内容。旧申请和授权不会复制。';revision++;aiVersion++;published=false;unknown=false;renderForm();entry();}
if(button.dataset.restore!==undefined){const draft=drafts[Number(button.dataset.restore)];kind=draft.kind;forms[kind]={...draft.data,images:draft.data.images.map(x=>({...x}))};source='已恢复本人草稿，请重新核对未来时间与发布条件。';revision++;aiVersion++;published=false;unknown=false;renderForm();entry();}if(button.dataset.deleteDraft!==undefined){drafts.splice(Number(button.dataset.deleteDraft),1);showDrafts();}
if(button.dataset.pickAddress!==undefined){data()[addressTarget]='演示社区 · 合成送达点'+(Number(button.dataset.pickAddress)+1);revision++;renderForm();entry();toast('form','已将所选地址填入本次任务。');}
if(button.id==='run-ai')runAI();if(button.id==='run-again')runAI(document.querySelector('input[name="ai-task"]:checked')?.value);if(button.id==='adopt-ai')adopt();
if(button.id==='confirm-publish'){if(published||unknown)return;if(M.validate(kind,data()).length){review();return;}const err=$('review-error');if(scenario==='edit'&&!$('accept-edit').checked){err.textContent='请勾选确认修改影响';err.hidden=false;return;}if(['qualification','blocked'].includes(scenario)){err.textContent=scenario==='qualification'?'到“我的”完成资格核验，即可继续发布':'请调整发布内容后重新提交';err.hidden=false;return;}button.disabled=true;if(scenario==='unknown'){unknown=true;result('unknown');}else{published=true;result('success');}}
if(button.id==='buy-pack'){if(buyMethod==='balance'&&demoBalance<M.residentPolicy.packPriceCents){topup();return;}completePurchase();}if(button.id==='topup-confirm'){const needed=M.shortfall(M.residentPolicy.packPriceCents,demoBalance);demoBalance+=needed;purchase();}if(button.id==='refund-confirm'){setFlow('refund-request','演示：申请已记录','退款申请示意','<div class="result"><h3>可继续查看申请进展</h3><p>仅演示本金退回申请，不表示退款已到账。<br>本页演示余额未作变更。</p></div>','<button class="primary" data-action="balance-info">返回演示余额</button>');}
if(button.id==='query-result'){unknown=false;published=true;result('success');}
});renderForm();entry();
})();
</script>
</body></html>
