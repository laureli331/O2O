<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>V10 我的接单资料 · 湘邻湘友</title><link rel="stylesheet" href="assets/v09.css"><link rel="stylesheet" href="assets/mobile-foundations.css"><script src="assets/v10-model.js"></script><script src="assets/v10-flow.js"></script><style>
.service-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;background:none;text-align:left;border-bottom:1px solid var(--line)}.service-row:last-child{border:0}.service-row img{width:58px;height:58px;border-radius:10px}.service-row span{flex:1;min-width:0}.service-row strong{display:block;font-size:15px}.service-row small{display:block;font-size:12px;color:var(--muted);margin-top:4px}.service-row b{font-size:12px;color:var(--green);font-weight:400}.provider-status{font-size:20px;font-weight:600;margin-bottom:6px}.section-title{font-size:15px;margin-bottom:10px}.provider-note{font-size:12px;color:var(--muted);line-height:1.9}.provider-description{font-size:14px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0}.provider-cover{width:100%;border-radius:10px;margin-top:12px}.provider-name{text-align:center;font-size:21px;margin:12px 0}.provider-avatar{width:64px;height:64px;background:var(--soft);color:#799070;border-radius:50%;display:grid;place-items:center;margin:10px auto;font-size:23px}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}.image-tile{position:relative;min-width:0}.image-tile img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}.image-tile button{position:absolute;right:0;bottom:0;background:#fcfbf7e8;border-radius:8px}.upload-label{display:flex;align-items:center;justify-content:center;border:1px dashed #bccdb1;border-radius:9px;min-height:48px;font-size:13px;color:var(--green);cursor:pointer}.license-preview{max-width:100%;max-height:160px;border-radius:8px;margin:12px 0}.region-choice{display:flex;gap:10px;align-items:center;min-height:44px}.schedule-row{border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0;background:#fffffc}.schedule-row select{width:100%;margin-bottom:9px}.time-pair{display:flex;align-items:center;gap:8px}.time-pair input{min-width:0;width:100%;flex:1;border:1px solid var(--line);border-radius:7px;padding:6px;font-size:13px}.schedule-row .quiet{display:block;margin-left:auto}.schedule-note{margin-bottom:14px}.provider-contact{font-size:12px;border-top:1px solid var(--line);padding-top:12px;margin-top:16px;color:var(--muted)}.schedule-summary{font-size:12px;line-height:1.9;color:var(--muted)}.verification-link{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;width:100%;background:none;text-align:left;padding:0;color:var(--green)}
.schedule-heading{display:flex;align-items:center;justify-content:space-between;gap:8px}.schedule-heading h3{font-size:15px}.schedule-category{display:flex;align-items:center;gap:12px;padding:10px 0;min-height:64px;width:100%;text-align:left;background:none;border-top:1px solid var(--line)}.schedule-category>strong{font-size:14px;flex:0 0 32px}.schedule-category>span{flex:1;min-width:0}.schedule-category small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;font-size:12px;color:var(--muted);line-height:1.7}.schedule-category em{display:block;color:#98703c;font-size:11px;font-style:normal}.schedule-category>b{font-weight:400;color:var(--green)}.schedule-targets{border:0;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.schedule-targets legend{font-size:14px;margin-bottom:12px}.schedule-targets legend small{font-size:11px;color:var(--muted);margin-left:8px}.schedule-targets label{min-height:46px;display:flex;align-items:center;justify-content:center;gap:7px;background:#f6f8f0;border:1px solid var(--line);border-radius:8px;font-size:13px;cursor:pointer;transition:background .15s}.schedule-targets label:has(input:checked){background:#e5eee1;border-color:#9cb391;color:var(--green)}.schedule-targets label:active{transform:scale(.98)}.schedule-targets input{width:17px;height:17px;flex-basis:17px}.busy-category+.busy-category{border-top:1px solid var(--line);margin-top:7px;padding-top:7px}</style></head><body><main class="workspace"><header class="workspace-head"><div class="brand"><div class="mark">湘</div><div><h1>湘邻湘友 · V10</h1><p>接单资料与时段 / <a href="v05.html">我的</a> / <a href="services.html">服务订单</a></p></div></div><span class="demo">本地合成演示</span></header><nav class="screen-nav" id="screen-nav"><button data-screen="A">A 我的接单资料</button><button data-screen="B">B 申请人资料</button><button data-screen="C">C 编辑资料</button><button data-screen="D">D 时段与忙碌</button></nav><div class="toolbar" id="toolbar"><label>服务类别<select id="kind"><option value="repair">维修</option><option value="errands">跑腿</option><option value="other">其它</option></select></label><label>状态演示<select id="scenario"><option value="normal">待完善</option><option value="ready">已填写与资格有效</option><option value="guest">未登录</option><option value="expired">资格待重新核验</option></select></label><button class="quiet" id="reset">重置演示</button></div><div class="device-label"><strong>接单资料</strong><span id="page-code">V10-A</span></div>
<article class="phone" id="provider-phone"><header class="phone-head"><button class="back" id="back" aria-label="返回我的"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button><h2 id="page-title">我的接单资料</h2><span class="capsule" aria-hidden="true">··· ◎</span></header><div class="scroll" id="provider-scroll"><div class="content" id="content"></div></div><footer class="footer" id="actions" hidden></footer><div class="dialog" id="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title" hidden><div class="dialog-box"><h3 id="confirm-title">放弃未保存的修改？</h3><p id="confirm-copy">本次修改尚未保存，可以返回继续编辑。</p><div class="dialog-actions"><button class="secondary" id="cancel-action">继续编辑</button><button class="primary" id="confirm-action">放弃修改</button></div></div></div><div class="toast" id="toast" role="status" hidden></div></article><p class="bottom-note">资料、申请与资格均为本地合成演示。图片只在本页预览，不上传；请勿选择真实证件。认证衔接使用临时演示状态，不代替服务端核验或授权。</p></main><script>
(()=>{'use strict';const M=V10Model,F=V10Flow,$=id=>document.getElementById(id),q=new URLSearchParams(location.search),publisher=q.get('view')==='applicant',actor=q.get('candidate')||'a',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),days=['','周一','周二','周三','周四','周五','周六','周日'];let s=M.create(),page=publisher?'B':'A',kind='repair',draft=null,baseline='',pending=null,trigger=null,timer,urls=[],selectedKinds=null,busyDraft=null;
 const grant=F.read();if(grant)Object.assign(s,grant);const btn=(t,a,cls='secondary')=>'<button class="'+cls+'" data-action="'+a+'">'+t+'</button>',empty=(t,d)=>'<div class="empty"><img src="assets/empty-notes.svg" alt=""><h3>'+t+'</h3><p>'+d+'</p></div>',copy=v=>JSON.parse(JSON.stringify(v));
 function toast(t){clearTimeout(timer);$('toast').textContent=t;$('toast').hidden=false;timer=setTimeout(()=>$('toast').hidden=true,2800);}
 function read(){if(page==='C'&&$('p-name')){Object.assign(draft,{name:$('p-name').value,services:$('p-services').value,wechat:$('p-wechat').value,regions:$('p-region').checked?['演示社区']:[]});}if(page==='D'){draft.slots=[...document.querySelectorAll('.schedule-row')].map(el=>({day:Number(el.querySelector('select').value),start:el.querySelector('[data-time=start]').value,end:el.querySelector('[data-time=end]').value}));document.querySelectorAll('[data-busy-kind]').forEach(el=>busyDraft[el.dataset.busyKind]=el.checked);}return draft;}
 function fingerprint(){return JSON.stringify(page==='D'?{draft:read(),targets:selectedKinds,busy:busyDraft}:read());}function dirty(){return ['C','D'].includes(page)&&fingerprint()!==baseline;}
 function close(){$('confirm-dialog').hidden=true;pending=null;if(trigger?.isConnected)trigger.focus();}
 function ask(fn,title='放弃未保存的修改？',copy='本次修改尚未保存，可以返回继续编辑。',label='放弃修改',cancel='继续编辑'){clearTimeout(timer);$('toast').hidden=true;pending=fn;trigger=document.activeElement;$('confirm-title').textContent=title;$('confirm-copy').textContent=copy;$('confirm-action').textContent=label;$('cancel-action').textContent=cancel;$('confirm-dialog').hidden=false;$('cancel-action').focus();}
 function change(next,newKind=kind){const go=()=>{kind=newKind;$('kind').value=kind;page=next;draft=null;selectedKinds=null;busyDraft=null;baseline='';render();};if(dirty())ask(go);else go();}
 const scheduleText=p=>p.slots.length?p.slots.map(r=>days[r.day]+' '+r.start+'—'+r.end).join('；'):'未设置服务时段';
 function overview(){return '<section class="panel"><div class="provider-status">'+(M.eligible(s)?'接单资格已核验':'完善资格，准备接单')+'</div><p class="provider-note">资料与认证分别管理，已有效的资格可复用。</p><button class="verification-link" data-action="qualify"><span>发布与接单资格</span><span>'+(M.eligible(s)?'查看状态':'去完善')+' ›</span></button></section><section class="panel">'+Object.entries(M.kinds).map(([k,n])=>'<button class="service-row" data-edit="'+k+'"><img src="assets/service-'+M.art[k]+'.svg" alt=""><span><strong>'+n+'接单资料</strong><small>'+(s.profiles[k].name?esc(s.profiles[k].name):'尚未填写技能与服务信息')+'</small></span><b>'+(s.profiles[k].name?'编辑':'去完善')+' ›</b></button>').join('')+'</section><section class="panel schedule-overview"><div class="schedule-heading"><h3>服务时段与忙碌</h3>'+btn('批量设置','schedule','quiet')+'</div>'+Object.entries(M.kinds).map(([k,n])=>'<button class="schedule-category" data-schedule="'+k+'"><strong>'+n+'</strong><span><small>'+esc(scheduleText(s.profiles[k]))+'</small>'+(s.profiles[k].busy?'<em>当前忙碌</em>':'')+'</span><b aria-hidden="true">›</b></button>').join('')+'</section><p class="provider-note">时段仅作参考，忙碌不自动拒单、取消交易或限制接单数量。</p>';}

 function publicPage(){let profiles;try{profiles=M.publicView(s,actor);}catch(error){return empty('暂无查看权限','请从对应的申请人卡片进入。');}if(!profiles.length)return empty('尚未填写接单资料','可结合本次申请说明与已有评价了解对方。');return profiles.map(p=>'<section class="panel public-profile"><div class="provider-avatar" aria-hidden="true">'+esc(p.name.slice(0,1))+'</div><h3 class="provider-name">'+esc(p.name)+'</h3><span class="tag">'+M.kinds[p.kind]+'</span><span class="tag">'+p.identity+'</span><p class="provider-description">'+esc(p.services)+'</p><p class="hint">服务区域：'+esc(p.regions.join('、'))+'</p><div class="gallery">'+p.images.map(src=>'<img class="provider-cover" src="'+esc(src)+'" alt="公开服务展示图">').join('')+'</div><p class="schedule-summary">'+esc(scheduleText(p))+'</p><p class="hint">'+(p.busy?'当前忙碌 · 可按具体申请沟通':'忙碌状态：未标记忙碌')+'</p><p class="hint">营业执照：'+p.licenseStatus+'；仅提交不代表已核查。</p><p class="provider-contact">电话、微信按当前交易权限展示，请到对应订单查看。</p></section>').join('');}
 function editor(){draft??=copy(s.profiles[kind]);return '<p class="hint editor-intro">'+M.kinds[kind]+' · 让发布者了解你擅长什么</p><section class="panel fields">'+[['name','展示名称',30],['services','技能与服务介绍',500],['wechat','微信号（选填）',50]].map(([key,label,max])=>'<div class="field"><label for="p-'+key+'">'+label+'</label>'+(key==='services'?'<textarea id="p-services" rows="5" maxlength="500" placeholder="说明服务项目和擅长的内容">'+esc(draft[key])+'</textarea>':'<input id="p-'+key+'" maxlength="'+max+'" value="'+esc(draft[key])+'">')+'<p class="field-issue" id="issue-'+key+'" hidden></p></div>').join('')+'<div class="field"><label>服务区域</label><label class="region-choice"><input id="p-region" type="checkbox"'+(draft.regions.includes('演示社区')?' checked':'')+'>演示社区</label><p class="field-issue" id="issue-regions" hidden></p></div><div class="field"><label>联系电话</label><p class="hint">'+(s.phone?'本人微信手机号已验证（演示）':'尚未验证')+'</p>'+btn('到个人资料管理联系方式','personal','quiet')+'</div></section><section class="panel"><h3 class="section-title">展示图片 <small>'+draft.images.length+'／9</small></h3><p class="hint">选填，只展示你愿意公开的服务图片。</p><div class="gallery">'+draft.images.map((src,i)=>'<div class="image-tile"><img src="'+esc(src)+'" alt="待保存的展示图片"><button class="quiet" data-remove-image="'+i+'" aria-label="移除第'+(i+1)+'张展示图片">移除</button></div>').join('')+'</div><label class="upload-label" for="images">＋ 选择展示图片</label><input id="images" type="file" accept="image/jpeg,image/png" multiple hidden><p class="field-issue" id="issue-images" hidden></p></section><section class="panel"><h3 class="section-title">营业执照 <span class="tag">选填 · 不公开原图</span></h3><p class="hint">仅本人及必要运营查看。仅上传标为“已提交”，不自动标为已认证。</p>'+(draft.license?'<img class="license-preview" src="'+esc(draft.license)+'" alt="仅本人查看的执照预览">'+btn('移除执照','remove-license','quiet'):'')+'<label class="upload-label" for="license">选择1张执照图片</label><input id="license" type="file" accept="image/jpeg,image/png" hidden></section><div class="error" id="form-error" role="alert" hidden></div>';}
 function schedule(){draft??=copy(s.profiles[kind]);selectedKinds??=[kind];busyDraft??=Object.fromEntries(Object.keys(M.kinds).map(k=>[k,s.profiles[k].busy]));return '<section class="panel"><fieldset class="schedule-targets"><legend>适用类别 <small>可多选</small></legend>'+Object.entries(M.kinds).map(([k,n])=>'<label><input class="schedule-target" type="checkbox" value="'+k+'"'+(selectedKinds.includes(k)?' checked':'')+'><span>'+n+'</span></label>').join('')+'</fieldset><p class="hint">以'+M.kinds[kind]+'时段为基础，保存到勾选的类别。</p></section><section class="panel"><h3 class="section-title">可服务时段</h3>'+draft.slots.map((r,i)=>'<div class="schedule-row"><label class="hint" for="day-'+i+'">星期</label><select id="day-'+i+'">'+days.slice(1).map((day,n)=>'<option value="'+(n+1)+'"'+(r.day===n+1?' selected':'')+'>'+day+'</option>').join('')+'</select><div class="time-pair"><input type="time" aria-label="第'+(i+1)+'段开始时间" data-time="start" value="'+r.start+'"><span>至</span><input type="time" aria-label="第'+(i+1)+'段结束时间" data-time="end" value="'+r.end+'"></div><button class="quiet" data-remove-slot="'+i+'">移除时段</button></div>').join('')+btn('＋ 添加时段','add-slot','secondary')+'<p class="hint">同一天重叠的时段保存时会合并。</p></section>'+(selectedKinds.length?'<section class="panel"><h3 class="section-title">忙碌状态</h3>'+selectedKinds.map(k=>'<div class="default-row busy-category"><label for="busy-'+k+'"><span>'+M.kinds[k]+'忙碌</span><input id="busy-'+k+'" data-busy-kind="'+k+'" type="checkbox"'+(busyDraft[k]?' checked':'')+'></label></div>').join('')+'<p class="hint">各类分别设置，仅作提示。</p></section>':'<p class="hint">至少选择一个适用类别。</p>')+'<div class="error" id="form-error" role="alert" hidden></div>';}

 function render(){document.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.screen===page)));$('page-code').textContent='V10-'+page;$('page-title').textContent=({A:'我的接单资料',B:'接单资料',C:'编辑接单资料',D:'时段与忙碌'})[page];$('actions').hidden=true;$('actions').innerHTML='';if(!s.logged&&!publisher){$('content').innerHTML=empty('登录后管理接单资料','资料只由本人修改。')+btn('前往登录','qualify','primary');return;}$('content').innerHTML=({A:overview,B:publicPage,C:editor,D:schedule}[page])();if(page==='C'||page==='D'){baseline=baseline||fingerprint();$('actions').innerHTML=btn(page==='C'?'保存资料':selectedKinds.length>1?'应用到'+selectedKinds.length+'个类别':'保存时段与状态','save','primary');if(page==='D'&&!selectedKinds.length)$('actions').querySelector('button').disabled=true;}if(page==='A')$('actions').innerHTML=btn('预览申请人资料','preview','secondary');$('actions').hidden=!$('actions').innerHTML;$('provider-scroll').scrollTop=0;}
 function leave(url){if(dirty())ask(()=>{location.href=url;});else location.href=url;}function qualify(){if(M.eligible(s))F.grant(s);else F.invalidate();leave('v05.html?from=provider'+(s.logged?(s.phone?'':'&entry=phone'):'&entry=guest'));}
 document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;try{if(b.dataset.screen){change(b.dataset.screen);return;}if(b.dataset.edit){change('C',b.dataset.edit);return;}if(b.dataset.schedule){change('D',b.dataset.schedule);return;}if(b.dataset.removeImage!==undefined){read();draft.images.splice(Number(b.dataset.removeImage),1);render();return;}if(b.dataset.removeSlot!==undefined){read();draft.slots.splice(Number(b.dataset.removeSlot),1);render();return;}const a=b.dataset.action;if(a==='qualify')qualify();if(a==='personal')leave('v05.html');if(a==='preview')change('B');if(a==='schedule'){change('D');}if(a==='add-slot'){read();draft.slots.push({day:1,start:'09:00',end:'18:00'});render();}if(a==='remove-license'){read();draft.license=null;render();}if(a==='save'){read();if(page==='C'){const errors=M.errors(draft);for(const k of ['name','services','wechat','regions','images']){const el=$('issue-'+k);el.hidden=!errors[k];el.textContent=errors[k]||'';}if(Object.keys(errors).length){$('form-error').textContent='请核对标记的内容。';$('form-error').hidden=false;($('p-'+(Object.keys(errors)[0]==='regions'?'region':Object.keys(errors)[0]))||$('form-error')).focus();return;}M.save(s,kind,draft);}else{const targets=[...selectedKinds],rows=copy(draft.slots),busy=copy(busyDraft);if(!targets.length)throw Error('至少选择一个适用类别');M.mergeSlots(rows);const apply=()=>{M.applySchedule(s,targets,rows,busy);baseline='';draft=null;selectedKinds=null;busyDraft=null;page='A';render();toast('已保存'+targets.map(k=>M.kinds[k]).join('、')+'的时段与状态');};ask(apply,'应用服务时段？','将替换'+targets.map(k=>M.kinds[k]).join('、')+'的原有时段，忙碌状态按本页各类别的选择保存。','确认应用','返回检查');return;}baseline='';draft=null;page='A';render();toast('已保存在本页演示中');}}catch(error){if($('form-error')){$('form-error').textContent=error.message;$('form-error').hidden=false;}else toast(error.message);}});
 document.addEventListener('change',e=>{if(e.target.matches('.schedule-target')){const value=e.target.value,position=$('provider-scroll').scrollTop;read();selectedKinds=[...document.querySelectorAll('.schedule-target:checked')].map(el=>el.value);render();$('provider-scroll').scrollTop=position;document.querySelector('.schedule-target[value="'+value+'"]').focus({preventScroll:true});return;}if(!['images','license'].includes(e.target.id))return;read();const files=[...e.target.files],license=e.target.id==='license',error=M.fileError(files,license?0:draft.images.length,license?1:9);if(error){toast(error);e.target.value='';return;}const refs=files.map(f=>{const url=URL.createObjectURL(f);urls.push(url);return url;});if(license)draft.license=refs[0]||draft.license;else draft.images.push(...refs);render();});
 $('back').addEventListener('click',()=>{if(publisher){const k=['repair','errands','other'].includes(q.get('kind'))?q.get('kind'):'errands';location.href='v03.html?kind='+k;return;}if(page==='A')location.href='v05.html';else change('A');});$('kind').addEventListener('change',()=>{const k=$('kind').value;$('kind').value=kind;change(page,k);});$('scenario').addEventListener('change',()=>{const apply=()=>{s=M.create();const value=$('scenario').value;if(value!=='normal')for(const k of Object.keys(M.kinds))s.profiles[k]=M.demo(k);if(value==='ready')Object.assign(s,{identity:'valid',age:'eligible'});if(value==='guest')s.logged=false;if(value==='expired')s.identity='expired';page='A';draft=null;selectedKinds=null;busyDraft=null;baseline='';render();};if(dirty())ask(apply);else apply();});$('reset').addEventListener('click',()=>{if(dirty())ask(()=>location.reload());else location.reload();});$('confirm-action').addEventListener('click',()=>{const fn=pending;close();baseline='';fn?.();});$('cancel-action').addEventListener('click',close);$('confirm-dialog').addEventListener('click',e=>{if(e.target===$('confirm-dialog'))close();});document.addEventListener('keydown',e=>{if($('confirm-dialog').hidden)return;if(e.key==='Escape')close();if(e.key==='Tab'){const first=$('cancel-action'),last=$('confirm-action');if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});if(publisher){$('toolbar').hidden=true;$('screen-nav').hidden=true;}render();window.addEventListener('pagehide',e=>{if(!e.persisted)urls.forEach(url=>URL.revokeObjectURL(url));});
})();</script></body></html>
