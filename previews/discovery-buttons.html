<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>发现页入口 · 共用胶囊样式</title><style>
:root{color-scheme:light;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#496b56;background:#fcfbf6}*{box-sizing:border-box}body{margin:0;min-height:100svh;padding:32px 20px}main{max-width:375px;margin:0 auto}.buttons{display:inline-flex;align-items:center;position:relative;border-radius:999px;isolation:isolate}.buttons:before{content:"";position:absolute;inset:5px 2px;border:1px solid #e0e5da;background:#f0f2eb;border-radius:999px;pointer-events:none;z-index:-1}.buttons:after{content:"";position:absolute;left:50%;top:14px;bottom:14px;width:1px;background:#d4ddce;pointer-events:none}button{width:44px;height:44px;min-width:44px;padding:0;border:0;border-radius:0;background:transparent;color:#637d69;font:14px/1 "Microsoft YaHei","PingFang SC",sans-serif;display:inline-flex;align-items:center;justify-content:center;position:relative;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}button:active:before{content:"";position:absolute;inset:5px 2px;background:#e1e8db;border-radius:999px;z-index:-1}button:focus-visible{outline:2px solid #70927a;outline-offset:-4px;border-radius:999px}svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.badge{position:absolute;top:8px;right:8px;min-width:12px;height:12px;border-radius:8px;padding:0 2px;background:#a74e47;color:#fff;font-size:8px;display:grid;place-items:center;border:1.5px solid #f0f2eb}#feedback{margin:20px 0 0;font-size:12px;color:#7a877b;min-height:20px;line-height:1.7}
</style></head><body><main aria-label="发现页入口样式预览"><div class="buttons"><button aria-label="打开商家工具" data-label="商家工具"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><button class="bell" aria-label="打开通知，2条未读" data-label="通知"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5ZM10 20h4"/></svg><span class="badge" aria-hidden="true">2</span></button></div><p id="feedback" role="status"></p></main><script>document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>document.getElementById('feedback').textContent='已点击'+button.dataset.label+' · 仅样式预览'));</script></body></html>
