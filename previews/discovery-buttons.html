<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>发现页入口样式</title><style>
:root{color-scheme:light;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#496b56;background:#fcfbf6}*{box-sizing:border-box}body{margin:0;min-height:100svh;padding:32px 20px}main{max-width:375px;margin:0 auto}.buttons{display:flex;align-items:center;gap:8px}button{height:44px;min-width:44px;padding:0 12px;border:1px solid #d2ddcc;border-radius:9px;background:#eef2e8;color:#496b56;font:14px/1 "Microsoft YaHei","PingFang SC",sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:7px;position:relative;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}button:active{background:#dfe8d8;border-color:#94ab8c}button:focus-visible{outline:2px solid #70927a;outline-offset:3px}svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.buttons button{width:44px;padding:0}.buttons{gap:4px}.badge{position:absolute;top:3px;right:3px;min-width:15px;height:15px;border-radius:9px;padding:0 3px;background:#a74e47;color:#fff;font-size:10px;display:grid;place-items:center;border:1.5px solid #eef2e8}#feedback{margin:20px 0 0;font-size:12px;color:#7a877b;min-height:20px;line-height:1.7}
</style></head><body><main aria-label="发现页入口样式预览"><div class="buttons"><button aria-label="打开商家工具" data-label="商家工具"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><button class="bell" aria-label="打开通知，2条未读" data-label="通知"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5ZM10 20h4"/></svg><span class="badge" aria-hidden="true">2</span></button></div><p id="feedback" role="status"></p></main><script>document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>document.getElementById('feedback').textContent='已点击'+button.dataset.label+' · 仅样式预览'));</script></body></html>
