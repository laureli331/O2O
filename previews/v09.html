<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>V09 私人工具 · 湘邻湘友</title>
<link rel="stylesheet" href="assets/v09.css"><link rel="stylesheet" href="assets/mobile-foundations.css"><script src="assets/v09-model.js"></script></head><body>
<main class="workspace"><header class="workspace-head"><div class="brand"><div class="mark">湘</div><div><h1>湘邻湘友 · V09</h1><p>收藏、草稿与私人地址簿 / <a href="v05.html">我的</a></p></div></div><span class="demo">本地合成演示</span></header>
<nav class="screen-nav" aria-label="演示页面"><button data-screen="A" aria-pressed="true">A 收藏</button><button data-screen="B" aria-pressed="false">B 草稿与常用需求</button><button data-screen="C" aria-pressed="false">C 地址簿</button><button data-screen="D" aria-pressed="false">D 新增地址</button></nav>
<div class="toolbar"><label>状态演示<select id="scenario"><option value="normal">正常记录</option><option value="guest">未登录</option><option value="empty">暂无记录</option><option value="failed">加载失败保留记录</option><option value="loading">加载中</option></select></label><label class="select-mode"><input id="selection-mode" type="checkbox">演示任务选址</label><button class="quiet" id="reset">重置演示</button></div>
<div class="device-label"><strong>私人工具</strong><span id="page-code">V09-A</span></div>
<article class="phone" id="tools-phone"><header class="phone-head"><button class="back" id="back" aria-label="返回我的"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button><h2 id="page-title">我的收藏</h2><span class="capsule" aria-hidden="true">··· ◎</span></header>
<div class="tabs" id="tool-tabs"></div><div class="scroll" id="tool-scroll"><div class="content" id="content"></div></div><footer class="footer" id="actions" hidden></footer>
<div class="dialog" id="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title" hidden><div class="dialog-box"><h3 id="confirm-title"></h3><p id="confirm-copy"></p><div class="dialog-actions"><button class="secondary" id="cancel-action">再想想</button><button class="primary" id="confirm-action">确认</button></div></div></div><div class="toast" id="toast" role="status" hidden></div></article>
<p class="bottom-note">仅本地合成预览，刷新恢复初始记录。继续填写会临时带入本次内容，不创建真实发布、云端草稿或地址记录。</p></main>
<script>
(()=>{'use strict';const M=V09Model,$=id=>document.getElementById(id),q=new URLSearchParams(location.search),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let s=M.create(),page=['A','B','C','D'].includes(q.get('page'))?q.get('page'):'A',favTab='demand',draftTab='drafts',editId=null,baseline='',callback=null,trigger=null,timer,previousScenario='normal',offsets={A:0,B:0,C:0};
 const icons={edit:'<path d="m14 4 6 6M4 20l4-1L20 7a2 2 0 0 0-3-3L5 16Z"/>',trash:'<path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/>',pin:'<path d="M19 10c0 5-7 12-7 12S5 15 5 10a7 7 0 0 1 14 0Z"/><circle cx="12" cy="10" r="2"/>'},icon=k=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+icons[k]+'</svg>',button=(label,action,cls='secondary',id='')=>'<button class="'+cls+'" data-action="'+action+'"'+(id?' data-id="'+id+'"':'')+'>'+label+'</button>',cover=k=>({repair:'repair',errands:'errand',idle:'desk',other:'storage'})[k],time=v=>new Date(v+8*3600000).toISOString().slice(0,16).replace('T',' ');
 function toast(t){clearTimeout(timer);$('toast').textContent=t;$('toast').hidden=false;timer=setTimeout(()=>$('toast').hidden=true,2600);}
 function empty(t,desc,cta=''){return '<section class="empty"><img src="assets/empty-notes.svg" alt=""><h3>'+t+'</h3><p>'+desc+'</p>'+cta+'</section>';}
 function dialog(title,copy,confirm,fn){trigger=document.activeElement;callback=fn;$('confirm-title').textContent=title;$('confirm-copy').textContent=copy;$('confirm-action').textContent=confirm;$('confirm-dialog').hidden=false;$('cancel-action').focus();}
 function close(){callback=null;$('confirm-dialog').hidden=true;if(trigger?.isConnected)trigger.focus();}
 function readAddress(){return Object.fromEntries(['name','phone','region','detail','note'].map(k=>[k,$('address-'+k)?.value||'']).concat([['isDefault',!!$('address-default')?.checked]]));}
 function dirty(){return page==='D'&&$('address-name')&&JSON.stringify(readAddress())!==baseline;}
 function navigate(next,id=null){const go=()=>{if(page!=='D')offsets[page]=$('tool-scroll').scrollTop;page=next;editId=id;render();};if(dirty())dialog('离开前保存修改？','未保存的内容会丢失。你可以返回继续编辑。','放弃修改',go);else go();}
 function tabs(){const pairs=page==='A'?[['demand','需求'],['work','作品']]:page==='B'?[['drafts','草稿'],['sources','常用／再次发布']]:[];$('tool-tabs').hidden=!pairs.length;$('tool-tabs').innerHTML=pairs.map(([key,label])=>'<button data-tab="'+key+'" aria-pressed="'+((page==='A'?favTab:draftTab)===key)+'">'+label+'</button>').join('');}
 function favorites(){const list=M.favorites(s,favTab);return list.length?list.map(r=>'<article class="panel favorite'+(!r.active?' is-unavailable':'')+'" data-record="'+r.id+'"><div class="favorite-content"><button class="item-open" data-action="view-favorite" data-id="'+r.id+'"'+(!r.active?' disabled aria-label="'+esc(r.title)+'，已失效，无法查看"':'')+'><img class="cover" src="assets/service-'+r.cover+'.svg" alt="'+esc(r.title)+'的演示首图"><span class="item-copy"><span class="tag">'+(r.type==='work'?'作品':M.kinds[r.kind])+'</span><strong>'+esc(r.title)+'</strong>'+(r.type==='work'?'<span class="work-author">'+esc(r.merchant)+'</span>':'<span class="price '+(r.price===null?'unknown':'')+'">'+(r.price===null?'费用待协商':'¥'+(r.price/100).toFixed(2))+'</span>')+'</span></button>'+(!r.active?'<div class="disabled-mask" aria-hidden="true"><span>已失效</span></div>':'')+'</div><div class="card-bottom"><span>'+(r.active?'查看当前公开内容':'已失效，无法查看')+'</span>'+button('取消收藏','remove-favorite','quiet',r.id)+'</div></article>').join(''):empty(favTab==='work'?'还没有收藏作品':'还没有收藏需求','遇到想留着看的内容，点一下收藏，下次更好找。','<a class="primary" href="'+(favTab==='work'?'v23.html':'v01-v02.html')+'">'+(favTab==='work'?'去发现看看':'去首页看看')+'</a>');}

 function drafts(){const sources=draftTab==='sources',list=M.rows(s,sources?'sources':'drafts');return list.length?list.map(r=>'<article class="panel draft" data-record="'+r.id+'"><div class="item"><img class="cover" src="assets/service-'+cover(r.kind)+'.svg" alt="'+M.kinds[r.kind]+'分类示意图"><div class="item-copy"><span class="tag">'+M.kinds[r.kind]+'</span><h3>'+esc(sources?r.title:r.data.title||'未命名草稿')+'</h3><p class="hint">'+(sources?(r.type==='template'?'文字模板 · 复用填写结构':'本人旧帖 · 只复制公开内容'):'保存于 '+time(r.saved))+'</p>'+(!sources&&(!r.data.title||!r.data.note)?'<span class="incomplete">还有内容待补充</span>':'')+'</div></div><div class="card-bottom"><span>'+(sources?'核对本次内容后再发布':'仅本人可见')+'</span><div class="card-buttons">'+(!sources?'<button class="icon-button" data-action="remove-draft" data-id="'+r.id+'" aria-label="删除'+esc(r.data.title||'未命名草稿')+'">'+icon('trash')+'</button>':'')+button(sources?'复制到新表单':'继续填写',sources?'copy-source':'restore-draft','primary',r.id)+'</div></div></article>').join(''):empty(sources?'还没有常用需求':'还没有草稿',sources?'发布后的公开内容，可按需复用。':'先写下需求并保存，下次回来接着填。','<a class="primary" href="v04.html">去填写需求</a>');}
 function snapshot(){return s.snapshot?'<details class="panel snapshot" open><summary>本次任务已选地址</summary><p>'+esc(s.snapshot.name)+' · '+esc(s.snapshot.phone)+'</p><p>'+esc(s.snapshot.region+' · '+s.snapshot.detail)+'</p><small>已独立保存本次选择，修改地址簿不会改变它。</small></details>':'';}
 function addresses(){const list=M.rows(s,'addresses'),pick=$('selection-mode').checked;return snapshot()+(list.length?list.map(r=>'<article class="panel address-card" data-record="'+r.id+'"><div class="address-head"><strong>'+esc(r.name)+'</strong><span>'+esc(r.phone)+'</span><button class="icon-button" data-action="edit-address" data-id="'+r.id+'" aria-label="编辑'+esc(r.name)+'地址">'+icon('edit')+'</button></div><p class="address-text">'+esc(r.region)+' · '+esc(r.detail)+'</p>'+(r.note?'<p class="hint">'+esc(r.note)+'</p>':'')+'<div class="card-bottom"><span>'+(r.isDefault?'<span class="tag">默认地址</span>':'私人地址')+'</span><div class="card-buttons">'+button('删除','remove-address','quiet',r.id)+(pick?button('选用本地址','choose-address','primary',r.id):'')+'</div></div></article>').join(''):empty('还没有常用地址','保存常用联系人和地址，下次按需选用。',button('新增地址','new-address','primary')));}
 function editor(){const d=editId?M.get(s,'addresses',editId):{name:'',phone:'',region:'',detail:'',note:'',isDefault:false};return '<form id="address-form" novalidate><p class="hint editor-intro">仅保存在你的私人地址簿。</p><section class="panel fields">'+[['name','联系人','1—20字','text',20],['phone','联系电话','11位电话号码','tel',11],['region','村／社区','','select',0],['detail','详细地址','楼栋、门牌或方便找到的位置','textarea',200],['note','备注','选填，如方便联系的时间','textarea',100]].map(([key,label,placeholder,type,max])=>'<div class="field"><label for="address-'+key+'">'+label+(key!=='note'?'<span class="required"> *</span>':'<small>选填</small>')+'</label>'+(type==='select'?'<select id="address-region"><option value="">请选择村／社区</option>'+M.regions.map(v=>'<option'+(d.region===v?' selected':'')+'>'+esc(v)+'</option>').join('')+'</select>':type==='textarea'?'<textarea id="address-'+key+'" rows="'+(key==='detail'?3:2)+'" maxlength="'+max+'" placeholder="'+placeholder+'">'+esc(d[key])+'</textarea>':'<input id="address-'+key+'" type="'+type+'" '+(key==='phone'?'inputmode="numeric" ':'')+'maxlength="'+max+'" value="'+esc(d[key])+'" placeholder="'+placeholder+'" autocomplete="off">')+'<p class="field-issue" id="issue-'+key+'" hidden></p></div>').join('')+'</section><section class="panel default-row"><label for="address-default"><span>设为默认地址<small>每次选址时更容易找到</small></span><input id="address-default" type="checkbox"'+(d.isDefault?' checked':'')+'></label></section><p id="form-error" class="error" role="alert" tabindex="-1" hidden></p>'+(editId?button('删除这个地址','remove-address','delete-address',editId):'')+'</form>';}
 function render(){const titles={A:'我的收藏',B:'我的草稿',C:$('selection-mode').checked?'选择私人地址':'私人地址簿',D:editId?'编辑地址':'新增地址'};$('page-title').textContent=titles[page];$('page-code').textContent='V09-'+page;$('back').setAttribute('aria-label',page==='D'?'返回地址簿':'返回我的');document.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.screen===page)));tabs();$('actions').hidden=true;$('actions').innerHTML='';
  if(!s.user){$('content').innerHTML=empty('登录后使用私人工具','收藏、草稿和地址只向你本人展示。',button('登录体验','login','primary'));return;}
  if($('scenario').value==='loading'){$('content').innerHTML='<div class="skeleton" aria-label="正在加载"></div><div class="skeleton" aria-hidden="true"></div>';return;}
  const warning=$('scenario').value==='failed'?'<div class="notice warning" role="status">暂未获取最新记录，已保留当前内容。'+button('重新加载','retry','quiet')+'</div>':'';
  $('content').innerHTML=warning+({A:favorites,B:drafts,C:addresses,D:editor}[page])();
  if(page==='D'){baseline=JSON.stringify(readAddress());$('actions').innerHTML=button('保存地址','save-address','primary');}else if(page==='C')$('actions').innerHTML=button('新增地址','new-address','primary');else if(page==='B')$('actions').innerHTML='<a class="primary" href="v04.html">新建需求</a>';
  $('actions').hidden=!$('actions').innerHTML;$('tool-scroll').scrollTop=page==='D'?0:offsets[page];
 }
 function transfer(id,mode){const payload=M.transfer(s,id,mode);sessionStorage.setItem('o2o-v09-form-transfer',JSON.stringify({...payload,owner:'me',expires:Date.now()+300000}));location.href='v04.html?from=tools';}
 function remove(key,id){const cards=[...document.querySelectorAll('#content [data-record]')],index=cards.findIndex(card=>card.dataset.record===id);if(page!=='D')offsets[page]=$('tool-scroll').scrollTop;const r=M.get(s,key,id),name=key==='addresses'?'地址':key==='drafts'?'草稿':'收藏';dialog('确认'+(name==='收藏'?'取消收藏':'删除这份'+name)+'？',name==='地址'?'只删除地址簿记录，不影响已选入任务的地址。':name==='草稿'?'删除后，本次预览中将无法继续编辑这份草稿。':'取消后，原公开内容不受影响。',name==='收藏'?'取消收藏':'确认删除',()=>{M.remove(s,key,id);if(page==='D'){page='C';editId=null;}render();const remaining=[...document.querySelectorAll('#content [data-record]')],near=remaining[Math.min(Math.max(index,0),remaining.length-1)],target=near?.querySelector('button:not(:disabled),a[href]')||document.querySelector('#content .empty .primary')||document.querySelector('#actions button')||document.querySelector('#tool-tabs [aria-pressed=true]');target?.focus({preventScroll:true});toast(name==='收藏'?'已取消收藏':'已删除'+name);});}
 document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;try{if(b.dataset.screen){navigate(b.dataset.screen);return;}if(b.dataset.tab){if(page==='A')favTab=b.dataset.tab;else draftTab=b.dataset.tab;offsets[page]=0;render();return;}const a=b.dataset.action,id=b.dataset.id;if(a==='view-favorite'){const r=M.favorites(s,favTab).find(x=>x.id===id);if(!r?.active)throw Error('内容已失效');location.href=(r.type==='work'?'v23.html':'v01-v02.html')+'?post='+encodeURIComponent(r.publicId);}if(a==='remove-favorite')remove('favorites',id);if(a==='remove-draft')remove('drafts',id);if(a==='remove-address')remove('addresses',id);if(a==='restore-draft')transfer(id,'draft');if(a==='copy-source')transfer(id,'copy');if(a==='new-address')navigate('D');if(a==='edit-address')navigate('D',id);if(a==='choose-address'){M.choose(s,id);render();toast('已选入本次任务（演示）');}if(a==='login'){$('scenario').value='normal';s.user='me';render();}if(a==='retry'){$('scenario').value='normal';render();}if(a==='save-address'){const d=readAddress(),errors=M.issues(d);for(const key of ['name','phone','region','detail','note']){const el=$('address-'+key),issue=$('issue-'+key);issue.textContent=errors[key]||'';issue.hidden=!errors[key];el.setAttribute('aria-invalid',String(!!errors[key]));el.setAttribute('aria-describedby','issue-'+key);}if(Object.keys(errors).length){$('form-error').textContent='请核对标记的内容，再保存。';$('form-error').hidden=false;$('address-'+Object.keys(errors)[0]).focus();return;}M.saveAddress(s,editId,d);page='C';editId=null;render();toast('地址已保存（本页演示）');}}catch(error){toast(error.message);}});
 document.addEventListener('input',e=>{if(!e.target.id.startsWith('address-'))return;const key=e.target.id.slice(8),issue=$('issue-'+key);if(issue&&!M.issues(readAddress())[key]){issue.hidden=true;e.target.setAttribute('aria-invalid','false');}if($('form-error')&&!Object.keys(M.issues(readAddress())).length)$('form-error').hidden=true;});document.addEventListener('change',e=>{if(e.target.id==='address-region')e.target.dispatchEvent(new Event('input',{bubbles:true}));});
 document.addEventListener('submit',e=>{if(e.target.id==='address-form')e.preventDefault();});$('confirm-action').addEventListener('click',()=>{const fn=callback;close();fn?.();});$('cancel-action').addEventListener('click',close);$('confirm-dialog').addEventListener('click',e=>{if(e.target===$('confirm-dialog'))close();});document.addEventListener('keydown',e=>{if($('confirm-dialog').hidden)return;if(e.key==='Escape')close();if(e.key==='Tab'){const first=$('cancel-action'),last=$('confirm-action');if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
 $('back').addEventListener('click',()=>{if(page==='D')navigate('C');else location.href='v05.html';});$('selection-mode').addEventListener('change',()=>navigate('C'));function applyScenario(value){if(value==='empty'){for(const key of ['favorites','drafts','sources','addresses'])s[key]=s[key].filter(row=>row.owner!=='me');s.snapshot=null;}s.user=value==='guest'?null:'me';previousScenario=value;$('scenario').value=value;render();}$('scenario').addEventListener('change',()=>{const value=$('scenario').value;if(dirty()){$('scenario').value=previousScenario;dialog('切换演示状态？','未保存的地址修改会丢失。','确认切换',()=>{page='C';applyScenario(value);});return;}applyScenario(value);});$('reset').addEventListener('click',()=>{const reset=()=>{s=M.create();previousScenario='normal';$('scenario').value='normal';$('selection-mode').checked=false;page='A';favTab='demand';draftTab='drafts';editId=null;offsets={A:0,B:0,C:0};render();};if(dirty())dialog('重置本次演示？','未保存的地址修改会丢失。','确认重置',reset);else reset();});render();
})();
</script></body></html>
