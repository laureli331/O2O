 const card=post=>`<button class="post-card" data-post="${post.id}"><div class="cover ${post.height>180?'tall':''}" style="--a:${post.colors[0]};--b:${post.colors[1]}">${post.cover}</div><div class="card-copy"><h4>${esc(post.title)}</h4><div class="merchant"><span class="avatar">${post.merchant[0]}</span><span>${esc(post.merchant)}</span><span class="verified">已审核</span></div></div></button>`;
 function renderFeed(list=lastFeed){setActive('feed');navActive('发现');setHead('发现');$('main-code').textContent='V23-A · 发现';if(!list.length){main.innerHTML='<div class="empty-state"><h3>这里还没有可展示的商家主帖</h3><p>审核通过且当前可展示的内容会出现在这里。<br>不会用假帖子填充空状态。</p></div>';return;}const columns=M.layout(list.map(post=>post.height));main.innerHTML=`<section class="hero"><small>附近 · 商家新鲜事</small><h3>慢慢逛，看看身边。</h3><p>仅展示审核通过且当前可展示的商家图文主帖。</p></section><div class="feed-tools"><strong>最新发布</strong><button class="quiet" data-action="simulate-load">演示加载失败</button></div><div class="waterfall">${columns.map(indexes=>`<div class="column">${indexes.map(index=>card(list[index])).join('')}</div>`).join('')}</div>`;}
 function openDetail(post=current){current=post;galleryIndex=0;$('detail-code').textContent='V23-B · 公开详情';drawDetail();}
 function drawDetail(){const post=current,published=post.approvedAt.slice(0,16).replace('T',' ');detail.className='';detail.innerHTML=`<div class="gallery" style="--a:${post.colors[0]};--b:${post.colors[1]}"><button class="icon-button back" data-action="close-detail" aria-label="关闭详情">←</button><span>${post.images[galleryIndex]}</span><span class="gallery-count">${galleryIndex+1} / ${post.images.length}</span><div class="gallery-nav">${post.images.map((_,index)=>`<button class="${index===galleryIndex?'active':''}" data-gallery="${index}" aria-label="第${index+1}张图"></button>`).join('')}</div></div><div class="detail-body"><h2 class="detail-title">${esc(post.title)}</h2><p class="area">发布时间：${published}</p><p class="detail-text">${esc(post.body)}</p><div class="merchant-panel"><div class="merchant"><span class="avatar">${post.merchant[0]}</span><div><strong>${esc(post.merchant)} <span class="verified">资料已审核</span></strong><div class="area">服务区域：${esc(post.area)}</div></div></div><button class="quiet" data-action="merchant-profile">查看商家公开资料</button></div><div class="notice">这里只展示商家审核资料中的公开名称和服务区域；不从主帖正文公开电话、微信、详细地址或证件。</div><div class="actions"><button class="secondary" data-action="favorite">${icon('heart')} <span>${favorite?'已收藏':'收藏'}</span></button><button class="primary" data-action="share">${icon('share')} 微信分享示意</button></div><label class="hint" style="display:block;margin-top:12px"><input id="favorite-failure" type="checkbox" ${failFavorite?'checked':''}> 演示收藏失败并回滚</label></div>`;}
 function renderEditor(){setActive('edit');navActive('发布');setHead('商家主帖');$('main-code').textContent='V23-C · 发布编辑';const gate=M.eligibility(role.value);if(!gate.canSubmit){main.innerHTML=gate.status==='pending'?'<div class="state-card"><div class="state-icon">审</div><h3>商家资料审核中</h3><p>资料通过后才可提交商家主帖。当前仍可使用居民维修、跑腿、闲置和其它发布。</p><div class="notice warning">待审核商家只能查看状态，不能提交主帖。</div></div>':'<div class="state-card"><div class="state-icon">邻</div><h3>当前是普通居民</h3><p>普通居民没有商家主帖入口。居民四类需求仍留在首页发布，不进入发现。</p></div>';return;}main.innerHTML=`<div class="notice">基础主帖免费，不需要会员或内容加热；提交后仍需审核。</div><section class="panel"><div class="field"><label>图片 <span class="counter" id="image-count">${images.length} / 9 · 首图为封面</span></label><div class="photo-row" id="photo-row">${images.map((image,index)=>`<div class="photo-tile" style="--a:${['#9caf83','#c69f72','#7d987a'][index%3]};--b:${['#d5b378','#a98363','#b6c697'][index%3]}">${image}${index?`<button data-move="${index}" aria-label="将第${index+1}张移为封面">←</button>`:''}</div>`).join('')}</div></div><div class="field"><label for="post-title">标题 <span class="counter" id="title-count">12 / 20</span></label><input id="post-title" maxlength="40" value="秋日手作面包刚出炉"></div><div class="field"><label for="post-body">正文 <span class="counter" id="body-count">32 / 1000</span></label><textarea id="post-body">小批量烘焙，使用当日准备的原料。是否有货以店内实际情况为准。</textarea></div><p class="hint">商家名称和服务区域取自已审核资料；这里不另填电话、微信或详细地址。</p></section><div class="form-actions"><button class="secondary" data-action="save-draft">保存草稿</button><button class="primary" data-action="preview-post">预览主帖</button></div>`;updateCounters();}
 function updateCounters(){if(!$('title-count'))return;$('title-count').textContent=M.visibleLength($('post-title').value)+' / 20';$('body-count').textContent=M.visibleLength($('post-body').value)+' / 1000';}
 function renderPreview(){const post={title:$('post-title')?.value||'秋日手作面包刚出炉',body:$('post-body')?.value||'小批量烘焙，使用当日准备的原料。',images};const errors=M.postErrors(post);setActive('preview');setHead('预览确认');$('main-code').textContent='V23-D · 预览确认';main.innerHTML=`${errors.length?`<div class="notice danger">${errors.join('<br>')}</div>`:''}<section class="panel"><div class="cover" style="--a:#9caf83;--b:#d5b378">${images[0]||'图'}</div><h3 style="margin-top:14px">${esc(post.title)}</h3><p class="detail-text">${esc(post.body)}</p><div class="merchant"><span class="avatar">青</span>青禾面包房 <span class="verified">资料已审核</span></div></section><div class="notice">提交审核后不会立即公开。若这是已发布主帖的修改，审核期间旧公开版继续展示。</div><div class="form-actions"><button class="secondary" data-action="edit-post">返回修改</button><button class="primary" data-action="submit-review" ${errors.length?'disabled':''}>确认提交审核</button></div>`;}
 function renderState(state){setActive(state);navActive('发布');setHead('主帖状态');const v=M.version(state),maps={pending:['审核中','新版正在审核','旧公开版继续展示。审核通过前，公众仍看到版本 1。','审'],rejected:['审核未通过','新版需要修改','原因：图片中包含无法确认的联系方式。旧公开版继续展示，可修改后重新提交。','!'],approved:['新版已发布','已原子替换公开版','当前公开版本为 2；旧版本不会与新版同时展示。','✓'],'risk-removed':['风险内容已下架','当前公众不可见','因明显风险先行下架并保留操作记录；商家可从通知中心查看原因与申诉入口。','停']},map=maps[state];$('main-code').textContent='V23-E · '+map[0];main.innerHTML=`<div class="state-card"><div class="state-icon">${map[3]}</div><h3>${map[1]}</h3><p>${map[2]}</p></div><section class="panel"><h3>版本记录</h3><div class="version-row"><span>公开版本</span><strong>${v.publicVersion===null?'无':v.publicVersion}</strong></div><div class="version-row"><span>审核版本</span><strong>${v.reviewVersion===null?'无':v.reviewVersion}</strong></div><div class="version-row"><span>公众可见</span><strong>${v.publicVisible?'是':'否'}</strong></div></section>${state==='rejected'?'<button class="primary" data-action="edit-post" style="width:100%">修改后重新提交</button>':''}`;}
 function renderEmpty(){renderFeed([]);setActive('empty');$('main-code').textContent='V23-A · 空状态';}
 function renderFailed(){renderFeed(lastFeed);setActive('failed');$('main-code').textContent='V23-A · 加载失败';main.insertAdjacentHTML('afterbegin','<div class="notice warning">加载失败，已保留上次内容。<button class="quiet" data-action="retry-feed">重新加载</button></div>');}
 function renderGuest(){renderFeed(lastFeed);setActive('guest');$('main-code').textContent='V23-A · 未登录';main.insertAdjacentHTML('afterbegin','<div class="notice">未登录也可以浏览公开主帖；收藏时再完成登录，不影响当前浏览。</div>');}
 function renderService(){setActive('service');navActive('服务');const count=M.badge(unreadCount),badge=count===null?'':`<span class="unread-badge">${count}</span>`,label=count===null?'通知中心，无未读':'通知中心，'+count+'条未读';setHead('服务',`<button class="head-action" data-action="open-notices" aria-label="${label}">${icon('message')}${badge}</button>`);$('main-code').textContent='V10 · 服务';main.innerHTML=`<section class="hero"><small>附近服务</small><h3>找找身边能帮忙的人。</h3><p>维修、跑腿公开服务资料可以浏览；合法联系按当前授权开放。</p></section><div class="notice">通知中心位于服务页右上角二级入口，不再占用底部导航。</div><section class="panel"><h3>公开服务资料</h3><p class="hint">此处只演示通知入口层级，不扩展新的服务目录。</p>${count===null?'<p class="hint">当前无未读通知，右上角不显示角标。</p>':'<button class="quiet" data-action="clear-notices">演示全部标为已读</button>'}</section>`;}
 function renderNotices(){setActive('notices');navActive('服务');setHead('通知中心');const count=M.badge(unreadCount);$('main-code').textContent='V14 · 二级通知';main.innerHTML=`<div class="notice">服务页右上角二级入口 · ${count===null?'当前无未读':count+'条未读'}</div><section class="panel"><button class="notification-item" data-notice-state="rejected"><strong>${count===null?'':'<span class="dot"></span>'}主帖审核未通过</strong><p>新版需要修改，旧公开版仍在展示。查看原因与修改入口。</p></button><button class="notification-item" data-notice-state="risk-removed"><strong>${count===null?'':'<span class="dot"></span>'}主帖已下架</strong><p>风险内容已下架并留有记录。查看原因与申诉入口。</p></button><button class="notification-item" data-notice-state="approved"><strong>新版审核通过</strong><p>新版已替换旧公开版。</p></button></section><button class="secondary" data-action="back-service" style="width:100%">返回服务</button>`;}
 function merchantProfile(){const post=current;detail.className='';detail.innerHTML=`<header class="phone-head"><button class="head-action" data-action="back-detail" aria-label="返回主帖">←</button><h2>商家公开资料</h2><span></span></header><div class="detail-body"><section class="hero"><small>资料已审核</small><h3>${esc(post.merchant)}</h3><p>服务区域：${esc(post.area)}</p></section><div class="notice">这里只衔接商家已授权的公开资料。联系方式是否公开，以商家资料当前授权为准；主帖不会自行新增电话、微信或详细地址。</div><button class="secondary" data-action="back-detail" style="width:100%">返回主帖</button></div>`;}
 function loadingFailure(){main.innerHTML='<div class="skeleton"><div class="bone"></div><div class="bone"></div></div>';clearTimeout(loadingTimer);loadingTimer=setTimeout(renderFailed,420);}
 document.addEventListener('click',event=>{const screen=event.target.closest('[data-screen]')?.dataset.screen;if(screen){if(screen==='feed')renderFeed();else if(screen==='empty')renderEmpty();else if(screen==='failed')renderFailed();else if(screen==='guest')renderGuest();else if(screen==='detail')openDetail();else if(screen==='edit')renderEditor();else if(screen==='preview'){renderEditor();renderPreview();}else if(screen==='service')renderService();else if(screen==='notices')renderNotices();else renderState(screen);return;}const tab=event.target.closest('[data-tab]')?.dataset.tab;if(tab){if(tab==='发现')renderFeed();else if(tab==='发布')renderEditor();else if(tab==='服务')renderService();else showToast(tab+'在其它合成预览中展示');return;}const postId=event.target.closest('[data-post]')?.dataset.post;if(postId){openDetail(M.posts.find(post=>post.id===postId));return;}const gallery=event.target.closest('[data-gallery]')?.dataset.gallery;if(gallery!==undefined){galleryIndex=Number(gallery);drawDetail();return;}const move=event.target.closest('[data-move]')?.dataset.move;if(move){const [selected]=images.splice(Number(move),1);images.unshift(selected);renderEditor();return;}const notice=event.target.closest('[data-notice-state]')?.dataset.noticeState;if(notice){renderState(notice);return;}const action=event.target.closest('[data-action]')?.dataset.action;if(!action)return;if(action==='favorite'){favorite=M.favorite(favorite,failFavorite);drawDetail();showToast(failFavorite?'收藏失败，已恢复原状态':favorite?'已收藏':'已取消收藏');}else if(action==='share')showToast('微信分享示意：仅包含已批准公开字段');else if(action==='merchant-profile')merchantProfile();else if(action==='back-detail')drawDetail();else if(action==='close-detail'){detail.className='detail-empty';detail.innerHTML='<div><p>已关闭主帖详情。</p></div>';}else if(action==='simulate-load')loadingFailure();else if(action==='retry-feed'){renderFeed();showToast('已重新加载合成内容');}else if(action==='preview-post')renderPreview();else if(action==='edit-post')renderEditor();else if(action==='submit-review')renderState('pending');else if(action==='save-draft')showToast('草稿已保存（仅合成示意）');else if(action==='open-notices')renderNotices();else if(action==='clear-notices'){unreadCount=0;renderService();showToast('已标为已读，角标已隐藏');}else if(action==='back-service')renderService();});
 document.addEventListener('input',event=>{if(event.target.id==='post-title'||event.target.id==='post-body')updateCounters();if(event.target.id==='favorite-failure')failFavorite=event.target.checked;});role.addEventListener('change',()=>renderEditor());renderFeed();openDetail();
})();
</script></body></html>
