<script id="v07-model">
var V07Model=(()=>{
 const NOW=Date.UTC(2026,9,20,2),HOUR=3600000,MAX=9999999;
 const count=v=>Array.from(String(v??'').trim()).length;
 const cents=v=>/^\d+(?:\.\d{1,2})?$/.test(String(v).trim())&&Number(v)<=99999.99?Math.round(Number(v)*100):null;
 const money=v=>v===null||v===undefined?'待协商':'¥'+(v/100).toFixed(2);
 function create(kind){return {kind,id:'DEMO-'+({维修:'WX',跑腿:'PT',闲置:'XZ',其它:'QT'}[kind])+'-1020',status:'active',now:NOW,start:NOW+HOUR,due:NOW+8*HOUR,protection:null,outage:false,recovered:null,dispute:null,disputeVersion:0,phoneUntil:null,feeWindow:null,price:8600,originalPrice:8600,runFee:1200,advance:false,limit:null,buyerDue:NOW+8*HOUR,stages:kind==='维修'?[{id:'ST-01',name:'上门检查',items:[{name:'检查服务',type:'service',amount:8000}],version:1}]:kind==='其它'?[]:[],pending:{},history:[],content:kind==='维修'?'洗衣机无法启动，需上门检查':kind==='跑腿'?'帮忙代取一个快递':kind==='闲置'?'九成新折叠书桌':'周末帮忙整理储物间',area:'湘邻社区',nextStage:2};}
 function totals(s){if(s.kind==='跑腿')return {service:s.runFee,expense:null,total:null};if(s.kind==='闲置')return {service:s.price,expense:0,total:s.price};if(!s.stages.length)return {service:null,expense:null,total:null};let service=0,expense=0;for(const st of s.stages)for(const i of st.items){if(i.type==='service')service+=i.amount;else expense+=i.amount;}return {service,expense,total:service+expense};}
 function commission(s){const base=totals(s).service;if(base===null)return null;const rates={维修:.15,跑腿:.15,闲置:.01,其它:.10},caps={维修:3000,跑腿:Infinity,闲置:2000,其它:2000};return Math.min(Math.round(base*rates[s.kind]),caps[s.kind]);}
 function feeErrors(s,p){const errors=[];if(count(p.stage)<1||count(p.stage)>30)errors.push('阶段名称填写1—30字');if(!p.items||p.items.length<1||p.items.length>20)errors.push('费用项目应为1—20项');let sum=0;for(const i of p.items||[]){if(count(i.name)<1||count(i.name)>30)errors.push('项目名称填写1—30字');if(!['service','expense'].includes(i.type))errors.push('请选择费用类别');if(!Number.isInteger(i.amount)||i.amount<0||i.amount>MAX)errors.push('填写明确金额，最多99,999.99元');else sum+=i.amount;if(count(i.note)>300)errors.push('备注最多300字');}if(sum>MAX||(totals(s).total||0)+sum>MAX)errors.push('整次服务累计不超过99,999.99元');if(p.advance&&(!Number.isInteger(p.limit)||p.limit<0||p.limit>MAX))errors.push('填写垫付上限，可为0');return errors;}
 const end=s=>['ended','cancelled'].includes(s.status);
 function log(s,text){s.history.unshift({at:s.now,text});}
 function propose(s,type,data,author){if(s.pending[type])throw Error('已有待回复请求，请先撤回');if(end(s)&&!['fee','phone'].includes(type))throw Error('交易已结束，不能发起此请求');if(type==='fee'){if(!['维修','其它'].includes(s.kind))throw Error('此业务请使用约定变更');const e=feeErrors(s,data);if(e.length)throw Error(e[0]);}if(type==='extension'&&(!Number.isFinite(data.due)||data.due<=s.due||data.due>s.due+168*HOUR))throw Error('延期须晚于当前到期，且最多后移168小时');if(type==='cancel'&&(count(data.reason)<1||count(data.reason)>500))throw Error('取消说明填写1—500字');if(type==='release'&&(!s.dispute||data.version!==s.dispute.version))throw Error('请核对当前全部异议');if(type==='trade'){if(s.kind!=='闲置'||s.status!=='unconfirmed'||author!=='provider')throw Error('仅卖家向已获准买家发起');if(!Number.isInteger(data.price)||data.price<=0||data.price>MAX)throw Error('交易金额必须为正数');if(data.due!==s.buyerDue||data.due<=s.now||data.due>s.now+720*HOUR)throw Error('请采用买家当前有效时间');}if(type==='phone'&&(!end(s)||!data.consent))throw Error('请明确同意本次费用处理电话恢复');s.pending[type]={type,author,data,at:s.now};log(s,'提交'+type+'请求，等待另一方回复');return s;}
 function respond(s,type,answer,role,reason=''){const p=s.pending[type];if(!p)throw Error('当前没有待回复请求');if(role===p.author)throw Error('请由另一方回复');if(answer==='reject'&&type==='trade'&&(count(reason)<1||count(reason)>300))throw Error('不同意理由填写1—300字');if(answer==='reject'&&type==='cancel'&&(count(reason)<1||count(reason)>(s.kind==='闲置'?300:500)))throw Error('请填写不同意取消的理由');if(type==='release'&&(!s.dispute||p.data.version!==s.dispute.version)){delete s.pending[type];throw Error('有新增异议，请重新发起全部解除');}if(answer==='accept'){
  if(type==='fee'){const firstUnknown=totals(s).service===null;s.stages.push({id:'ST-'+String(s.nextStage++).padStart(2,'0'),name:p.data.stage,items:p.data.items,version:1});s.advance=p.data.advance;s.limit=p.data.advance?p.data.limit:null;if(s.status==='ended'&&firstUnknown&&!s.feeWindow)s.feeWindow=s.now+72*HOUR;}
  if(type==='extension'){if(end(s))throw Error('已结束交易不能延期');s.due=p.data.due;}
  if(type==='cancel'){s.status='cancelled';for(const key of ['extension','release','change'])delete s.pending[key];if(s.pending.fee){log(s,'取消关闭未决费用方案；已发生部分可重新协商');delete s.pending.fee;}}
  if(type==='release')s.dispute=null;
  if(type==='change'){s.content=p.data.content;s.area=p.data.area;if(p.data.amount!==null&&p.data.amount!==undefined){if(s.kind==='闲置')s.price=p.data.amount;else if(s.kind==='跑腿')s.runFee=p.data.amount;}}
  if(type==='trade'){s.price=p.data.price;s.due=p.data.due;s.status='active';}
  if(type==='phone')s.phoneUntil=s.now+24*HOUR;
 }log(s,(answer==='accept'?'同意':'不同意')+type+'当前版本'+(reason?'：'+reason:''));delete s.pending[type];return s;}
 function withdraw(s,type,role){const p=s.pending[type];if(!p||p.author!==role)throw Error('仅发起方可撤回');delete s.pending[type];log(s,'撤回'+type+'请求');}
 function addDispute(s,text){if(end(s))throw Error('交易已结束，请通过费用后处理或申诉入口处理');if(count(text)<1||count(text)>500)throw Error('说明填写1—500字');s.disputeVersion++;s.dispute={version:s.disputeVersion,text:(s.dispute?s.dispute.text+'；补充：':'')+text};log(s,'交付异议有效提交，未核实为事实');}
 function canClose(s,now){return s.status==='active'&&!s.dispute&&!s.outage&&now>Math.max(s.due,s.protection||0);}
 function close(s,now){if(!canClose(s,now))throw Error('仍在有效到期或保护内，或有异议/故障');s.now=now;s.status='ended';for(const t of ['extension','cancel','release','change'])delete s.pending[t];log(s,'按到期规则自动结束；不代表实际付款');}
 function access(s,now){return {phone:s.status==='active'||(end(s)&&s.phoneUntil!==null&&now<s.phoneUntil),address:s.status==='active',oldEvidence:s.status==='active'};}

 return {NOW,HOUR,MAX,count,cents,money,create,totals,commission,feeErrors,propose,respond,withdraw,addDispute,canClose,close,access,fileErrors,log,end};
})();

<script>
(()=>{'use strict';const M=V07Model,$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let s=M.create('维修'),page='B',listTab='已承接',listKind='全部',listStatus='全部',feeRows=[{name:'',type:'service',amount:'',note:''}],feedback='',toastTimer;
 const pages={'A':['我服务的','本人申请与交易'],'B':['服务详情','维修 / 其它'],'C':['跑腿订单','当前双方'],'D':['提出交易时间','闲置买家'],'E':['发起闲置交易','闲置卖家'],'F':['闲置交易待确认','买家 / 卖家'],'G':['闲置交易详情','当前双方'],'H':['本次服务费用','有效约定与待回复'],'I':['阶段费用约定','由另一方确认'],'J':['费用方案待回复','当前版本'],'K':['变更约定','原约定继续有效'],'L':['延长到期','双方明确同意'],'M':['申请取消','双方明确同意'],'N':['交付异议','提出 / 补充'],'O':['协商解除异议','覆盖全部当前事项'],'P':['交易状态','到期 / 故障 / 保护'],'Q':['结束后费用处理','不重开交易'],'R':['临时恢复电话','仅本次费用处理'],'S':['约定与请求历史','必要历史记录']};
 const names={维修:'洗衣机无法启动',跑腿:'帮忙代取一个快递',闲置:'九成新折叠书桌',其它:'周末整理储物间'},requestNames={fee:'费用方案',extension:'延期',cancel:'取消',release:'解除异议',change:'约定变更',trade:'闲置交易',phone:'恢复电话'};
 const role=()=>$('role').value,other=()=>role()==='provider'?'发布者 / 买家':'接单员 / 卖家',fmt=v=>v===null?'—':new Date(v+8*M.HOUR).toISOString().slice(0,16).replace('T',' '),local=v=>new Date(v+8*M.HOUR).toISOString().slice(0,16),parseDate=v=>v?Date.parse(v+':00+08:00'):NaN,status=()=>({active:s.dispute?'有交付异议':s.outage?'故障处理中':s.protection&&s.now<=s.protection?'恢复后保护中':'进行中',ended:'已到期结束',cancelled:'双方已取消',unconfirmed:'待买家确认'}[s.status]);
 const button=(label,to,cls='secondary')=>`<button class="${cls}" data-page="${to}">${label}</button>`,link=(label,to)=>`<button class="text-link" data-page="${to}">${label}</button>`,kv=(label,value)=>`<dt>${esc(label)}</dt><dd>${value}</dd>`,field=(label,id,value='',type='text',hint='')=>`<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${type==='text'?'autocomplete="off"':''}>${hint?'<small>'+hint+'</small>':''}</div>`,area=(label,id,placeholder,max=500)=>`<div class="field"><label for="${id}">${label}</label><textarea id="${id}" placeholder="${placeholder}" maxlength="${max}"></textarea><small>最多${max}字</small></div>`,files=(max=9,id='attachments')=>`<div class="field"><label for="${id}">图片 · 选填</label><input id="${id}" type="file" accept="image/jpeg,image/png" multiple data-max="${max}"><small>JPEG / PNG，最多${max}张，每张不超过5MB</small><p class="attachment-result" role="status"></p></div>`,note=(text,warn=false)=>`<div class="note${warn?' warning':''}">${text}</div>`;
 function toast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,3200);}
 function footer(html=''){$('detail-footer').innerHTML=html;$('detail-footer').hidden=!html;}
 function error(text){feedback=text;let el=$('form-error');if(!el){el=document.createElement('div');el.id='form-error';el.className='error';el.setAttribute('role','alert');$('detail-content').append(el);}el.textContent=text;el.scrollIntoView({block:'nearest'});}
 function heading(){return `<section class="summary"><div class="status">${status()}</div><div class="task-top"><h3>${esc(names[s.kind])}</h3><span class="tag">${s.kind}</span></div><p class="hint">${s.id} · 本人：${role()==='provider'?(s.kind==='闲置'?'卖家':'接单员'):(s.kind==='闲置'?'买家':'发布者')}</p></section>`;}

 function timeline(){return `<section class="panel"><h3>时间约定</h3><dl class="kv">${s.kind==='闲置'?'':kv('期望开始',fmt(s.start))}${kv('服务到期',fmt(s.due))}${s.protection?kv('独立保护截止',fmt(s.protection)):''}</dl>${s.outage?'<p class="hint danger-text">受影响交易暂缓自动收尾，等待恢复验收。</p>':s.protection?'<p class="hint">保护不改变原服务时间。</p>':''}</section>`;}
 function contacts(){const a=M.access(s,s.now);return `<section class="panel"><h3>对方资料</h3><div class="person"><div class="avatar">邻</div><div><h4>${other()} · 演示邻居</h4><p>${s.area}</p></div></div><dl class="kv">${kv('电话',a.phone?'138 0000 1020（示例）':'138 **** 1020')}${kv('微信',s.status==='active'?'linju_demo':'lin***')}${a.address?kv('约定地址','湘邻社区 · 演示取送点'):kv('私密地址','访问已关闭')}${s.kind==='跑腿'&&a.address?kv('领取码','DEMO-1020'):''}</dl>${link('对方的评价','S')}</section>`;}
 function pendingLinks(){return Object.keys(s.pending).length?`<section class="panel"><h3>等待回复</h3>${Object.keys(s.pending).map(t=>`<button class="text-link" data-request="${t}">${requestNames[t]} · ${s.pending[t].author===role()?'等待对方':'待本人回复'}</button>`).join('')}</section>`:'';}
 function actionGrid(){return `<div class="action-grid">${button('费用详情','H')}${button('变更约定','K')}${button('延长到期','L')}${button('申请取消','M')}${button('交付异议','N')}${button('异议解除','O')}</div>`;}
 function renderList(target='list-content'){const choices=['本人申请','已承接','历史'],filtered=(listKind==='全部'||listKind===s.kind)&&(listStatus==='全部'||listStatus===status()),isHistory=M.end(s);$(target).innerHTML=`<div class="tabs" role="tablist" aria-label="我的服务列表">${choices.map(t=>`<button role="tab" data-list-tab="${t}" aria-selected="${listTab===t}">${t}</button>`).join('')}</div><div class="filter-row"><select aria-label="业务筛选" data-list-filter="kind">${['全部','维修','跑腿','闲置','其它'].map(t=>`<option ${t===listKind?'selected':''}>${t}</option>`).join('')}</select><select aria-label="状态筛选" data-list-filter="status">${['全部','进行中','有交付异议','已到期结束','双方已取消','待买家确认'].map(t=>`<option ${t===listStatus?'selected':''}>${t}</option>`).join('')}</select></div>${listTab==='本人申请'?`<article class="record"><div class="record-head"><h3>${esc(names[s.kind])}</h3><span class="chip">申请中</span></div><p>本人申请 · 等待发布者选人</p><p>尚未正式承接，联系方式仍打码。</p><a class="secondary" href="v03.html">查看本人申请</a></article>`:filtered&&((listTab==='历史')===isHistory)?`<article class="record"><div class="record-head"><span class="tag">${s.kind}</span><span class="chip">${status()}</span></div><h3 style="margin-top:10px">${esc(names[s.kind])}</h3><p>${role()==='provider'?'接单员 / 卖家':'发布者 / 买家'} · ${fmt(s.due)} 到期</p><p>${s.dispute?'交付异议处理中':s.outage?'故障期间暂停收尾':s.protection?'有独立保护期':'当前约定与必要历史'}</p>${button('查看交易',s.kind==='跑腿'?'C':s.kind==='闲置'?'G':'B','primary')}</article>`:`<div class="empty"><h3>暂无${listTab==='历史'?'历史记录':'匹配交易'}</h3><p>可调整筛选或切换上方演示状态。</p></div>`}`;}
 function details(which){let html=heading()+endedHint();if(s.dispute)html+=note('交付异议处理中，暂缓自动结束。',true);html+=`<section class="panel"><h3>当前约定</h3><p>${esc(s.content)}</p><p class="hint">服务区域：${esc(s.area)}</p>${which==='C'?`<div class="price">${M.money(s.runFee)}</div><p class="hint">商品支出另计，不计入服务费。</p><dl class="kv">${kv('垫付意愿',s.advance?'愿意垫付':'不垫付')}${s.advance?kv('垫付上限',M.money(s.limit)):''}</dl>`:which==='G'?`<div class="price">${M.money(s.price)}</div><p class="hint">原始价格 ${M.money(s.originalPrice)} · 当前有效价格</p>`:''}</section>`+timeline()+contacts();if(!['C','G'].includes(which)){const t=M.totals(s);html+=`<section class="panel"><h3>费用约定</h3><dl class="kv">${kv('有效服务费',M.money(t.service))}${kv('实际支出',M.money(t.expense))}${kv('合计',M.money(t.total))}</dl>${link('查看阶段费用','H')}</section>`;}html+=pendingLinks();html+=M.end(s)?`<div class="action-grid">${button('费用后处理','Q')}${button('状态与历史','P')}</div>`:actionGrid();html+=`<div style="margin-top:15px">${link('约定与请求历史','S')}<button class="text-link" data-handoff="举报与申诉">举报与申诉</button>${link('到期与保护状态','P')}</div>`;return html;}
 function readFee(){return {stage:$('stage-name').value.trim(),items:[...document.querySelectorAll('.fee-item')].map(el=>({name:el.querySelector('[data-item="name"]').value.trim(),type:el.querySelector('[data-item="type"]').value,amount:M.cents(el.querySelector('[data-item="amount"]').value),note:el.querySelector('[data-item="note"]').value.trim()})),advance:$('advance-yes').checked,limit:$('advance-yes').checked?M.cents($('advance-limit').value):null};}
 function feeForm(){if(!['维修','其它'].includes(s.kind))return note('跑腿服务费或闲置成交价请使用“变更约定”。')+button('变更约定','K');const rows=feeRows.map((i,n)=>`<section class="fee-item"><div class="phase">项目 ${n+1}</div><div class="item-row"><input aria-label="项目${n+1}名称" data-item="name" value="${esc(i.name)}" placeholder="项目名称"><input aria-label="项目${n+1}金额" inputmode="decimal" data-item="amount" value="${esc(i.amount)}" placeholder="金额"></div><select aria-label="项目${n+1}类别" data-item="type"><option value="service" ${i.type==='service'?'selected':''}>服务费</option><option value="expense" ${i.type==='expense'?'selected':''}>实际支出</option></select><input aria-label="项目${n+1}备注" data-item="note" value="${esc(i.note)}" placeholder="备注 · 选填" style="margin-top:8px"><div class="expense-evidence" ${i.type==='expense'?'':'hidden'}>${files(3,'evidence-'+n)}</div><button class="quiet" data-delete-item="${n}" ${feeRows.length===1?'disabled':''}>删除本项</button></section>`).join('');footer('<button class="secondary" data-page="H">返回费用</button><button class="primary" data-action="submit-fee">发起费用约定</button>');return heading()+note(M.end(s)?'仅补本次已发生费用，不重开交易。':'先确认本阶段费用，再开始相应收费服务。')+`<section class="panel">${field('阶段名称','stage-name','服务处理','text','1—30字；同名阶段仍分别记录')}<div class="field" id="fee-rows">${rows}</div><button class="secondary" data-action="add-item" ${feeRows.length>=20?'disabled':''}>＋ 添加项目</button><div class="divider"></div><div class="field"><label>垫付意愿</label><div class="radios"><label><input type="radio" name="advance" id="advance-no" checked>不愿意</label><label><input type="radio" name="advance" id="advance-yes">愿意</label></div></div><div id="advance-field" hidden>${field('垫付上限','advance-limit','','text','愿意时必填，可为0')}</div><dl class="kv" id="fee-subtotals" aria-live="polite"></dl><p class="hint">单项、方案与整次服务累计不超过99,999.99元；未知费用暂不加入。</p></section>`;}
 function requestDetail(type,to){const p=s.pending[type];if(!p)return note('当前没有待回复的'+requestNames[type]+'。')+button('发起'+requestNames[type],to);const own=p.author===role(),d=p.data;const summary=type==='fee'?d.items.map(i=>`<div class="version-row"><p>${esc(i.name)} · ${i.type==='service'?'服务费':'实际支出'}</p><strong>${M.money(i.amount)}</strong></div>`).join(''):type==='extension'?`<dl class="kv">${kv('原有效到期',fmt(s.due))}${kv('拟延期到',fmt(d.due))}</dl>`:type==='trade'?`<dl class="kv">${kv('物品',esc(names.闲置))}${kv('成交金额',M.money(d.price))}${kv('买家约定到期',fmt(d.due))}</dl>`:type==='change'?`<p>${esc(d.content)}</p><p class="hint">${esc(d.area)}</p>${d.amount!==null?`<p class="price">${M.money(d.amount)}</p>`:''}`:type==='release'?`<p>${esc(s.dispute?.text||'当前事项已处理')}</p><p class="hint">本次覆盖当前全部事项。</p>`:type==='phone'?'<p>仅本次费用处理电话，双方同意后开放24小时。</p>':`<p>${esc(d.reason)}</p>`;footer(own?`<button class="secondary" data-withdraw="${type}">撤回请求</button><button class="primary" data-remind="${type}">提醒对方</button>`:`<button class="secondary" data-reject="${type}">不同意</button><button class="primary" data-accept="${type}">同意当前约定</button>`);return heading()+note(own?'已提交，等待对方回复。':'请核对当前方案后回复。')+`<section class="panel"><h3>${requestNames[type]}</h3>${summary}</section>${!own?area('不同意理由'+(['cancel','trade'].includes(type)?' · 必填':' · 选填'),'reply-reason','填写原因，方便双方协商',type==='cancel'&&s.kind!=='闲置'?500:300):''}`+note(type==='fee'?'待确认方案不计入有效费用；旧有效约定保留。':type==='cancel'?'待回复不会自动取消，到期规则仍有效。':'无回应不代表同意。');}
 function updateFeeSubtotals(){const output=$('fee-subtotals');if(!output)return;const items=[...document.querySelectorAll('.fee-item')].map(el=>({type:el.querySelector('[data-item="type"]').value,amount:M.cents(el.querySelector('[data-item="amount"]').value)}));const unknown=items.some(i=>i.amount===null);const total=type=>unknown?'待填写':M.money(items.filter(i=>!type||i.type===type).reduce((sum,i)=>sum+i.amount,0));output.innerHTML=kv('本方案服务费',total('service'))+kv('本方案实际支出',total('expense'))+kv('本方案合计',total());}
 function screen(){feedback='';$('page-code').textContent='V07-'+page;$('page-title').textContent=pages[page][0];$('page-caption').textContent=pages[page][1];document.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.screen===page)));footer();let html='';
 if(page==='A'){html='<div id="right-list"></div>';}

 if(page==='D'){footer('<button class="primary" data-action="buyer-time">提交时间约定</button>');html=heading()+note('先提出时间，由卖家带入交易确认。联系方式仍打码。')+`<section class="panel">${field('约定到期时间','buyer-time',local(s.buyerDue),'datetime-local','确认时起最多30天')}</section>`;}
 if(page==='E'){if(s.pending.trade)html=requestDetail('trade','E');else{footer('<button class="primary" data-action="submit-trade">发给买家确认</button>');html=heading()+`<section class="panel"><h3>买家：演示邻居</h3><p class="hint">该帖联系已获准对象</p>${field('明确成交金额','trade-price',(s.price/100).toFixed(2))}<dl class="kv">${kv('买家当前约定',fmt(s.buyerDue))}${kv('佣金规则','1% · 封顶20元')}</dl><label class="check"><input id="trade-consent" type="checkbox">我已知悉当前比例、封顶及月结规则。</label></section>`+note('只有买家明确确认后，交易才生效。');}}
 if(page==='F')html=requestDetail('trade','E');
 if(page==='H'){const t=M.totals(s);html=heading()+`<section class="panel"><h3>当前有效费用</h3><div class="price">${M.money(t.total)}</div><dl class="kv">${kv('服务费',M.money(t.service))}${kv('实际支出',M.money(t.expense))}${kv('预估平台佣金',M.money(M.commission(s)))}</dl><p class="hint">${({维修:'15% · 整次封顶30元',其它:'10% · 整次封顶20元',跑腿:'15% · 按有效服务费计算',闲置:'1% · 每笔封顶20元'})[s.kind]}。客户款项双方线下直接结算。</p></section>`+s.stages.map(st=>`<section class="panel"><div class="phase">${st.id} · 当前有效版本 ${st.version}</div><h3>${esc(st.name)}</h3>${st.items.map(i=>`<dl class="kv">${kv(esc(i.name),M.money(i.amount))}</dl>`).join('')}</section>`).join('')+(s.pending.fee?`<section class="panel"><span class="chip warning">待回复 · 不计入有效累计</span>${link('查看费用方案','J')}</section>`:'')+button('新增阶段约定','I','primary')+link('版本历史','S');}

 if(page==='L'){if(s.pending.extension)html=requestDetail('extension','L');else{footer('<button class="primary" data-action="submit-extension">发起延期</button>');html=heading()+timeline()+`<section class="panel">${field('拟延期到','extension-date',local(s.due+24*M.HOUR),'datetime-local','晚于当前到期，每次最多后移7天')}</section>`+note('对方同意后才变更到期；未确认不暂停原到期。');}}
 if(page==='M'){if(s.pending.cancel)html=requestDetail('cancel','M');else{footer('<button class="primary" data-action="submit-cancel">提交取消申请</button>');html=heading()+`<section class="panel">${area('取消说明 · 必填','cancel-reason','说明取消原因')}${files()}</section>`+note('对方同意后取消；已发生费用另行核对，取消不等于结清。');}}
 if(page==='N'){footer('<button class="primary" data-action="submit-dispute">'+(s.dispute?'补充异议':'提交交付异议')+'</button>');html=heading()+(s.dispute?note('当前事项：'+esc(s.dispute.text),true):'')+`<section class="panel">${area('异议说明 · 必填','dispute-reason','说明未完成、未成交或取消争议')}${files()}</section>`+note('有效提交后暂停正常自动结束与受影响计佣；不代表所述事实已核实。');}
 if(page==='O'){if(s.pending.release)html=requestDetail('release','O');else{footer(s.dispute?'<button class="primary" data-action="submit-release">提出全部解除</button>':'');html=heading()+note(s.dispute?'当前未解决：'+esc(s.dispute.text):'当前没有未解决的交付异议。')+(s.dispute?'<section class="panel"><label class="check"><input type="checkbox" id="release-consent">我已与对方核对本次全部未解决事项。</label></section>':'')+note('须另一方确认当前全部事项；新增补充后需重新核对。');}}
 if(page==='P'){html=heading()+timeline()+note(s.status==='ended'?'已按到期规则结束，不代表付款或核实交付。':s.status==='cancelled'?'双方已取消，故障保护不会恢复本次交易。':s.outage?'受影响平台故障处理中，恢复验收前不自动收尾。':s.protection?'恢复验收已通过，保护期结束后再按条件收尾。':'按当前有效到期，且无有效异议时自动结束。',s.outage||!!s.dispute)+`<section class="panel"><dl class="kv">${kv('演示当前时间',fmt(s.now))}${s.recovered?kv('恢复验收成功',fmt(s.recovered)):''}${kv('联系方式',M.access(s,s.now).phone?'当前允许电话联系':'已打码')}${kv('私密地址',M.access(s,s.now).address?'当前双方可见':'访问已关闭')}${kv('费用状态',M.totals(s).service===null?'待处理':'已有有效约定')}</dl></section><div class="action-grid">${button('费用后处理','Q')}${button('必要历史','S')}</div>`;footer('<button class="secondary" data-action="simulate-deadline" '+(M.end(s)?'disabled':'')+'>演示到期扫描</button>');}
 if(page==='Q'){html=heading()+note(M.end(s)?'流程已结束，费用处理不会重开交易。':'此页用于结束后的费用处理，可在上方切换“已结束 · 费用待处理”。')+`<section class="panel"><h3>核对本次已发生费用</h3><dl class="kv">${kv('有效服务费',M.money(M.totals(s).service))}${kv('首次补费申报截止',s.feeWindow?fmt(s.feeWindow):M.totals(s).service===null?'首次正式费用生效后起算72小时':'已有正式费用，按更正规则处理')}</dl><p class="hint">窗口内改价不刷新原72小时截止；特定改价24小时未确认关闭。旧有效费用保留。</p></section><div class="action-grid">${button('补充已发生费用','I')}${button('恢复费用处理电话','R')}</div>${link('费用方案回复','J')}<button class="text-link" data-handoff="计佣更正申请">计佣更正申请</button>`;}
 if(page==='R'){const a=M.access(s,s.now);if(s.pending.phone)html=requestDetail('phone','R');else{footer('<button class="primary" data-action="submit-phone">申请本次电话恢复</button>');html=heading()+note('仅用于原双方的必要费用核对，双方同意后开放24小时。')+`<section class="panel"><dl class="kv">${kv('电话',a.phone&&M.end(s)?'138 0000 1020（示例）':'138 **** 1020')}${kv('本次到期',s.phoneUntil?fmt(s.phoneUntil):'双方同意后起算')}</dl><label class="check"><input id="phone-consent" type="checkbox">我明确同意本次费用处理电话恢复。</label></section>`+note('不恢复微信、私密地址或旧凭据，不自动续期。');}}
 if(page==='S'){html=heading()+`<div class="tabs" role="tablist" aria-label="历史类别">${['全部','时间','内容','费用','取消','异议'].map(t=>`<button role="tab" data-history-filter="${t}" aria-selected="${t==='全部'}">${t}</button>`).join('')}</div><div id="history-entries">${history()}</div>`;}
 $('detail-content').innerHTML=html;if(page==='I')updateFeeSubtotals();if(page==='A')renderList('right-list');$('detail-scroll').scrollTop=0;}
 function history(filter='全部'){const entries=s.history.filter(h=>filter==='全部'||({时间:/extension|到期/,内容:/change/,费用:/fee|费用|phone/,取消:/cancel|取消/,异议:/release|异议/}[filter]||/.*/).test(h.text));return entries.length?entries.map(h=>`<article class="history-item"><h4>${esc(h.text.replace(/extension|cancel|release|change|trade|phone|fee/g,t=>requestNames[t]))}</h4><p>${fmt(h.at)} · 必要历史</p></article>`).join(''):'<div class="empty"><h3>还没有相关记录</h3><p>发起或回复约定后，在这里查看。</p></div>';}
 function goto(next){page=next;screen();}
 function reset(){const v=$('scenario').value;if(v==='unconfirmed')$('kind').value='闲置';s=M.create($('kind').value);if(v==='disputed')M.addDispute(s,'上门时间有分歧，仍在协商');if(v==='outage')s.outage=true;if(v==='protected'){s.recovered=s.now;s.protection=s.now+24*M.HOUR;}if(['ended','unknown'].includes(v)){s.status='ended';s.now=s.due+1;if(v==='unknown')s.stages=[];M.log(s,'按有效到期结束，费用状态独立保留');}if(v==='cancelled'){s.status='cancelled';M.log(s,'双方同意取消');}if(v==='unconfirmed'){s.kind='闲置';$('kind').value='闲置';s.status='unconfirmed';}feeRows=[{name:'',type:'service',amount:'',note:''}];listTab=M.end(s)?'历史':'已承接';renderList();screen();}
 function requireRole(expected){if(role()!==expected)throw Error('请在上方切换为'+(expected==='provider'?'卖家':'买家')+'操作');}
 function filesValid(){for(const input of document.querySelectorAll('#detail-content input[type=file]')){const e=M.fileErrors([...input.files],Number(input.dataset.max));if(e)throw Error(e);}}
 function stashFeeRows(){feeRows=[...document.querySelectorAll('.fee-item')].map(el=>({name:el.querySelector('[data-item="name"]').value,type:el.querySelector('[data-item="type"]').value,amount:el.querySelector('[data-item="amount"]').value,note:el.querySelector('[data-item="note"]').value}));}
 document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;try{if(b.dataset.page){if(b.dataset.page==='A'&&new URLSearchParams(location.search).get('from')==='services'){const target=new URL(new URLSearchParams(location.search).get('back')||'services.html',location.href);location.href=target.origin===location.origin&&target.pathname.endsWith('/services.html')?target.href:'services.html';return;}goto(b.dataset.page);return;}if(b.dataset.screen){goto(b.dataset.screen);return;}if(b.dataset.handoff){toast(b.dataset.handoff+'入口演示；此页不创建真实申请。');return;}if(b.dataset.listTab){listTab=b.dataset.listTab;renderList();if(page==='A')renderList('right-list');return;}if(b.dataset.historyFilter){document.querySelectorAll('[data-history-filter]').forEach(el=>el.setAttribute('aria-selected',String(el===b)));$('history-entries').innerHTML=history(b.dataset.historyFilter);return;}if(b.dataset.request){goto(({fee:'J',extension:'L',cancel:'M',release:'O',change:'K',trade:'F',phone:'R'})[b.dataset.request]);return;}if(b.dataset.accept){M.respond(s,b.dataset.accept,'accept',role());renderList();screen();toast('当前约定已生效（演示）');return;}if(b.dataset.reject){const reason=$('reply-reason')?.value.trim()||'';M.respond(s,b.dataset.reject,'reject',role(),reason);screen();toast('已回复不同意，原约定保留');return;}if(b.dataset.withdraw){M.withdraw(s,b.dataset.withdraw,role());screen();toast('请求已撤回，历史保留');return;}if(b.dataset.remind){const p=s.pending[b.dataset.remind];if(p.remindedAt!==undefined&&s.now-p.remindedAt<24*M.HOUR)throw Error('24小时内已提醒过');p.remindedAt=s.now;M.log(s,'提醒'+b.dataset.remind+'请求（仅演示）');toast('已演示提醒，不发送真实消息');return;}if(b.dataset.deleteItem!==undefined){stashFeeRows();feeRows.splice(Number(b.dataset.deleteItem),1);const stage=$('stage-name').value;screen();$('stage-name').value=stage;return;}const action=b.dataset.action;if(!action)return;filesValid();
 if(action==='add-item'){stashFeeRows();const stage=$('stage-name').value;feeRows.push({name:'',type:'service',amount:'',note:''});screen();$('stage-name').value=stage;return;}
 if(action==='submit-fee'){M.propose(s,'fee',readFee(),role());goto('J');toast('费用方案已提交，等待对方');}
 if(action==='submit-extension'){M.propose(s,'extension',{due:parseDate($('extension-date').value)},role());screen();toast('等待对方同意延期');}
 if(action==='submit-cancel'){M.propose(s,'cancel',{reason:$('cancel-reason').value.trim()},role());screen();}
 if(action==='submit-dispute'){M.addDispute(s,$('dispute-reason').value.trim());renderList();screen();toast('异议已提交（演示）');}
 if(action==='submit-release'){if(!$('release-consent').checked)throw Error('请先核对全部未解决事项');M.propose(s,'release',{version:s.dispute.version},role());screen();}
 if(action==='buyer-time'){requireRole('requester');if(s.kind!=='闲置'||s.status!=='unconfirmed')throw Error('请切换闲置待确认状态');const due=parseDate($('buyer-time').value);if(!Number.isFinite(due)||due<=s.now||due>s.now+720*M.HOUR)throw Error('选择未来时间，且不超过确认起30天');if(s.pending.trade)throw Error('请卖家先撤回旧交易确认');s.buyerDue=due;M.log(s,'买家提出当前交易到期时间');toast('时间已提交给卖家（演示）');}
 if(action==='submit-trade'){requireRole('provider');if(!$('trade-consent').checked)throw Error('请先知悉佣金与月结规则');M.propose(s,'trade',{price:M.cents($('trade-price').value),due:s.buyerDue},role());goto('F');}
 if(action==='submit-change'){const text=$('change-content').value.trim(),region=$('change-area').value.trim(),reason=$('change-reason').value.trim(),amount=$('change-amount')?M.cents($('change-amount').value):null;if(!text||!region)throw Error('请填写内容与区域');if(M.count(reason)<1||M.count(reason)>500)throw Error('变更原因填写1—500字');if($('change-amount')&&(amount===null||amount<=0))throw Error('填写明确的正数金额');M.propose(s,'change',{content:text,area:region,reason,amount},role());screen();}
 if(action==='submit-phone'){M.propose(s,'phone',{consent:$('phone-consent').checked},role());screen();}
 if(action==='simulate-deadline'){M.close(s,Math.max(s.due,s.protection||0)+1);listTab='历史';renderList();screen();toast('已演示到期后扫描');}
 }catch(e){error(e.message);}});
 document.addEventListener('change',event=>{const el=event.target;if(['kind','scenario'].includes(el.id)){if(el.id==='kind'&&$('scenario').value==='unconfirmed')$('scenario').value='active';reset();return;}if(el.id==='role'){renderList();screen();return;}if(el.dataset.listFilter){if(el.dataset.listFilter==='kind')listKind=el.value;else listStatus=el.value;renderList();if(page==='A')renderList('right-list');return;}if(el.type==='file'){const e=M.fileErrors([...el.files],Number(el.dataset.max));el.parentElement.querySelector('.attachment-result').textContent=e||el.files.length+'张图片已在本机选择';if(e)el.value='';return;}if(el.name==='advance')$('advance-field').hidden=!$('advance-yes').checked;if(el.dataset.item==='type'){el.closest('.fee-item').querySelector('.expense-evidence').hidden=el.value!=='expense';updateFeeSubtotals();}});
 document.addEventListener('input',e=>{if(e.target.dataset.item)updateFeeSubtotals();});
 $('reset').addEventListener('click',reset);$('screen-nav').innerHTML=Object.entries(pages).map(([letter,entry])=>`<button data-screen="${letter}" aria-pressed="${page===letter}">${letter} ${entry[0]}</button>`).join('');const query=new URLSearchParams(location.search);if(query.get('from')==='services'){if(['维修','跑腿','闲置','其它'].includes(query.get('kind')))$('kind').value=query.get('kind');if(['provider','requester'].includes(query.get('role')))$('role').value=query.get('role');if(['active','ended','cancelled','unknown'].includes(query.get('scenario')))$('scenario').value=query.get('scenario');if(Object.hasOwn(pages,query.get('page')))page=query.get('page');reset();}else{renderList();screen();}
})();
</script></body></html>
