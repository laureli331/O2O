 function updateBadge(){const n=logged?notices.filter(n=>!n.read).length:0;$('unread-badge').textContent=n;$('unread-badge').hidden=!n;$('notices').setAttribute('aria-label',n?'通知中心，'+n+'条未读':'通知中心，无未读');}
 function setView(next,title){if(view==='list'&&next!=='list')listOffset=$('scroll').scrollTop;view=next;$('service-phone').dataset.view=next;$('notice-tools').hidden=next!=='notices';$('more-sheet').hidden=true;$('notices').hidden=next==='notices';$('page-title').textContent=title;$('back').hidden=next==='list';$('head-spacer').hidden=next!=='list';$('orders-tabs').hidden=next!=='list';$('filters').hidden=next!=='list';$('actions').hidden=true;$('actions').innerHTML='';$('scroll').scrollTop=0;$('page-code').textContent=next==='list'?(settings.tab==='published'?'我发布的':'我承接的'):title;}
 function saveQuery(){const q=new URLSearchParams();q.set('tab',settings.tab);if(settings.kind!=='all')q.set('kind',settings.kind);if(settings.status!=='all')q.set('status',settings.status);history.replaceState(null,'','services.html?'+q);}
 function empty(title,text,action=''){return `<div class="empty"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="14" y="13" width="36" height="42" rx="5"/><path d="M24 13v-3h16v3M24 27h16M24 36h16M24 45h10"/></svg><h3>${title}</h3><p>${text}</p>${action}</div>`;}
 function recordRole(row){return row.kind==='闲置'?(row.owner==='me'?'卖家':'买家'):row.owner==='me'?'发布者':'接单员';}
 function list(){setView('list','服务');updateBadge();document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===settings.tab)));$('kind-filter').value=settings.kind;$('status-filter').value=settings.status;for(const key of ['published','accepted'])$(key+'-count').textContent=logged?M.filter(rows,{tab:key}).length:'';const state=$('demo-state').value;if(!logged){$('content').innerHTML=empty('登录后查看订单','你发布的需求和参与的交易，会集中保存在这里。',cta('登录','login','primary'));return;}if(state==='loading'){$('content').innerHTML='<div class="skeleton" aria-label="正在加载订单"></div><div class="skeleton" aria-hidden="true"></div>';return;}const visible=state==='empty'?[]:M.filter(rows,settings),warning=state==='failed'?'<div class="note warning" role="status">加载失败，已保留当前订单。'+cta('重试','retry','quiet')+'</div>':'';if(!visible.length){$('content').innerHTML=warning+empty(settings.tab==='published'?'还没有发布记录':'还没有参与的订单',settings.kind!=='all'||settings.status!=='all'?'试试其它类型或状态。':settings.tab==='published'?'有需要帮忙的事，发布后在这里跟进。':'可以从首页找到合适的需求。',settings.kind!=='all'||settings.status!=='all'?cta('查看全部','clear-filter','secondary'):`<a class="primary" href="${settings.tab==='published'?'v04.html':'v01-v02.html'}">${settings.tab==='published'?'去发布':'去首页看看'}</a>`);return;}$('content').innerHTML=warning+visible.map(orderCard).join('');$('scroll').scrollTop=listOffset;}

 function cover(row){return '<img class="cover" src="assets/service-'+row.cover+'.svg" alt="'+esc(row.title)+'的演示首图" width="84" height="84">';}
 function essential(row){if(row.state==='open')return row.applications?'已有 '+row.applications+' 人申请':'等待邻居申请';if(row.state==='applied')return '等待发布者选人';if(row.state==='active')return row.due.slice(5).replace('-','月').replace(' ','日 ')+' 到期';if(['ended','sold'].includes(row.state))return row.due.slice(5).replace('-','月').replace(' ','日 ')+' 自动结束';return M.labels[row.state];}
 function orderCard(row){const label=row.state==='open'?(row.applications?'查看申请 '+row.applications:'查看需求'):row.state==='applied'?'查看本人申请':['ended','sold','closed','cancelled','withdrawn'].includes(row.state)?'查看详情':'查看订单';return '<article class="order" data-record="'+row.id+'"><button class="order-open" data-action="detail" data-id="'+row.id+'" aria-label="查看'+esc(row.title)+'详情"><div class="order-top"><span class="tag">'+row.kind+'</span><span class="status '+M.group(row.state)+'">'+M.labels[row.state]+'</span></div><div class="order-body">'+cover(row)+'<div class="order-copy"><h3>'+esc(row.title)+'</h3><strong class="amount '+(row.amount===null?'unknown':'')+'">'+money(row)+'</strong><p class="essential">'+esc(essential(row))+'</p>'+(row.kind==='闲置'&&row.owner!=='me'?'<p>本人：买家</p>':'')+'</div></div></button><div class="order-actions">'+cta(label,'detail',M.group(row.state)==='history'?'secondary':'primary',row.id)+'</div></article>';}
 function showMore(){sheetTrigger=document.activeElement;$('more-content').innerHTML=cta('发布与服务历史','history')+(current.owner==='me'&&current.state==='open'?cta(current.kind==='闲置'?'撤回发布':'关闭需求','close','secondary danger'):'')+cta('取消','dismiss-more','quiet');$('more-sheet').hidden=false;$('more-content').querySelector('button').focus();}
 function closeMore(){$('more-sheet').hidden=true;sheetTrigger?.focus();}
 function backUrl(){const q=new URLSearchParams({tab:settings.tab,kind:settings.kind,status:settings.status,offset:String(listOffset)});return 'services.html?'+q;}
 function transactionUrl(row){const q=new URLSearchParams({from:'services',focus:'order',record:row.id,title:row.title,amount:String(row.amount??''),memo:row.memo,kind:row.kind,role:row.kind==='闲置'?(row.owner==='me'?'provider':'requester'):row.owner==='me'?'requester':'provider',scenario:['ended','sold'].includes(row.state)?'ended':row.state==='cancelled'?'cancelled':'active',page:row.kind==='跑腿'?'C':row.kind==='闲置'?'G':'B',back:backUrl()});return 'v07.html?'+q;}
 function detail(id){const row=rows.find(r=>r.id===id);if(!row||!M.filter(rows,{tab:row.owner==='me'?'published':'accepted'}).includes(row)||!logged){toast('请登录后查看本人订单');return;}current=row;if(['active','sold','ended','cancelled'].includes(row.state)){if(view==='list')listOffset=$('scroll').scrollTop;location.href=transactionUrl(row);return;}setView('detail','需求详情');$('content').innerHTML='<section class="panel"><p class="detail-status">'+M.labels[row.state]+'</p><p class="muted">'+esc(essential(row))+'</p><div class="detail-hero">'+cover(row)+'<div><h3>'+esc(row.title)+'</h3><span class="tag">'+row.kind+'</span><p class="amount '+(row.amount===null?'unknown':'')+'">'+money(row)+'</p></div></div><h3>需求内容</h3><p>'+esc(row.memo)+'</p><dl class="kv">'+kv('期望开始',row.start)+kv('服务到期',row.due)+kv('发布时间',row.published)+(row.reopened?kv('重开时间',row.reopened):'')+'</dl></section>'+(row.state==='open'?'<section class="panel"><h3>申请进展</h3><p>'+(row.applications?row.applications+'位邻居已申请，可核对后选择。':'还没有新的申请，等待邻居响应。')+'</p></section>':'')+cta('发布与服务历史','history','text-row');let main='';if(row.owner==='me'&&row.state==='open')main=cta('编辑需求','edit')+(row.applications?'<a class="primary" href="v03.html">查看申请 '+row.applications+'</a>':'');else if(row.state==='applied')main='<a class="primary" href="v03.html">查看本人申请</a>';else if(row.owner==='me'&&['closed','withdrawn'].includes(row.state))main=cta('重新开放需求','reopen','primary');$('actions').innerHTML=cta('更多','more','quiet')+main;$('actions').hidden=false;}
 function management(action){if(!current||current.owner!=='me')return;manageAction=action;setView('manage',action==='close'?(current.kind==='闲置'?'撤回发布':'关闭需求'):'重新开放');const close=action==='close';$('content').innerHTML=`<section class="panel"><h3>${esc(current.title)}</h3><p class="muted">${M.labels[current.state]}</p></section><div class="note">${close?'本次发布将停止接受新申请，已有申请结束并保留历史。':'旧申请、联系人与凭据不恢复；重新申请和选人后形成新的服务。'}</div>${close?'<div class="field"><label for="reason">说明 · 选填</label><textarea id="reason" maxlength="300" placeholder="如时间有变，稍后再发布"></textarea><small>仅本人及受影响申请者可见，最多300字。</small></div>':current.kind!=='闲置'?'<div class="field"><label for="new-start">期望服务时间</label><input id="new-start" type="datetime-local" value="2026-10-22T10:00"></div><div class="field"><label for="new-due">服务到期时间</label><input id="new-due" type="datetime-local" value="2026-10-22T18:00"></div>':''}`;$('actions').innerHTML=cta('返回','cancel-manage')+cta(close?'确认'+(current.kind==='闲置'?'撤回':'关闭'):'确认重新开放','confirm-manage','primary');$('actions').hidden=false;}
 function editing(){setView('edit','编辑需求');$('content').innerHTML=`<section class="panel"><div class="field"><label for="edit-title">标题</label><input id="edit-title" value="${esc(current.title)}" maxlength="30"></div><div class="field"><label for="edit-memo">需求说明</label><textarea id="edit-memo" maxlength="500">${esc(current.memo)}</textarea></div><p class="muted">普通公开文字编辑不置顶，不修改原发布时间。</p></section>`;$('actions').innerHTML=cta('返回','cancel-manage')+cta('保存修改','save-edit','primary');$('actions').hidden=false;}
 function showHistory(){setView('history','发布与服务历史');$('content').innerHTML=`<section class="panel"><h3>${esc(current.title)}</h3><dl class="kv">${kv('原发布时间',current.published)}${kv('当前状态',M.labels[current.state])}${kv('轮次','第'+current.round+'次')}</dl></section>`+current.history.map(h=>`<article class="timeline-item"><small>${h.at}</small>${h.action==='close'?'关闭 / 撤回发布':h.action==='reopen'?'主动重新开放':'编辑公开内容'}<p class="muted">${M.labels[h.previous]||''} → ${M.labels[h.next]||''}</p>${h.reason?'<p>'+esc(h.reason)+'</p>':''}</article>`).join('')+'<article class="timeline-item"><small>'+current.published+'</small>首次发布</article>';$('actions').innerHTML=cta('返回需求','cancel-manage');$('actions').hidden=false;}
 function notificationList(){setView('notices','通知中心');const unread=notices.filter(n=>!n.read).length;$('notice-tools').hidden=!logged;$('notice-tools').innerHTML='<button data-action="notice-all" aria-selected="'+(noticeFilter==='all')+'">全部</button><button data-action="notice-unread" aria-selected="'+(noticeFilter==='unread')+'">未读 '+unread+'</button><button data-action="mark-read" '+(!unread?'disabled':'')+'>全部已读</button>';if(!logged){$('content').innerHTML=empty('登录后查看通知','只展示与你有关的订单进展。',cta('登录','login','primary'));return;}const visible=notices.filter(n=>noticeFilter!=='unread'||!n.read);$('content').innerHTML=visible.length?'<section class="panel">'+visible.map(n=>'<button class="notification" data-notice="'+n.id+'"><strong>'+(n.read?'':'<span class="dot"></span>')+esc(n.title)+'</strong><p>'+esc(n.text)+'</p></button>').join('')+'</section>':empty('消息都已读了','后续订单进展会在这里提醒你。');updateBadge();}

 function showDraft(){setView('draft','复制为新草稿');const draft=M.draft(current);$('content').innerHTML=`<section class="panel"><h3>${esc(draft.title)}</h3><p>${esc(draft.memo)}</p></section><div class="note">这里只复制公开文字和金额。新帖须重新填写当前时间、私密地址、垫付和费用条件，不恢复旧联系人或凭据。</div><a class="primary" href="v04.html">去发布页填写新帖</a>`;}
 function formError(message){let el=$('form-error');if(!el){el=document.createElement('div');el.id='form-error';el.className='error';el.setAttribute('role','alert');$('content').append(el);}el.textContent=message;el.scrollIntoView({block:'nearest'});}
 document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;try{if(b.dataset.tab){settings.tab=b.dataset.tab;listOffset=0;saveQuery();list();return;}if(b.dataset.notice){const n=notices.find(n=>n.id===b.dataset.notice);n.read=true;settings.tab='published';detail(n.record);updateBadge();return;}const a=b.dataset.action;if(a==='more'){showMore();return;}if(a==='dismiss-more'){closeMore();return;}if(a==='notice-all'||a==='notice-unread'){noticeFilter=a==='notice-all'?'all':'unread';notificationList();return;}if(a==='detail')detail(b.dataset.id);if(a==='back')list();if(a==='clear-filter'){settings.kind='all';settings.status='all';listOffset=0;saveQuery();list();}if(a==='login'){logged=true;$('demo-state').value='normal';list();toast('已切换为已登录演示');}if(a==='retry'){$('demo-state').value='normal';list();}if(a==='close')management('close');if(a==='reopen')management('reopen');if(a==='cancel-manage')detail(current.id);if(a==='confirm-manage'){if(manageAction==='reopen'&&current.kind!=='闲置'){const start=Date.parse($('new-start').value+':00+08:00'),due=Date.parse($('new-due').value+':00+08:00');if(!Number.isFinite(start)||!Number.isFinite(due)||start<=Date.UTC(2026,9,21,2)||due<=start)throw Error('请选择未来开始时间，且到期晚于开始');}if(manageAction==='reopen'&&current.kind!=='闲置'){current.start=$('new-start').value.replace('T',' ');current.due=$('new-due').value.replace('T',' ');}M.manage(current,manageAction,'me',$('reason')?.value.trim()||'');detail(current.id);toast(manageAction==='close'?'发布已关闭（演示）':'已重新开放，旧申请不会恢复');}if(a==='edit')editing();if(a==='save-edit'){const title=$('edit-title').value.trim(),memo=$('edit-memo').value.trim();if(!title||!memo)throw Error('请填写标题和需求说明');current.title=title;current.memo=memo;current.history.unshift({at:'2026-10-21 10:00',action:'edit',previous:current.state,next:current.state});detail(current.id);toast('公开内容已更新（演示）');}if(a==='history'){$('more-sheet').hidden=true;showHistory();}if(a==='copy')showDraft();if(a==='mark-read'){notices.forEach(n=>n.read=true);notificationList();toast('已全部标为已读');}}catch(e){formError(e.message);}});
 document.addEventListener('keydown',e=>{if($('more-sheet').hidden)return;if(e.key==='Escape'){closeMore();return;}if(e.key==='Tab'){const buttons=[...$('more-content').querySelectorAll('button')],first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});$('more-sheet').addEventListener('click',e=>{if(e.target===$('more-sheet'))closeMore();});
 $('back').addEventListener('click',()=>{if(view==='draft'){list();return;}if(['manage','edit','history'].includes(view)&&current)detail(current.id);else list();});$('notices').addEventListener('click',notificationList);$('kind-filter').addEventListener('change',e=>{settings.kind=e.target.value;listOffset=0;saveQuery();list();});$('status-filter').addEventListener('change',e=>{settings.status=e.target.value;listOffset=0;saveQuery();list();});$('demo-state').addEventListener('change',e=>{logged=e.target.value!=='guest';if(e.target.value==='many')notices=Array.from({length:30},(_,i)=>({...initialNotices[i%2],id:'N'+(i+1),read:false}));else notices=initialNotices.map(n=>({...n}));listOffset=0;list();});$('reset').addEventListener('click',()=>{rows=M.records();notices=initialNotices.map(n=>({...n}));noticeFilter='all';logged=true;$('demo-state').value='normal';settings.kind='all';settings.status='all';settings.tab='published';listOffset=0;saveQuery();list();});list();if(params.has('offset'))$('scroll').scrollTop=Math.max(0,Number(params.get('offset'))||0);if(params.get('view')==='notices')notificationList();if(params.has('copy')){const row=rows.find(r=>r.id===params.get('copy'));if(row&&row.owner==='me'&&['sold','ended'].includes(row.state)){current=row;showDraft();}}if(params.has('reopen')){const row=rows.find(r=>r.id===params.get('reopen'));if(row&&row.owner==='me'&&['closed','cancelled','withdrawn'].includes(row.state)){current=row;management('reopen');}}
})();
</script></body></html>
