<script>
(()=>{'use strict';
 const M=V08Model,$=id=>document.getElementById(id),params=new URLSearchParams(location.search),esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let session=M.create(),view='list',currentId=null,offset=0,pending=null,sequence=0,trigger=null,toastTimer,listContext=null,dialogBackground=[];

 const avatar=()=>'<span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2Z"/></svg></span>';
 const cover=r=>'<img class="cover" src="assets/service-'+r.cover+'.svg" width="80" height="80" alt="'+esc(r.title)+'的演示首图">';

 function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,3000);}
 function setView(next){closeDialog(false);if(view==='list'&&next!=='list')offset=$('contact-scroll').scrollTop;view=next;$('tabs').hidden=next!=='list';$('filters').hidden=next!=='list';$('actions').hidden=true;$('actions').innerHTML='';$('contact-scroll').scrollTop=0;$('page-code').textContent=next==='list'?'V08-A':'V08-B';$('page-title').textContent=next==='list'?'联系申请':'申请详情';$('back').setAttribute('aria-label',next==='list'?'返回'+(params.get('from')==='home'?'首页':'我的'):'返回联系申请');}
 function empty(title,description,button=''){return '<div class="empty"><img src="assets/empty-notes.svg" alt=""><h3>'+title+'</h3><p>'+description+'</p>'+button+'</div>';}
 function label(r){if(operationKey(r.id))return '结果待核对';if(r.trade==='disputed')return '交易有异议';if(r.trade==='active')return '交易进行中';return M.labels[r.state];}
 function summary(r){if(operationKey(r.id))return '请先查询本次操作结果';if(r.kind==='legacy')return '已失效的历史示例，仅供查看';if(r.state==='pending')return r.owner===session.user?'等待你处理':'等待卖家处理';if(r.state==='approved')return r.trade==='none'?'已获准，可继续约定交易':'到订单中查看当前约定';if(r.retryAt>session.now)return time(r.retryAt)+'可重新申请';if(['rejected','withdrawn','revoked'].includes(r.state)&&r.postState==='selling')return '可以重新申请，由你决定是否继续';if(r.state==='none')return '先向卖家申请，再约定交易';return '保留记录，当前不能继续申请';}
 function card(r){const name=session.people[person(r)].name;return '<article class="request-card" data-record="'+r.id+'"><button class="card-open" data-detail="'+r.id+'" aria-label="查看'+esc(r.title)+'联系申请"><div class="person-line">'+avatar()+'<span class="person-text"><strong>'+esc(name)+'</strong><small>'+(r.owner===session.user?'向你申请联系':'你申请联系的卖家')+'</small></span><span class="status '+r.state+'">'+label(r)+'</span></div><div class="item">'+cover(r)+'<div class="item-copy"><span class="tag">'+(r.kind==='legacy'?'历史记录':'闲置')+'</span><h3>'+esc(r.title)+'</h3>'+(r.kind==='legacy'?'':'<p class="amount '+(r.amount===null?'unknown':'')+'">'+money(r)+'</p>')+'</div></div><div class="card-bottom"><span>'+esc(summary(r))+'</span><span class="card-link">查看 ›</span></div></button></article>';}
 function saveFilters(){const q=new URLSearchParams({tab:settings.tab});if(settings.status!=='all')q.set('status',settings.status);if(params.get('from')==='home')q.set('from','home');history.replaceState(null,'','v08.html?'+q);}
 function list(){setView('list');document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===settings.tab)));$('status-filter').value=settings.status;
  for(const tab of ['sent','received'])$(tab+'-count').textContent=session.user?M.filter(session,{tab}).length:'';
  if(!session.user){$('content').innerHTML=empty('登录后查看联系申请','只有与你有关的申请和记录会显示在这里。',cta('登录体验','login','primary'));return;}

  const records=scenario==='empty'?[]:M.filter(session,settings),warning=scenario==='failed'?'<div class="note warning" role="status">暂未获取最新进展，已保留当前记录。'+cta('重新加载','retry','quiet')+'</div>':'';
  $('content').innerHTML=warning+(records.length?records.map(card).join(''):empty(settings.tab==='received'?'还没有收到申请':settings.tab==='history'?'还没有相关记录':'还没有联系申请',settings.status==='all'?'在首页遇到感兴趣的闲置，可以向卖家申请。':'试试其它状态，已有记录会继续保留。',settings.status==='all'?'<a class="primary" href="v01-v02.html">去首页看看</a>':cta('查看全部','clear-filter')));$('contact-scroll').scrollTop=offset;
 }
 function nextHint(r){if(r.trade==='disputed')return '当前交易有异议，请在订单中核对。这里不能单方撤销订单联系。';if(r.trade==='active')return '交易已经生效，完整联系方式按权限在当前订单中查看。';if(r.kind==='legacy')return '这是已失效的合成历史记录，不提供新的联系申请。';if(r.state==='approved')return '可以继续约定交易。联系获准本身不会公开电话或微信。';if(r.state==='none')return '先向卖家申请。获准后，再进一步约定交易时间。';return summary(r);}
 function operationKey(id){return Object.keys(session.operations).find(key=>{const op=session.operations[key];return op.status==='unknown'&&op.cmd.id===id&&op.cmd.user===session.user;});}
 function detail(id){if(!session.user){list();return;}let r;try{r=M.view(session,id);}catch(e){toast(e.message);return;}currentId=id;setView('detail');const name=session.people[person(r)].name,owner=r.owner===session.user;
  $('content').innerHTML='<div class="summary-status">'+label(r)+'</div><p class="summary-hint">'+esc(nextHint(r))+'</p><section class="panel"><div class="item detail-item">'+cover(r)+'<div class="item-copy"><span class="tag">'+(r.kind==='legacy'?'历史记录':'闲置')+'</span><h3>'+esc(r.title)+'</h3>'+(r.kind==='legacy'?'':'<p class="amount '+(r.amount===null?'unknown':'')+'">'+money(r)+'</p>')+'</div></div><div class="person-line">'+avatar()+'<span class="person-text"><strong>'+esc(name)+'</strong><small>'+(owner?'申请人':'卖家')+'</small></span></div><dl class="kv">'+(r.state==='none'?'':kv('申请时间',time(r.created)))+kv('电话',r.phone)+kv('微信',r.wechat)+(r.retryAt>session.now?kv('可再次申请',time(r.retryAt)):'')+'</dl></section>'+(r.kind==='idle'?'<div class="note">联系申请不等于成交。双方正式确认交易后，才按权限开放联系方式。</div>':'')+'<section class="panel"><details id="record-history"><summary>申请与授权记录</summary><ol class="timeline">'+(r.history.length?r.history.slice().reverse().map(h=>'<li><time>'+time(h.at)+'</time>'+esc(h.text)+'</li>').join(''):'<li>还没有发起申请</li>')+'</ol></details></section><div class="error" id="action-error" role="alert" hidden></div>';
  const opKey=operationKey(id),op=opKey&&session.operations[opKey];if(op?.status==='unknown'&&op.cmd.id===id){$('content').insertAdjacentHTML('afterbegin','<div class="note warning" role="status">正在核对本次结果，已保留记录。请先查询进展。</div>');$('actions').innerHTML=cta('查询进展','query','primary');$('actions').hidden=false;return;}
  const allowed=M.actions(session,M.get(session,id)),buttons=[];

 const confirmations={request:['向卖家申请联系？','卖家同意后，你可以继续约定交易时间。电话和微信仍会打码。','确认申请'],approve:['同意这份申请？','仅同意当前物品的这位申请人，不会直接开放联系方式或确认成交。','同意申请'],reject:['拒绝这份申请？','对方在24小时后可以重新申请。其它人的申请不受影响。','确认拒绝'],withdraw:['撤回这份申请？','本次申请停止等待处理，24小时后可以重新申请。','确认撤回'],revoke:['撤销联系资格？','对方将不能凭本次获准记录发起新交易，24小时后可以重新申请。','确认撤销']};
 function confirm(action){const r=M.get(session,currentId);if(!M.actions(session,r).includes(action))throw Error('申请状态已更新，请核对后再操作');pending={id:r.id,user:session.user,action,revision:r.revision,key:'V08-'+(++sequence)};trigger=document.activeElement;const text=confirmations[action];$('confirm-title').textContent=text[0];$('confirm-copy').textContent=text[1];$('confirm-action').textContent=text[2];$('confirm-action').disabled=false;lockDialogBackground();$('confirm-dialog').hidden=false;$('cancel-action').focus();}
 function lockDialogBackground(){if(dialogBackground.length)return;for(let branch=$('confirm-dialog');branch&&branch!==document.body;branch=branch.parentElement){for(const sibling of branch.parentElement.children){if(sibling!==branch&&sibling instanceof HTMLElement&&!['SCRIPT','STYLE','LINK'].includes(sibling.tagName)){dialogBackground.push([sibling,sibling.inert]);sibling.inert=true;}}}}
 function closeDialog(restore=true){$('confirm-dialog').hidden=true;pending=null;for(const [element,old]of dialogBackground)element.inert=old;dialogBackground=[];if(restore&&trigger?.isConnected)trigger.focus({preventScroll:true});}

 function position(value){const n=Number(value);return Number.isFinite(n)&&n>=0&&n<=100000?n:0;}
 function rememberRequest(button){listContext={id:button.dataset.detail,index:[...$('content').querySelectorAll('[data-detail]')].indexOf(button),outer:scrollY};}
 function restoreRequest(){if(!listContext)return;const visible=[...$('content').querySelectorAll('[data-detail]')],target=visible.find(button=>button.dataset.detail===listContext.id)||visible[Math.min(listContext.index,Math.max(0,visible.length-1))]||document.querySelector('[data-tab="'+settings.tab+'"]');target?.focus({preventScroll:true});$('contact-scroll').scrollTop=offset;scrollTo(0,position(listContext.outer));}
 function tradeUrl(r,action){const owner=r.owner===session.user,back=new URLSearchParams({tab:settings.tab,status:settings.status,id:r.id,offset:String(offset),returnId:listContext?.id||r.id,listIndex:String(listContext?.index||0),listOuter:String(listContext?.outer||0),detailAction:action,detailTop:String($('contact-scroll').scrollTop),detailOuter:String(scrollY)});if(params.get('from')==='home')back.set('from','home');const q=new URLSearchParams({from:'contacts',focus:'order',kind:'闲置',role:owner?'provider':'requester',scenario:r.trade==='disputed'?'disputed':r.trade==='active'?'active':'unconfirmed',page:r.trade==='none'?(owner?'E':'D'):'G',title:r.title,cover:r.cover,amount:r.amount===null?'':String(r.amount),back:'v08.html?'+back});return 'v07.html?'+q;}

 function failure(message){let box=$('action-error');if(!box){toast(message);return;}box.textContent=message;box.hidden=false;box.tabIndex=-1;box.focus();}
 function switchScenario(){session=M.create();currentId=null;offset=0;listContext=null;closeDialog(false);const choice=$('scenario').value;if(choice==='guest')session.user=null;if(choice==='later')session.now+=24*M.HOUR;if(choice==='closed')for(const r of session.records){if(r.kind==='idle'&&r.trade==='none'){r.postState='unavailable';if(r.state!=='none'){r.state='invalid';r.revision++;r.history.push({at:session.now,text:'物品已关闭，申请失效'});}}}list();}
 document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;try{
  if(b.dataset.tab){settings.tab=b.dataset.tab;listContext=null;offset=0;saveFilters();list();return;}if(b.dataset.detail){rememberRequest(b);detail(b.dataset.detail);return;}
  const action=b.dataset.action;if(!action)return;if(confirmations[action]){confirm(action);return;}
  if(action==='login'){$('scenario').value='normal';switchScenario();toast('已切换到登录演示');}
  if(action==='clear-filter'){settings.status='all';listContext=null;offset=0;saveFilters();list();}
  if(action==='retry'){$('scenario').value='normal';list();}
  if(action==='query'){const result=M.query(session,operationKey(currentId));detail(currentId);toast(result==='done'?'本次操作已确认（演示）':'申请已有变化，请核对最新状态');}
  if(action==='trade'||action==='order'){const r=M.get(session,currentId);if(!M.actions(session,r).includes(action))throw Error('当前状态不允许继续此操作');location.href=tradeUrl(r,action);}
 }catch(e){failure(e.message);}});
 $('confirm-action').addEventListener('click',()=>{if(!pending||$('confirm-action').disabled)return;$('confirm-action').disabled=true;const cmd={...pending};try{const result=M.perform(session,cmd,{unknown:$('scenario').value==='unknown'});closeDialog();detail(cmd.id);if(result==='done')toast('本次操作已记录（演示）');}catch(e){closeDialog();detail(cmd.id);failure(e.message);}});
 $('cancel-action').addEventListener('click',closeDialog);$('confirm-dialog').addEventListener('click',e=>{if(e.target===$('confirm-dialog'))closeDialog();});
 document.addEventListener('keydown',e=>{if($('confirm-dialog').hidden)return;if(e.key==='Escape'){closeDialog();return;}if(e.key==='Tab'){const first=$('cancel-action'),last=$('confirm-action');if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
 $('back').addEventListener('click',()=>{if(view==='detail'){list();restoreRequest();return;}location.href=params.get('from')==='home'?'v01-v02.html':'v05.html';});$('status-filter').addEventListener('change',e=>{settings.status=e.target.value;listContext=null;offset=0;saveFilters();list();});$('scenario').addEventListener('change',switchScenario);$('reset').addEventListener('click',()=>{$('scenario').value='normal';settings.tab='sent';settings.status='all';saveFilters();switchScenario();});
 list();if(params.has('offset')){offset=position(params.get('offset'));$('contact-scroll').scrollTop=offset;}if(params.has('returnId'))listContext={id:params.get('returnId'),index:Math.min(50,Math.floor(position(params.get('listIndex')))),outer:position(params.get('listOuter'))};if(params.get('entry')==='apply')detail(params.get('post')==='lamp'?'LAMP':'NEW');else if(params.has('id'))detail(params.get('id'));if(view==='detail'&&['trade','order'].includes(params.get('detailAction'))){const target=[...$('actions').querySelectorAll('[data-action]')].find(button=>button.dataset.action===params.get('detailAction'));target?.focus({preventScroll:true});$('contact-scroll').scrollTop=position(params.get('detailTop'));scrollTo(0,position(params.get('detailOuter')));}
})();
</script></body></html>
